<!-- EILAN EXPERIENCES (source: experiences/src/experiences_tpl.html) -->
<style>
/* ===== 🔊 تجارب إيلان التفاعلية — Interactive Experiences & Instant Self-Serve Engine (.xpr-*) ===== */
.xpr-wrap{display:flex;flex-direction:column;gap:18px}
svg.xpr-shape-svg,svg.xpr-mini-svg,svg.xpr-seal-svg{stroke:none;stroke-width:0;fill:none;overflow:visible!important;display:block}

/* Product Switcher Shelf inside eilan://experiences */
.xpr-pshelf{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.xpr-ptab{position:relative;padding:15px 16px;border-radius:18px;border:1.5px solid var(--bd);background:#0C101B;color:#F2F5FA;font-family:inherit;text-align:start;cursor:pointer;display:flex;align-items:center;gap:14px;transition:.22s}
.xpr-ptab:hover{border-color:rgba(226,180,80,.55);transform:translateY(-1px)}
.xpr-ptab.on{border-color:#E2B450;background:radial-gradient(circle at 88% 20%,rgba(226,180,80,.18),transparent 58%),#101626;box-shadow:0 12px 30px rgba(0,0,0,.32)}
.xpr-ptab-ic{width:54px;height:54px;border-radius:14px;background:rgba(226,180,80,.12);border:1px solid rgba(226,180,80,.35);display:grid;place-items:center;flex-shrink:0}
.xpr-ptab-ic svg.xpr-shape-svg,.xpr-ptab-ic svg.xpr-seal-svg{width:44px;height:44px}
.xpr-ptab-ic .xg-float,.xpr-ptab-ic .xg-tassel{animation:none!important}
.xpr-ptab-txt{flex:1;min-width:0}
.xpr-ptab-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:3px}
.xpr-ptab-top b{font-size:15px;color:#F2F5FA}
.xpr-ptab-pr{padding:3px 9px;border-radius:999px;background:rgba(226,180,80,.18);color:#F6DD8F;font-size:12px;font-weight:900;white-space:nowrap}
.xpr-ptab-txt span{display:block;font-size:12px;color:var(--mu);line-height:1.5}

/* Product #2: Open When Letters («رسائل افتحها لمّا…») Interactive Sealed Box & Letter View */
.xpr-wbody{position:relative;z-index:2;width:100%;max-width:480px;margin:auto;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:12px}
.xpr-whead h3{margin:0 0 4px;font-size:19px;font-weight:900;color:var(--xtxt);line-height:1.4}
.xpr-whead p{margin:0;font-size:12.5px;color:var(--xmu);line-height:1.55}
.xpr-wgrid{width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.xpr-wenv{position:relative;padding:14px 11px 12px;border-radius:16px;border:1.2px solid var(--xbd);background:var(--xcard);color:var(--xtxt);font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:0 10px 24px rgba(0,0,0,.22);overflow:hidden;transition:transform .22s,border-color .22s}
.xpr-wenv:last-child:nth-child(odd){grid-column:1 / -1;max-width:236px;justify-self:center;width:100%}
.xpr-wenv::before{content:"";position:absolute;top:0;left:0;right:0;height:42px;background:linear-gradient(180deg,color-mix(in srgb,var(--xacc,#E2B450) 18%,transparent),transparent);clip-path:polygon(0 0,100% 0,50% 100%);pointer-events:none}
.xpr-wenv:hover{transform:translateY(-3px);border-color:var(--xacc)}
.xpr-wenv:active{transform:scale(.97)}
.xpr-wenv.done{opacity:.92}
.xpr-wenv-done{position:absolute;top:7px;inset-inline-start:7px;padding:2px 7px;border-radius:99px;font-size:10px;font-weight:800;background:rgba(15,107,68,.28);border:1px solid rgba(216,255,230,.4);color:#D8FFE6}
.xpr-wenv-em{position:absolute;top:7px;inset-inline-end:8px;font-size:15px}
.xpr-wenv-seal{width:46px;height:46px;margin-top:4px;position:relative;z-index:1;transition:transform .28s}
.xpr-wenv:hover .xpr-wenv-seal{transform:scale(1.08) rotate(-4deg)}
.xpr-wenv-seal svg.xpr-seal-svg{width:46px;height:46px}
.xpr-wenv-kicker{font-size:10.5px;font-weight:900;color:var(--xacc);letter-spacing:.4px}
.xpr-wenv-ttl{font-size:13px;font-weight:800;line-height:1.4;color:var(--xtxt);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.xpr-wletter{width:100%;padding:20px 18px;border-radius:20px;background:var(--xcard);border:1.6px solid var(--xacc);box-shadow:0 18px 44px rgba(0,0,0,.3);text-align:start;animation:xprIn .38s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:12px}
.xpr-wl-top{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px dashed var(--xbd)}
.xpr-wl-ic{width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--xacc,#E2B450) 16%,transparent);border:1px solid var(--xbd);display:grid;place-items:center;font-size:21px;flex-shrink:0}
.xpr-wl-top small{display:block;font-size:11px;font-weight:900;color:var(--xacc)}
.xpr-wl-top h4{margin:2px 0 0;font-size:16px;font-weight:900;color:var(--xtxt);line-height:1.35}
.xpr-wl-txt{margin:0;font-size:15.5px;line-height:1.85;font-weight:700;color:var(--xtxt);white-space:pre-line}
.xpr-wl-gift{padding:10px 13px;border-radius:13px;background:color-mix(in srgb,var(--xacc,#E2B450) 14%,transparent);border:1px solid var(--xbd);font-size:13.5px;font-weight:800;color:var(--xtxt);display:flex;align-items:center;gap:8px}
.xpr-wnav{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

/* Envelope Editor Tabs in Customizer */
.xpr-wtabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.xpr-wtab{padding:7px 11px;border-radius:10px;border:1.5px solid var(--bd);background:#0E121E;color:#F2F5FA;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.xpr-wtab.on,.xpr-wtab:hover{border-color:#E2B450;background:rgba(226,180,80,.16);color:#F6DD8F}
.xpr-wtab.add{border-style:dashed;border-color:rgba(226,180,80,.55);color:#F6DD8F}
.xpr-wbox-ed{padding:14px;border-radius:14px;background:#0A0E18;border:1px solid rgba(226,180,80,.32);display:flex;flex-direction:column;gap:10px}
.xpr-seals{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.xpr-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:22px;background:radial-gradient(circle at 88% 18%,rgba(226,180,80,.16),transparent 52%),radial-gradient(circle at 12% 85%,rgba(15,107,68,.2),transparent 55%),#0B0E17;border:1px solid var(--bd2);border-radius:20px}
.xpr-hero h1{font-size:30px;margin:4px 0 8px;line-height:1.25}
.xpr-hero p{color:var(--mu);max-width:690px;margin:0;line-height:1.7;font-size:14.5px}
.xpr-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.xpr-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:800;background:rgba(242,245,250,.06);border:1px solid rgba(226,180,80,.28);color:#F2F5FA}
.xpr-pill.gold{background:rgba(226,180,80,.15);border-color:rgba(226,180,80,.5);color:#F6DD8F}
.xpr-pill.grn{background:rgba(15,107,68,.24);border-color:rgba(216,255,230,.35);color:#D8FFE6}

.xpr-flow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.xpr-step{padding:14px 16px;border-radius:16px;background:#0D101A;border:1px solid var(--bd);display:flex;align-items:flex-start;gap:12px}
.xpr-step i{width:30px;height:30px;border-radius:10px;background:rgba(226,180,80,.16);border:1px solid rgba(226,180,80,.4);color:#F6DD8F;font-style:normal;font-weight:900;display:grid;place-items:center;flex-shrink:0;font-size:14px}
.xpr-step b{display:block;font-size:13.5px;margin-bottom:3px;color:#F2F5FA}
.xpr-step span{font-size:12.5px;color:var(--mu);line-height:1.55;display:block}

.xpr-ownbar{padding:14px 16px;border-radius:16px;background:rgba(226,180,80,.1);border:1px dashed rgba(226,180,80,.5);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.xpr-ownbar b{color:#F6DD8F;font-size:13.5px}
.xpr-ownbar small{display:block;color:var(--mu);font-size:12px;margin-top:2px}

/* Studio Workspace: Side-by-side on iPad Landscape & Desktop */
.xpr-work{display:grid;grid-template-columns:minmax(320px,1.02fr) minmax(320px,1fr);gap:18px;align-items:start}
.xpr-stage-col{position:sticky;top:12px;display:flex;flex-direction:column;gap:10px}
.xpr-stage-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.xpr-stabs{display:flex;gap:6px;flex-wrap:wrap}
.xpr-stab{padding:7px 12px;border-radius:10px;border:1px solid var(--bd);background:#0E121E;color:var(--mu);font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;transition:.2s}
.xpr-stab.on{background:rgba(226,180,80,.18);border-color:#E2B450;color:#F6DD8F}

/* Interactive Surprise Experience Frame */
.xpr-frame{position:relative;min-height:520px;border-radius:24px;overflow:hidden;padding:26px 22px 20px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;border:1px solid rgba(226,180,80,.36);box-shadow:0 22px 56px rgba(0,0,0,.48);transition:background .35s,color .35s;user-select:none;-webkit-tap-highlight-color:transparent}
.xpr-frame[data-th="gold"]{--xbg:#07080C;--xbg2:#0F1320;--xcard:rgba(15,20,34,.88);--xacc:#E2B450;--xacc2:#F6DD8F;--xtxt:#F2F5FA;--xmu:rgba(242,245,250,.72);--xbd:rgba(226,180,80,.38);--xsub:#1E44C8;--xbtnfg:#07080C;background:radial-gradient(circle at 50% 22%,rgba(226,180,80,.18),transparent 54%),radial-gradient(circle at 18% 82%,rgba(15,107,68,.2),transparent 52%),radial-gradient(circle at 84% 78%,rgba(30,68,200,.2),transparent 52%),linear-gradient(180deg,#0D111C,#07080C);color:#F2F5FA}
.xpr-frame[data-th="forest"]{--xbg:#071810;--xbg2:#0B291B;--xcard:rgba(10,38,25,.9);--xacc:#E2B450;--xacc2:#D8FFE6;--xtxt:#F2F7F4;--xmu:rgba(216,255,230,.75);--xbd:rgba(15,107,68,.55);--xsub:#0F6B44;--xbtnfg:#07080C;background:radial-gradient(circle at 50% 22%,rgba(226,180,80,.16),transparent 55%),radial-gradient(circle at 80% 80%,rgba(15,107,68,.28),transparent 55%),linear-gradient(180deg,#0C2B1D,#06130C);color:#F2F7F4}
.xpr-frame[data-th="royal"]{--xbg:#080F26;--xbg2:#0B1F5E;--xcard:rgba(11,28,78,.88);--xacc:#E2B450;--xacc2:#F6DD8F;--xtxt:#F2F5FF;--xmu:rgba(230,238,255,.76);--xbd:rgba(30,68,200,.52);--xsub:#1E44C8;--xbtnfg:#07080C;background:radial-gradient(circle at 50% 20%,rgba(226,180,80,.17),transparent 54%),radial-gradient(circle at 20% 82%,rgba(30,68,200,.32),transparent 55%),linear-gradient(180deg,#0E1E52,#070A16);color:#F2F5FF}
.xpr-frame[data-th="velvet"]{--xbg:#0B0714;--xbg2:#1B0F33;--xcard:rgba(28,16,52,.9);--xacc:#E2B450;--xacc2:#F6DD8F;--xtxt:#F5F2FA;--xmu:rgba(245,242,250,.74);--xbd:rgba(74,42,143,.52);--xsub:#4A2A8F;--xbtnfg:#07080C;background:radial-gradient(circle at 50% 22%,rgba(226,180,80,.16),transparent 54%),radial-gradient(circle at 82% 82%,rgba(74,42,143,.32),transparent 54%),linear-gradient(180deg,#1A0F30,#07080C);color:#F5F2FA}

.xpr-top{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:2}
.xpr-to{padding:5px 13px;border-radius:999px;background:var(--xcard);border:1px solid var(--xbd);font-size:12.5px;font-weight:800;color:var(--xtxt);max-width:72%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xpr-wm{padding:4px 10px;border-radius:999px;background:rgba(226,180,80,.18);border:1px solid var(--xbd);font-size:11px;font-weight:800;color:var(--xacc)}
.xpr-sndbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--xbd);background:var(--xcard);color:var(--xtxt);cursor:pointer;display:grid;place-items:center;font-size:14px}

.xpr-body{position:relative;z-index:2;width:100%;max-width:440px;margin:auto;padding:14px 4px;display:flex;flex-direction:column;align-items:center;gap:16px}
.xpr-hook{font-size:20px;font-weight:900;line-height:1.45;color:var(--xtxt);margin:0}
.xpr-subhint{font-size:13px;color:var(--xmu);margin:0}

/* Unclipped Interactive 3D Gift Shape Button */
.xpr-cube-btn{position:relative;width:196px;height:196px;border:0;background:transparent;cursor:pointer;padding:8px;display:grid;place-items:center;touch-action:manipulation;overflow:visible;transition:transform .28s cubic-bezier(.2,.9,.3,1.2)}
.xpr-cube-btn:hover{transform:scale(1.04)}
.xpr-cube-btn:active{transform:scale(.95)}
.xpr-cube-halo{position:absolute;inset:12px;border-radius:50%;background:radial-gradient(circle,rgba(226,180,80,.3),transparent 68%);background:radial-gradient(circle,color-mix(in srgb,var(--xacc,#E2B450) 34%,transparent),transparent 68%);animation:xprPulse 3.2s ease-in-out infinite;pointer-events:none}
.xpr-shape-svg{width:176px;height:176px;position:relative;z-index:2;overflow:visible!important;stroke:none!important;fill:none;filter:drop-shadow(0 16px 28px rgba(0,0,0,.44))}
.xpr-shape-svg .xg-float{transform-box:fill-box;transform-origin:center;animation:xprFloat 3s ease-in-out infinite}
.xpr-shape-svg .xg-tassel{transform-origin:70px 48px;animation:xprSwing 3.2s ease-in-out infinite}
.xpr-cube-btn.burst .xg-float{animation:xprBurst .62s cubic-bezier(.2,.9,.3,1.2) forwards}
@keyframes xprFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-7px) rotate(1.5deg)}}
@keyframes xprSwing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(5deg)}}
@keyframes xprPulse{0%,100%{transform:scale(.94);opacity:.65}50%{transform:scale(1.08);opacity:1}}
@keyframes xprBurst{0%{transform:scale(1)}45%{transform:translateY(-13px) scale(1.12) rotate(4deg)}100%{transform:translateY(-4px) scale(1.04)}}

.xpr-tap-cta{padding:11px 22px;border-radius:999px;border:1px solid var(--xacc);background:var(--xcard);color:var(--xtxt);font-family:inherit;font-size:14px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.22);transition:.22s}
.xpr-tap-cta:hover{background:var(--xacc);color:var(--xbtnfg,#07080C)}

/* Stage 1 & Stage 2 Cards */
.xpr-mcard{width:100%;padding:22px 20px;border-radius:20px;background:var(--xcard);border:1px solid var(--xbd);box-shadow:0 16px 38px rgba(0,0,0,.26);animation:xprIn .42s cubic-bezier(.2,.8,.2,1)}
.xpr-mstep{font-size:11.5px;font-weight:900;letter-spacing:1.2px;color:var(--xacc);margin-bottom:8px;text-transform:uppercase}
.xpr-mtxt{font-size:17px;line-height:1.8;font-weight:700;color:var(--xtxt);margin:0;white-space:pre-line}

.xpr-vault{width:100%;padding:24px 20px;border-radius:22px;background:var(--xcard);border:2px solid var(--xacc);box-shadow:0 18px 46px rgba(0,0,0,.32);animation:xprIn .48s cubic-bezier(.18,.88,.24,1.08);position:relative;overflow:visible}
.xpr-vault-ic{width:68px;height:68px;margin:0 auto 8px;display:block}
.xpr-vault-ic svg.xpr-shape-svg{width:68px;height:68px}
.xpr-gift-lbl{font-size:12px;font-weight:800;color:var(--xacc);letter-spacing:1px;margin-bottom:6px}
.xpr-gift-val{font-size:24px;font-weight:900;line-height:1.4;color:var(--xtxt);margin:0 0 8px;word-break:break-word}
.xpr-gift-sub{font-size:14px;line-height:1.65;color:var(--xmu);margin:0 0 14px;white-space:pre-line}
.xpr-from{display:inline-block;padding:6px 14px;border-radius:999px;background:var(--xcard);border:1px solid var(--xbd);font-size:13px;font-weight:800;color:var(--xtxt)}
.xpr-extlink{margin-top:12px;display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:12px;background:var(--xacc);color:var(--xbtnfg,#07080C);font-weight:900;font-size:13.5px;text-decoration:none}
@keyframes xprIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}

/* Calm Floating Sparks (dynamically tinted with --xacc) */
.xpr-sparks{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.xpr-sparks i{position:absolute;bottom:-12px;width:6px;height:6px;border-radius:2px;background:var(--xacc,#E2B450);opacity:0;animation:xprSpark 5.2s ease-in-out infinite}
@keyframes xprSpark{0%{transform:translateY(0) rotate(0deg);opacity:0}25%{opacity:.55}80%{opacity:.25}100%{transform:translateY(-440px) rotate(140deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.xpr-cube-halo,.xpr-shape-svg .xg-float,.xpr-shape-svg .xg-tassel,.xpr-sparks i{animation:none!important}}

/* Eilan Signature Footer inside every Experience */
.xpr-foot{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--xbd);font-size:11.5px;color:var(--xmu);z-index:2}
.xpr-sig{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--xtxt);text-decoration:none;opacity:.9}
.xpr-sig svg.xpr-mini-svg{width:20px;height:20px;border-radius:5px}
.xpr-dots{display:flex;gap:6px;align-items:center}
.xpr-dots span{width:7px;height:7px;border-radius:50%;background:var(--xmu);opacity:.35;transition:.25s}
.xpr-dots span.on{width:20px;border-radius:99px;background:var(--xacc);opacity:1}

/* Customizer Form Panel */
.xpr-form{padding:20px;display:flex;flex-direction:column;gap:14px}
.xpr-form h3{margin:0;font-size:18px;display:flex;align-items:center;gap:8px}
.xpr-sec-lbl{font-size:12.5px;font-weight:800;color:#F2F5FA;margin-bottom:6px;display:block}
.xpr-presets{display:flex;gap:6px;flex-wrap:wrap}
.xpr-pre{padding:7px 11px;border-radius:10px;border:1px solid var(--bd);background:#0E121E;color:#F2F5FA;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;transition:.18s}
.xpr-pre.on,.xpr-pre:hover{border-color:#E2B450;background:rgba(226,180,80,.16);color:#F6DD8F}

/* 5 Ready Shapes + [+] Custom Topic Shape Picker */
.xpr-shapes{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.xpr-shbtn{padding:8px 4px 7px;border-radius:12px;border:1.5px solid var(--bd);background:#0E121E;color:#F2F5FA;font-family:inherit;font-size:11px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:.18s}
.xpr-shbtn svg.xpr-shape-svg{width:42px;height:42px}
.xpr-shbtn .xg-float,.xpr-shbtn .xg-tassel{animation:none!important}
.xpr-shbtn.on,.xpr-shbtn:hover{border-color:#E2B450;background:rgba(226,180,80,.15);color:#F6DD8F}
.xpr-shbtn.plus{border-style:dashed;border-color:rgba(226,180,80,.55);background:rgba(226,180,80,.07)}
.xpr-plus-ic{width:38px;height:38px;border-radius:10px;background:rgba(226,180,80,.16);border:1px solid rgba(226,180,80,.45);color:#F6DD8F;display:grid;place-items:center;font-size:21px;font-weight:900;line-height:1}

/* Expandable Custom Topic Shape & Custom Color Drawers */
.xpr-drawer{margin-top:8px;padding:14px;border-radius:14px;background:#090D16;border:1px solid rgba(226,180,80,.38);display:flex;flex-direction:column;gap:11px;animation:xprIn .25s ease}
.xpr-topic-row{display:flex;gap:7px;flex-wrap:wrap}
.xpr-topic-row .input{flex:1;min-width:170px}
.xpr-xshapes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.xpr-xshapes .xpr-shbtn{padding:6px 3px;font-size:10.5px}
.xpr-xshapes .xpr-shbtn svg.xpr-shape-svg{width:36px;height:36px}
.xpr-sym-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.xpr-sym-in{width:120px!important;text-align:center;font-size:16px!important;font-weight:800}
.xpr-emo-chips{display:flex;gap:5px;flex-wrap:wrap}
.xpr-emo-chip{padding:5px 9px;border-radius:8px;border:1px solid var(--bd);background:#111625;color:#F2F5FA;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.xpr-emo-chip:hover,.xpr-emo-chip.on{border-color:#E2B450;background:rgba(226,180,80,.16);color:#F6DD8F}

/* 4 Ready Themes + [+] Custom Colors Picker */
.xpr-swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}

function xprCleanHex(v, fb='#E2B450'){
  const s = String(v||'').trim();
  return /^#[0-9a-fA-F]{6}$/.test(s) ? s.toUpperCase() : fb;
}
function xprHexRgb(hex, fb=[14,18,30]){
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex||'').trim());
  if(!m) return fb;
  const n = parseInt(m[1], 16);
  return [(n>>16)&255, (n>>8)&255, n&255];
}
function xprCustomFrameStyle(cb='#1B120C', ca='#DDA35D'){
  const bgHex = xprCleanHex(cb, '#1B120C');
  const acHex = xprCleanHex(ca, '#DDA35D');
  const [br,bg,bb] = xprHexRgb(bgHex, [27,18,12]);
  const [ar,ag,ab] = xprHexRgb(acHex, [221,163,93]);
  const lumBg = (0.299*br + 0.587*bg + 0.114*bb) / 255;
  const lumAc = (0.299*ar + 0.587*ag + 0.114*ab) / 255;
  const light = lumBg > 0.58;
  const txt = light ? '#14150F' : '#F5F7FA';
  const mu = light ? 'rgba(20,21,15,.68)' : 'rgba(245,247,250,.74)';
  const card = light
    ? 'rgba(255,255,255,.84)'
    : `rgba(${Math.round(br*0.72)},${Math.round(bg*0.72)},${Math.round(bb*0.72)},.9)`;
  const bd = `rgba(${ar},${ag},${ab},${light?.45:.42})`;
  const bg2 = light
    ? `rgb(${Math.max(0,br-18)},${Math.max(0,bg-18)},${Math.max(0,bb-18)})`
    : `rgb(${Math.max(0,Math.round(br*0.52))},${Math.max(0,Math.round(bg*0.52))},${Math.max(0,Math.round(bb*0.52))})`;
  const btnFg = lumAc > 0.5 ? '#07080C' : '#FFFFFF';
  return `--xbg:${bgHex};--xbg2:${bg2};--xcard:${card};--xacc:${acHex};--xacc2:${acHex};--xtxt:${txt};--xmu:${mu};--xbd:${bd};--xsub:${acHex};--xbtnfg:${btnFg};background:radial-gradient(circle at 50% 22%,rgba(${ar},${ag},${ab},.24),transparent 56%),linear-gradient(180deg,${bgHex},${bg2});color:${txt};border-color:${bd}`;
}

/* Smart Topic -> Shape + Optional Custom Colors Matcher */
function xprMatchTopic(rawTopic){
  const t = String(rawTopic||'').trim();
  if(!t) return null;
  if(/قهو|كافي|لاتيه|ماتشا|اسبريسو|كوب|coffee|cafe|latte|matcha/i.test(t)) return { sh:'coffee', cb:'#1B120C', ca:'#DDA35D' };
  if(/عطر|بخور|عود|مسك|طيب|perfume|oud|scent/i.test(t)) return { sh:'perfume', cb:'#191122', ca:'#E6BC6A' };
  if(/خاتم|خطوب|زواج|عرس|ملكه|ملكة|ذهب|الماس|ألماس|سوار|عقد|مجوهرات|ring|wedding|diamond/i.test(t)) return { sh:'ring', cb:'#161226', ca:'#F5D993' };
  if(/ميلاد|كيك|حفل|تورت|cake|birthday|party/i.test(t)) return { sh:'cake', cb:'#241021', ca:'#F4A3C0' };
  if(/سفر|رحل|طيار|تذكر|مطار|فندق|اجاز|إجاز|لندن|باريس|دبي|travel|trip|flight|ticket/i.test(t)) return { sh:'plane', cb:'#0A1D3B', ca:'#F0C96B' };
  if(/سيار|مركب|قياد|رخص|مفتاح|car|drive|auto/i.test(t)) return { sh:'car', cb:'#0D131C', ca:'#E2B450' };
  if(/مولود|بيبي|طفل|قدوم|سلامتك|ولاد|baby|newborn/i.test(t)) return { sh:'baby', cb:'#102136', ca:'#F6DD8F' };
  if(/تاج|ملك|فخم|امير|أمير|تميز|تميّز|crown|vip|royal/i.test(t)) return { sh:'crown', cb:'#160E29', ca:'#F6DD8F' };
  if(/حب|شوق|غلا|ذكرى|امي|أمي|ابي|أبي|صداق|قلب|love|heart|mom|dad/i.test(t)) return { sh:'heart', cb:'#290B17', ca:'#F48FB1' };
  if(/فوز|بطول|كأس|كاس|انجاز|إنجاز|جائز|مسابق|تحدي|trophy|win|award/i.test(t)) return { sh:'trophy', cb:'#0C2118', ca:'#F6DD8F' };
  if(/تخرج|جامع|ثانوي|ماجستير|دكتوراه|شهاد|grad/i.test(t)) return { sh:'grad' };
  if(/ورد|زهر|باقه|باقة|شكر|امتنان|سلامه|سلامة|rose|flower|thank/i.test(t)) return { sh:'roses' };
  if(/عيد|عيدي|مالي|تحويل|ريال|فلوس|eid|cash/i.test(t)) return { sh:'envelope' };

  const symRules = [
    [/طب|دكتور|عياد|تمريض|صيدل|doctor|med/i, '🩺', '#0C1E33', '#E2B450'],
    [/قيمنق|لعب|بلايستيشن|سوني|ستيم|game|gaming/i, '🎮', '#140B29', '#B392FF'],
    [/رمضان|عمر|حج|مكه|مكة|مدين|هلال|مبارك الشهر|ramadan|umrah/i, '🌙', '#092218', '#F6DD8F'],
    [/بيت|منزل|شقه|شقة|سكن|نقل|home|house/i, '🏡', '#12261C', '#E2B450'],
    [/وظيف|عمل|ترقي|تعيين|مشروع|شرك|افتتاح|job|work|business/i, '💼', '#0E1A38', '#E2B450'],
    [/كتاب|قراء|رواي|علم|دراس|مذاكر|book|study/i, '📚', '#1C1610', '#E8C068'],
    [/رسم|فن|تصميم|لوح|art|design/i, '🎨', '#1E122B', '#F2C166'],
    [/رياض|نادي|كوره|كرة|تمرين|sport|gym|football/i, '⚽', '#0B2418', '#E2B450'],
    [/ساع|watch/i, '⌚', '#10141D', '#E2B450'],
    [/شوكولا|حلى|حلا|سويت|chocolate|sweet/i, '🍫', '#21130D', '#E3B068'],
    [/تصوير|كاميرا|فوتو|camera|photo/i, '📷', '#12151E', '#E2B450'],
    [/موسيق|بيانو|عود|غناء|music|piano/i, '🎶', '#171128', '#E8BE66'],
    [/كشت|بر|مخيم|شتاء|kashta|camp/i, '🔥', '#1E140C', '#EE9B4B'],
    [/خيل|فرس|فروسي|horse/i, '🐎', '#1C140E', '#E2B450'],
    [/قط|اليف|أليف|حيوان|cat|pet/i, '🐾', '#1A1524', '#F0C27B']
  ];
  for(const [re, sym, cb, ca] of symRules){
    if(re.test(t)) return { sh:'crest', st:sym, cb, ca };
  }
  const firstWord = t.split(/\s+/)[0].slice(0, 5);
  return { sh:'crest', st:firstWord || '✨', cb:'#10162B', ca:'#E2B450' };
}

/* Compact Lossless Arabic+UTF8 Byte Packer (cuts Arabic URL & QR size by ~48%) */
function xprPackBytes(str){
  const out = [];
  const enc = new TextEncoder();
  for(const ch of String(str||'')){
    const cp = ch.codePointAt(0);
    if(cp < 0x80){ out.push(cp); }
    else if(cp >= 0x0600 && cp <= 0x067E){ out.push(0x80 + (cp - 0x0600)); }
    else {
      const b = enc.encode(ch);
      out.push(0xFF, b.length, ...b);
    }
  }
  return new Uint8Array(out);
}
function xprUnpackBytes(bytes){
  let out = '', i = 0;
  const dec = new TextDecoder();
  while(i < bytes.length){
    const b = bytes[i++];
    if(b < 0x80){ out += String.fromCharCode(b); }
    else if(b < 0xFF){ out += String.fromCharCode(0x0600 + (b - 0x80)); }
    else {
      const ln = bytes[i++] || 0;
      out += dec.decode(bytes.subarray(i, i + ln));
      i += ln;
    }
  }
  return out;
}

  }
  const fmt = 0x77C4;
  const fP = [[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],[7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]];
  for(let i=0;i<15;i++){
    const bit = (fmt>>>i)&1;
    const [r,c] = fP[14-i];
    M[r][c] = bit;
    if(i>=8) M[N-1-(14-i)][8] = bit;
    else M[8][N-1-i] = bit;
  }
  return M;
}

/* Activate Salla Code (Client-Side SHA-256 — Supports CUB1, OWHN, and EXPB Pass) */
async function xprVerifyCode(ev, prodKey='cube'){
  ev.preventDefault();
  const f = ev.target;
  const msg = $('#xprCodeMsg');
  const pref = prodKey === 'when' ? 'OWHN' : 'CUB1';
  const raw = String(f.code.value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  let body = raw;
  if(!raw.startsWith('EXPB') && !raw.startsWith('CUB1') && !raw.startsWith('OWHN')) body = pref + raw;

  if(body.length < 15){
    msg.className = 'lh-msg bad';
    msg.textContent = gzL(`الكود ناقص — الصيغة الصحيحة: ${pref}-XXXX-XXXX-XXXX`, `Code incomplete — expected ${pref}-XXXX-XXXX-XXXX`);
    return;
  }
  const dg = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('eilan-arc-v1:' + body)));
  const hx = Array.from(dg, b => b.toString(16).padStart(2,'0')).join('').slice(0, 24);
  const validProd = Array.isArray(XPR_CODES[prodKey]) && XPR_CODES[prodKey].includes(hx);
  const validBundle = Array.isArray(XPR_CODES.bundle) && XPR_CODES.bundle.includes(hx);

  if(!validProd && !validBundle){
    msg.className = 'lh-msg bad';
    msg.textContent = '❌ ' + gzL('الكود غير صحيح — تأكد من نسخه كما وصلك من سلة','Invalid activation code');
    return;
  }
  S.unlk = S.unlk || {};
  if(validBundle) S.unlk.x_bundle = 1;
  else S.unlk['x_' + prodKey] = 1;
  S.owned = S.owned || {};
  S.owned['x-' + prodKey] = Date.now();
  XPR_STATE.previewSimVisitor = false;
  save();
  xprPlayChime('joy', 2);
  toast('🎉 ' + gzL('تم التفعيل فوراً! رابطك وبطاقتك جاهزة للاستلام الآن','Unlocked! Your link & QR card are ready now'));
  xprRefreshStudio();
}

/* Luxury Landscape Gift Card Renderer (1600x1000 Canvas -> PNG or Landscape Print PDF, supports Custom Colors & Shapes) */
async function xprDrawGiftCardCanvas(D){
  const url = xprShareUrl(D);
  const qr = xprMakeQR(url);
  const W = 1600, H = 1000;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const en = D.lg === 'en';

  const isCust = D.th === 'custom';
  const cbHex = isCust ? xprCleanHex(D.cb, '#1B120C') : (D.th==='forest'?'#0C2B1D':D.th==='royal'?'#0E1E52':D.th==='velvet'?'#1F1139':'#0E1426');
  const caHex = isCust ? xprCleanHex(D.ca, '#DDA35D') : '#E2B450';
  const [br,bg,bb] = xprHexRgb(cbHex);
  const [ar,ag,ab] = xprHexRgb(caHex);
  const light = (0.299*br + 0.587*bg + 0.114*bb)/255 > 0.58;
  const txtMain = light ? '#14150F' : '#F2F5FA';
  const txtSub  = light ? 'rgba(20,21,15,0.75)' : 'rgba(242,245,250,0.85)';
  const txtMu   = light ? 'rgba(20,21,15,0.56)' : 'rgba(242,245,250,0.6)';

  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, cbHex);
  g.addColorStop(1, light ? `rgb(${Math.max(0,br-18)},${Math.max(0,bg-18)},${Math.max(0,bb-18)})` : '#07080C');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const rg = ctx.createRadialGradient(W*0.72, H*0.35, 20, W*0.72, H*0.35, 520);
  rg.addColorStop(0, `rgba(${ar},${ag},${ab},0.22)`);
  rg.addColorStop(1, `rgba(${ar},${ag},${ab},0)`);
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = caHex;
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.roundRect(36, 36, W-72, H-72, 34); ctx.stroke();
  ctx.strokeStyle = `rgba(${ar},${ag},${ab},0.3)`;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(54, 54, W-108, H-108, 26); ctx.stroke();

  const drawSvgStr = (svgStr, x, y, w, h)=>new Promise(res=>{
    const im = new Image();
    im.onload = ()=>{ try{ ctx.drawImage(im, x, y, w, h); }catch(e){} res(); };
    im.onerror = ()=>res();
    im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
  });

  const qrBoxX = en ? W - 540 : 100;
  const qrBoxY = 150, qrBoxW = 440, qrBoxH = 700;
  ctx.fillStyle = light ? 'rgba(255,255,255,0.82)' : 'rgba(7,8,12,0.74)';
  ctx.strokeStyle = `rgba(${ar},${ag},${ab},0.48)`;
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.roundRect(qrBoxX, qrBoxY, qrBoxW, qrBoxH, 28); ctx.fill(); ctx.stroke();

  if(qr){
    const qSize = 340;
    const qX = qrBoxX + (qrBoxW - qSize)/2, qY = qrBoxY + 44;
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.roundRect(qX - 18, qY - 18, qSize + 36, qSize + 36, 18); ctx.fill();
    const N = qr.length, cell = qSize / N;
    ctx.fillStyle = '#07080C';
    for(let r=0;r<N;r++){
      for(let c=0;c<N;c++){
        if(qr[r][c]) ctx.fillRect(qX + c*cell, qY + r*cell, Math.ceil(cell), Math.ceil(cell));
      }
    }
  }
  ctx.fillStyle = txtMain;
  ctx.font = '800 25px Cairo, Tajawal, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(en ? 'Scan Camera to Open Gift' : 'وجّه الكاميرا لفتح المفاجأة', qrBoxX + qrBoxW/2, qrBoxY + 462);
  ctx.fillStyle = caHex;
  ctx.font = '700 19px Cairo, Tajawal, sans-serif';
  ctx.fillText(en ? 'Interactive Touch Surprise ✨' : 'تجربة مفاجأة تفاعلية تُفتح باللمس ✨', qrBoxX + qrBoxW/2, qrBoxY + 502);
  await drawSvgStr(xprShapeSvg(D.sh||'envelope', caHex, D.st), qrBoxX + qrBoxW/2 - 64, qrBoxY + 520, 128, 128);

  const txX = en ? 110 : W - 110;
  const maxW = 860;
  ctx.textAlign = en ? 'left' : 'right';
  ctx.direction = en ? 'ltr' : 'rtl';

  await drawSvgStr(xprLogoMini(), en ? 110 : W - 196, 108, 86, 86);
  ctx.fillStyle = caHex;
  ctx.font = '900 24px Cairo, Tajawal, sans-serif';
  ctx.fillText(en ? 'EILAN INTERACTIVE GIFT' : 'بطاقة مفاجأة إيلان التفاعلية', en ? 215 : W - 215, 150);
  ctx.fillStyle = txtMu;
  ctx.font = '700 19px Cairo, Tajawal, sans-serif';
  ctx.fillText('EILAN DOLL · العالم الرقمي', en ? 215 : W - 215, 182);

  ctx.fillStyle = txtMain;
  ctx.font = '900 50px Cairo, Tajawal, sans-serif';
  const toLine = (en ? 'To: ' : 'إهداء خاص إلى: ') + (D.to || '');
  ctx.fillText(toLine.slice(0, 42), txX, 320, maxW);

  ctx.fillStyle = caHex;
  ctx.font = '800 32px Cairo, Tajawal, sans-serif';
  const wrapText = (text, x, y, mw, lh, maxLines)=>{
    const words = String(text||'').replace(/\n+/g,' ').split(/\s+/);
    let line = '', lines = [];
    for(const w of words){
      const test = line ? line + ' ' + w : w;
      if(ctx.measureText(test).width > mw && line){ lines.push(line); line = w; }
      else line = test;
    }
    if(line) lines.push(line);
    lines.slice(0, maxLines).forEach((ln, idx)=> ctx.fillText(ln, x, y + idx*lh));
    return y + Math.min(lines.length, maxLines) * lh;
  };

  let nextY = wrapText(D.hk || '', txX, 415, maxW, 48, 2);

  ctx.fillStyle = txtSub;
  ctx.font = '700 27px Cairo, Tajawal, sans-serif';
  wrapText(D.ms || '', txX, nextY + 42, maxW, 44, 4);

  if(D.fr){
    ctx.fillStyle = caHex;
    ctx.font = '800 28px Cairo, Tajawal, sans-serif';
    ctx.fillText((en ? 'From: ' : 'من: ') + D.fr, txX, 790, maxW);
  }

  ctx.fillStyle = txtMu;
  ctx.font = '700 20px Cairo, Tajawal, sans-serif';
  ctx.fillText('صُنع بتوقيع إيلان دول · EILAN DOLL — تجارب رقمية تفاعلية', txX, 905, maxW);

  return cv;
}

async function xprDownloadCardPNG(){
  if(!xprUnlocked('cube')){ toast(gzL('فعّل الكود أولاً لاستلام البطاقة بدون علامة معاينة','Unlock first to download your gift card')); return; }
  const cv = await xprDrawGiftCardCanvas(XPR_STATE.D);
  cv.toBlob(async blob=>{
    if(!blob) return;
    const file = new File([blob], 'Eilan-Surprise-Card.png', {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:'بطاقة مفاجأة إيلان التفاعلية'}); return; }catch(e){}
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);

    toast('🃏 ' + gzL('تم تحميل بطاقة الباركود الفاخرة (PNG)','Luxury QR Card downloaded'));
  }, 'image/png');
}

/* Luxury 1600x1000 QR Gift Card for Product #2 («رسائل افتحها لمّا…») */
async function xprDrawWhenCardCanvas(WObj){
  const url = xprWhenShareUrl(WObj);
  const qr = xprMakeQR(url);
  const W = 1600, H = 1000;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const en = WObj.lg === 'en';

  const isCust = WObj.th === 'custom';
  const cbHex = isCust ? xprCleanHex(WObj.cb, '#24101B') : (WObj.th==='forest'?'#0C2B1D':WObj.th==='royal'?'#0E1E52':WObj.th==='gold'?'#0E1426':'#1F1139');
  const caHex = isCust ? xprCleanHex(WObj.ca, '#F2B866') : '#E2B450';
  const [br,bg,bb] = xprHexRgb(cbHex);
  const [ar,ag,ab] = xprHexRgb(caHex);
  const light = (0.299*br + 0.587*bg + 0.114*bb)/255 > 0.58;
  const txtMain = light ? '#14150F' : '#F2F5FA';
  const txtSub  = light ? 'rgba(20,21,15,0.78)' : 'rgba(242,245,250,0.86)';
  const txtMu   = light ? 'rgba(20,21,15,0.56)' : 'rgba(242,245,250,0.6)';

  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, cbHex);
  g.addColorStop(1, light ? `rgb(${Math.max(0,br-18)},${Math.max(0,bg-18)},${Math.max(0,bb-18)})` : '#07080C');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const rg = ctx.createRadialGradient(W*0.72, H*0.35, 20, W*0.72, H*0.35, 540);
  rg.addColorStop(0, `rgba(${ar},${ag},${ab},0.22)`);
  rg.addColorStop(1, `rgba(${ar},${ag},${ab},0)`);
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = caHex; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.roundRect(36, 36, W-72, H-72, 34); ctx.stroke();
  ctx.strokeStyle = `rgba(${ar},${ag},${ab},0.3)`; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(54, 54, W-108, H-108, 26); ctx.stroke();

  const drawSvgStr = (svgStr, x, y, w, h)=>new Promise(res=>{
    const im = new Image();
    im.onload = ()=>{ try{ ctx.drawImage(im, x, y, w, h); }catch(e){} res(); };
    im.onerror = ()=>res();
    im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
  });

  const qrBoxX = en ? W - 540 : 100;
  const qrBoxY = 140, qrBoxW = 440, qrBoxH = 720;
  ctx.fillStyle = light ? 'rgba(255,255,255,0.84)' : 'rgba(7,8,12,0.75)';
  ctx.strokeStyle = `rgba(${ar},${ag},${ab},0.48)`; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.roundRect(qrBoxX, qrBoxY, qrBoxW, qrBoxH, 28); ctx.fill(); ctx.stroke();

  if(qr){
    const qSize = 340;
    const qX = qrBoxX + (qrBoxW - qSize)/2, qY = qrBoxY + 42;
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.roundRect(qX - 18, qY - 18, qSize + 36, qSize + 36, 18); ctx.fill();
    const N = qr.length, cell = qSize / N;
    ctx.fillStyle = '#07080C';
    for(let r=0;r<N;r++){
      for(let c=0;c<N;c++){
        if(qr[r][c]) ctx.fillRect(qX + c*cell, qY + r*cell, Math.ceil(cell), Math.ceil(cell));
      }
    }
  }
  ctx.fillStyle = txtMain;
  ctx.font = '800 24px Cairo, Tajawal, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(en ? 'Scan to Open Your Letters' : 'امسح الباركود لفتح صندوق رسائلك', qrBoxX + qrBoxW/2, qrBoxY + 455);
  ctx.fillStyle = caHex;
  ctx.font = '700 18.5px Cairo, Tajawal, sans-serif';
  const cnt = (WObj.it || []).length;
  ctx.fillText(en ? `${cnt} Wax-Sealed Interactive Letters 💌` : `${cnt} ظروف مختومة بالشمع تُفتح باللمس 💌`, qrBoxX + qrBoxW/2, qrBoxY + 493);
  await drawSvgStr(xprWaxSealSvg(WObj.sl||'heart', caHex, WObj.ss), qrBoxX + qrBoxW/2 - 58, qrBoxY + 525, 116, 116);

  const txX = en ? 110 : W - 110;
  const maxW = 860;
  ctx.textAlign = en ? 'left' : 'right';
  ctx.direction = en ? 'ltr' : 'rtl';

  await drawSvgStr(xprLogoMini(), en ? 110 : W - 196, 108, 86, 86);
  ctx.fillStyle = caHex;
  ctx.font = '900 24px Cairo, Tajawal, sans-serif';
  ctx.fillText(en ? 'EILAN "OPEN WHEN…" LETTERS' : 'صندوق رسائل «افتحها لمّا…» التفاعلي', en ? 215 : W - 215, 150);
  ctx.fillStyle = txtMu;
  ctx.font = '700 19px Cairo, Tajawal, sans-serif';
  ctx.fillText('EILAN DOLL · العالم الرقمي', en ? 215 : W - 215, 182);

  ctx.fillStyle = txtMain;
  ctx.font = '900 46px Cairo, Tajawal, sans-serif';
  ctx.fillText(((en ? 'To: ' : 'إهداء خاص إلى: ') + (WObj.to || '')).slice(0, 42), txX, 300, maxW);

  ctx.fillStyle = caHex;
  ctx.font = '800 30px Cairo, Tajawal, sans-serif';
  ctx.fillText(String(WObj.bx || '').slice(0, 62), txX, 368, maxW);

  ctx.fillStyle = txtSub;
  ctx.font = '700 24px Cairo, Tajawal, sans-serif';
  const listItems = (WObj.it || []).slice(0, 6);
  listItems.forEach((it, i)=>{
    const prefix = en ? `${it.em||'💌'} Open when: ` : `${it.em||'💌'} افتحها لمّا `;
    ctx.fillText((prefix + String(it.wh||'')).slice(0, 58), txX, 445 + i * 52, maxW);
  });

  if(WObj.fr){
    ctx.fillStyle = caHex;
    ctx.font = '800 28px Cairo, Tajawal, sans-serif';
    ctx.fillText((en ? 'From: ' : 'من: ') + WObj.fr, txX, 815, maxW);
  }
  ctx.fillStyle = txtMu;
  ctx.font = '700 20px Cairo, Tajawal, sans-serif';
  ctx.fillText('صُنع بتوقيع إيلان دول · EILAN DOLL — تجارب رقمية تفاعلية', txX, 905, maxW);
  return cv;
}

/* Smart Topic Matcher for Product #2 («رسائل افتحها لمّا…») */
function xprRunApplyWhenTopic(){
  const inp = $('#xprWhenTopicInp');
  const val = inp ? inp.value.trim() : XPR_STATE.whenTopicDraft.trim();
  if(!val){ toast(gzL('اكتب موضوع الرسائل أولاً (مثال: قهوة وصداقة، زواج، أمي، سفر، رمضان، طب…)','Type your topic first')); if(inp) inp.focus(); return; }
  XPR_STATE.whenTopicDraft = val;
  const W = XPR_STATE.W;
  const en = W.lg === 'en';
  let sym = '✨', cb = '#1B1429', ca = '#E8BE66', presetToLoad = null;

  if(/سفر|رحل|ابتعاث|غرب|مطار|travel|abroad|trip/i.test(val)){ presetToLoad='travel'; sym='✈️'; cb='#0A1D3B'; ca='#F0C96B'; }
  else if(/تخرج|جامع|شهاد|grad/i.test(val)){ presetToLoad='grad'; sym='🎓'; cb='#0E1A40'; ca='#F6DD8F'; }
  else if(/اختبار|مذاكر|ضغط|امتحان|شغل|عمل|وظيف|ترقي|exam|work|study/i.test(val)){ presetToLoad='care'; sym='💼'; cb='#0C2218'; ca='#E2B450'; }
  else if(/قهو|صداق|صديق|رفيق|coffee|friend/i.test(val)){ sym='☕'; cb='#1B120C'; ca='#DDA35D'; }
  else if(/زواج|خطوب|ذكرى|حب|زوج|شريك|wedding|love|anniversary/i.test(val)){ sym='💍'; cb='#240E1A'; ca='#F4A8C0'; }
  else if(/ام|أم|اب|أب|عائل|والد|mom|dad|family/i.test(val)){ sym='🤍'; cb='#1E1510'; ca='#EBC074'; }
  else if(/مولود|بيبي|طفل|اموم|أموم|baby|newborn/i.test(val)){ sym='🍼'; cb='#102136'; ca='#F6DD8F'; }
  else if(/طب|دكتور|مناوب|تمريض|عياد|doctor|med/i.test(val)){ sym='🩺'; cb='#0C1E33'; ca='#E2B450'; }
  else if(/رمضان|عيد|عمر|حج|مبارك|ramadan|eid/i.test(val)){ sym='🌙'; cb='#092218'; ca='#F6DD8F'; }
  else {
    const m = xprMatchTopic(val);
    if(m){
      if(m.cb) cb = m.cb;
      if(m.ca) ca = m.ca;
      if(m.st) sym = m.st;
    }
  }

  if(presetToLoad && XPR_WHEN_PRESETS[presetToLoad]){
    XPR_STATE.whenPreset = presetToLoad;
    const src = XPR_WHEN_PRESETS[presetToLoad][en?'en':'ar'];
    W.p = presetToLoad;
    W.to = src.to; W.bx = src.box; W.sb = src.sub; W.fr = src.fr;
    W.it = xprCloneWhenItems(src.items);
  }
  W.bx = en ? `Sealed Letters: ${val} ✨` : `صندوق رسائل «افتحها لمّا…» — ${val} ✨`;
  W.sl = 'custom';
  W.ss = sym;
  W.th = 'custom';
  W.cb = cb;
  W.ca = ca;
  XPR_STATE.openWhenColorPlus = true;
  XPR_STATE.whenView = 'box';
  xprPlayChime(W.sn, 1);
  toast('✨ ' + gzL('تم تجهيز ختم وثيم الصندوق لموضوع: ','Matched seal & theme for: ') + val);
  xprRefreshStudio();
}

/* Render Live Stage & URL Box inside Studio (without destroying open color wheels or text inputs!) */

  const box = $('#xprLiveStage');

    box.innerHTML = xprRenderWhenFrameHTML(XPR_STATE.W, XPR_STATE.whenView, XPR_STATE.whenIdx, XPR_STATE.whenOpened, {preview: !unlocked, recipient:false});
    $$('.xpr-stab').forEach(b => b.classList.toggle('on', b.dataset.wv === XPR_STATE.whenView));
    const uIn = $('#xprShareInput');
    if(uIn && unlocked) uIn.value = xprWhenShareUrl(XPR_STATE.W);
    return;
  }
  const unlocked = xprUnlocked('cube');
  box.innerHTML = xprRenderFrameHTML(XPR_STATE.D, XPR_STATE.stage, {preview: !unlocked, recipient:false});
  $$('.xpr-stab').forEach(b => b.classList.toggle('on', +b.dataset.st === XPR_STATE.stage));

  if(uIn && unlocked) uIn.value = xprShareUrl(XPR_STATE.D);
}

function xprRunApplyTopic(){
  const inp = $('#xprTopicInp');
  const val = inp ? inp.value.trim() : XPR_STATE.topicDraft.trim();
  if(!val){ toast(gzL('اكتب موضوع الهدية أولاً (مثال: قهوة، سفر، عطر، سيارة…)','Type your topic first')); if(inp) inp.focus(); return; }
  XPR_STATE.topicDraft = val;
  const m = xprMatchTopic(val);
  if(!m) return;
  XPR_STATE.D.sh = m.sh;
  if(m.st) XPR_STATE.D.st = m.st;
  if(m.cb && m.ca){
    XPR_STATE.D.th = 'custom';
    XPR_STATE.D.cb = m.cb;
    XPR_STATE.D.ca = m.ca;
    XPR_STATE.openColorPlus = true;
  }
  XPR_STATE.stage = 0;
  xprPlayChime(XPR_STATE.D.sn, 1);
  toast('✨ ' + gzL('تم تخصيص الشكل والألوان لموضوع: ','Matched shape & theme for: ') + val);
  xprRefreshStudio();
}

function xprBindStudioEvents(container){
  if(!container || container._xprBound) return;
  container._xprBound = true;

  container.addEventListener('click', async ev=>{
    /* Product #2 Stage Actions (Box / Wax-Sealed Envelopes) */
    const wact = ev.target.closest('[data-wact]');
    if(wact){
      const a = wact.dataset.wact;
      if(a === 'openenv'){
        const idx = +wact.dataset.idx || 0;
        const prevIdx = XPR_STATE.whenIdx;
        XPR_STATE.whenIdx = idx;
        XPR_STATE.whenOpened[idx] = 1;
        XPR_STATE.whenView = 'open';
        xprPlayChime(XPR_STATE.W.sn, 2);
        if(prevIdx !== idx) xprRefreshStudio(); else xprRefreshStageOnly();
      } else if(a === 'backbox'){
        XPR_STATE.whenView = 'box';
        xprPlayChime(XPR_STATE.W.sn, 1);
        xprRefreshStageOnly();
      } else if(a === 'togglesnd'){
        XPR_STATE.W.sn = XPR_STATE.W.sn === 'mute' ? 'warm' : 'mute';
        xprRefreshStudio();
      }
      return;
    }

    /* Product #1 Stage Actions */
    const xact = ev.target.closest('[data-xact]');
    if(xact){
      const a = xact.dataset.xact;
      if(a === 'nextstage'){
        const btn = container.querySelector('.xpr-cube-btn');
        if(btn && XPR_STATE.stage===0) btn.classList.add('burst');
        XPR_STATE.stage = Math.min(2, XPR_STATE.stage + 1);
        xprPlayChime(XPR_STATE.D.sn, XPR_STATE.stage);
        setTimeout(xprRefreshStageOnly, XPR_STATE.stage===1 ? 170 : 30);
      } else if(a === 'replay'){
        XPR_STATE.stage = 0;
        xprPlayChime(XPR_STATE.D.sn, 1);
        xprRefreshStageOnly();
      } else if(a === 'togglesnd'){
        XPR_STATE.D.sn = XPR_STATE.D.sn === 'mute' ? 'warm' : 'mute';
        xprRefreshStudio();
      }
      return;
    }

    const ui = ev.target.closest('[data-xui]');
    if(!ui) return;
    const cmd = ui.dataset.xui;

    /* Shared Product Switcher */
    if(cmd === 'switchprod'){
      XPR_STATE.activeProd = ui.dataset.prod === 'when' ? 'when' : 'cube';
      xprPlayChime('warm', 1);
      xprRefreshStudio();
      return;
    }

    /* Product #2 Customizer UI Actions */
    if(cmd === 'wview'){
      XPR_STATE.whenView = ui.dataset.wv === 'open' ? 'open' : 'box';
      xprRefreshStageOnly();
    } else if(cmd === 'wpreset'){
      const k = ui.dataset.k;
      const pr = XPR_WHEN_PRESETS[k];
      if(!pr) return;
      XPR_STATE.whenPreset = k;
      XPR_STATE.whenOpened = {};
      XPR_STATE.whenIdx = 0;
      XPR_STATE.whenView = 'box';
      const lg = XPR_STATE.W.lg || 'ar';
      const src = pr[lg];
      Object.assign(XPR_STATE.W, { p:k, sl:pr.sl, to:src.to, bx:src.box, sb:src.sub, fr:src.fr, it:xprCloneWhenItems(src.items) });
      xprPlayChime(XPR_STATE.W.sn, 1);
      xprRefreshStudio();
    } else if(cmd === 'togglewtopic'){
      XPR_STATE.openWhenTopicPlus = !XPR_STATE.openWhenTopicPlus;
      xprRefreshStudio();
    } else if(cmd === 'applywtopic'){
      xprRunApplyWhenTopic();
    } else if(cmd === 'wseal'){
      const v = ui.dataset.v;
      if(!XPR_SEALS[v]) return;
      XPR_STATE.W.sl = v;
      xprPlayChime(XPR_STATE.W.sn, 1);
      xprRefreshStudio();
    } else if(cmd === 'wquicksym'){
      XPR_STATE.W.sl = 'custom';
      XPR_STATE.W.ss = ui.dataset.em || '🤍';
      xprPlayChime(XPR_STATE.W.sn, 1);
      xprRefreshStudio();
    } else if(cmd === 'wtheme'){
      XPR_STATE.W.th = ui.dataset.v;
      XPR_STATE.openWhenColorPlus = false;
      xprRefreshStudio();
    } else if(cmd === 'togglewcolorplus'){
      XPR_STATE.openWhenColorPlus = !XPR_STATE.openWhenColorPlus;
      XPR_STATE.W.th = 'custom';
      xprRefreshStudio();
    } else if(cmd === 'wcustpal'){
      XPR_STATE.W.th = 'custom';
      XPR_STATE.W.cb = ui.dataset.cb;
      XPR_STATE.W.ca = ui.dataset.ca;
      XPR_STATE.openWhenColorPlus = true;
      xprRefreshStudio();
    } else if(cmd === 'wlang'){
      const lg = ui.dataset.v === 'en' ? 'en' : 'ar';
      const prevLg = XPR_STATE.W.lg;
      const curPr = XPR_WHEN_PRESETS[XPR_STATE.whenPreset];
      XPR_STATE.W.lg = lg;
      if(curPr && prevLg !== lg){
        const oldDef = curPr[prevLg], newDef = curPr[lg];
        if(XPR_STATE.W.to === oldDef.to) XPR_STATE.W.to = newDef.to;
        if(XPR_STATE.W.bx === oldDef.box) XPR_STATE.W.bx = newDef.box;
        if(XPR_STATE.W.sb === oldDef.sub) XPR_STATE.W.sb = newDef.sub;
        if(XPR_STATE.W.fr === oldDef.fr) XPR_STATE.W.fr = newDef.fr;
        if(JSON.stringify(XPR_STATE.W.it) === JSON.stringify(xprCloneWhenItems(oldDef.items))){
          XPR_STATE.W.it = xprCloneWhenItems(newDef.items);
        }
      }
      xprRefreshStudio();
    } else if(cmd === 'wselenv'){
      XPR_STATE.whenIdx = +ui.dataset.idx || 0;
      XPR_STATE.whenView = 'open';
      xprRefreshStudio();
    } else if(cmd === 'waddenv'){
      if(XPR_STATE.W.it.length >= 6) return;
      const en = XPR_STATE.W.lg === 'en';
      XPR_STATE.W.it.push({
        em: '✨',
        wh: en ? 'A special moment arrives' : 'تمرّ فيك لحظة حلوة خاصّة',
        tx: en ? 'Write your heartfelt note for this moment here…' : 'اكتب هنا رسالتك الدافئة المخصّصة لهذي اللحظة…',
        gf: '',
        lk: ''
      });
      XPR_STATE.whenIdx = XPR_STATE.W.it.length - 1;
      XPR_STATE.whenView = 'open';
      xprPlayChime(XPR_STATE.W.sn, 1);
      xprRefreshStudio();
    } else if(cmd === 'wdelenv'){
      if(XPR_STATE.W.it.length <= 2) return;
      XPR_STATE.W.it.splice(XPR_STATE.whenIdx, 1);
      XPR_STATE.whenIdx = Math.max(0, XPR_STATE.whenIdx - 1);
      xprRefreshStudio();
    } else if(cmd === 'witememo'){
      const cur = XPR_STATE.W.it[XPR_STATE.whenIdx];
      if(cur){ cur.em = ui.dataset.em || '💌'; xprRefreshStudio(); }
    } else if(cmd === 'wcopylink'){
      const url = xprWhenShareUrl(XPR_STATE.W);
      try{ await navigator.clipboard.writeText(url); }catch(e){
        const inp = $('#xprShareInput'); if(inp){ inp.select(); document.execCommand('copy'); }
      }
      toast('🔗 ' + gzL('تم نسخ رابط صندوق الرسائل! أرسله الآن بالواتساب','Letters link copied! Ready for WhatsApp'));
    } else if(cmd === 'wsharelink'){
      const url = xprWhenShareUrl(XPR_STATE.W);
      if(navigator.share){
        try{ await navigator.share({ title: XPR_STATE.W.bx, text: (XPR_STATE.W.to ? `${XPR_STATE.W.to} — ` : '') + XPR_STATE.W.bx, url }); return; }catch(e){}
      }
      try{ await navigator.clipboard.writeText(url); }catch(e){}
      toast('🔗 ' + gzL('تم نسخ الرابط الجاهز للإرسال بالواتساب','Link copied for WhatsApp'));
    } else if(cmd === 'wopenfull'){
      xprOpenWhenFullscreen(XPR_STATE.W, false);
    } else if(cmd === 'wdlcard'){
      xprDownloadWhenCardPNG();
    } else if(cmd === 'wprintcard'){
      xprPrintWhenCardPDF();
    } else if(cmd === 'wdlhtml'){
      xprDownloadWhenStandaloneHTML();
    }

    /* Product #1 Customizer UI Actions */
    else if(cmd === 'stage'){
      XPR_STATE.stage = +ui.dataset.st || 0;
      xprRefreshStageOnly();
    } else if(cmd === 'preset'){
      const k = ui.dataset.k;
      const pr = XPR_CUBE_PRESETS[k];
      if(!pr) return;
      XPR_STATE.preset = k;
      const lg = XPR_STATE.D.lg || 'ar';
      const src = pr[lg];
      Object.assign(XPR_STATE.D, { p:k, sh:pr.sh, to:src.to, hk:src.hook, ms:src.msg, gf:src.gift, sb:src.sub, fr:src.fr });
      XPR_STATE.stage = 0;
      xprPlayChime(XPR_STATE.D.sn, 1);
      xprRefreshStudio();
    } else if(cmd === 'shape'){
      const sh = ui.dataset.v;
      if(!XPR_SHAPES[sh]) return;
      XPR_STATE.D.sh = sh;
      if(XPR_MAIN_SHAPES.includes(sh)) XPR_STATE.openShapePlus = false;
      XPR_STATE.stage = 0;
      xprPlayChime(XPR_STATE.D.sn, 1);
      xprRefreshStudio();
    } else if(cmd === 'toggleshapeplus'){
      XPR_STATE.openShapePlus = !XPR_STATE.openShapePlus;
      xprRefreshStudio();
    } else if(cmd === 'applytopic'){
      xprRunApplyTopic();
    } else if(cmd === 'quicksym'){
      XPR_STATE.D.sh = 'crest';
      XPR_STATE.D.st = ui.dataset.em || '✨';
      XPR_STATE.openShapePlus = true;
      XPR_STATE.stage = 0;
      xprPlayChime(XPR_STATE.D.sn, 1);
      xprRefreshStudio();
    } else if(cmd === 'theme'){
      XPR_STATE.D.th = ui.dataset.v;
      XPR_STATE.openColorPlus = false;
      xprRefreshStudio();
    } else if(cmd === 'togglecolorplus'){
      XPR_STATE.openColorPlus = !XPR_STATE.openColorPlus;
      XPR_STATE.D.th = 'custom';
      xprRefreshStudio();
    } else if(cmd === 'custpal'){
      XPR_STATE.D.th = 'custom';
      XPR_STATE.D.cb = ui.dataset.cb;
      XPR_STATE.D.ca = ui.dataset.ca;
      XPR_STATE.openColorPlus = true;
      xprRefreshStudio();
    } else if(cmd === 'lang'){
      const lg = ui.dataset.v === 'en' ? 'en' : 'ar';
      const curPr = XPR_CUBE_PRESETS[XPR_STATE.preset];
      const prevLg = XPR_STATE.D.lg;
      XPR_STATE.D.lg = lg;
      if(curPr && prevLg !== lg){
        const oldDef = curPr[prevLg], newDef = curPr[lg];
        if(XPR_STATE.D.to === oldDef.to) XPR_STATE.D.to = newDef.to;
        if(XPR_STATE.D.hk === oldDef.hook) XPR_STATE.D.hk = newDef.hook;
        if(XPR_STATE.D.ms === oldDef.msg) XPR_STATE.D.ms = newDef.msg;
        if(XPR_STATE.D.gf === oldDef.gift) XPR_STATE.D.gf = newDef.gift;
        if(XPR_STATE.D.sb === oldDef.sub) XPR_STATE.D.sb = newDef.sub;
        if(XPR_STATE.D.fr === oldDef.fr) XPR_STATE.D.fr = newDef.fr;
      }
      xprRefreshStudio();
    } else if(cmd === 'toggleprev'){
      if(!xprCanPreviewToggle()) return;
      const pk = XPR_STATE.activeProd === 'when' ? 'when' : 'cube';
      if(xprUnlocked(pk)){
        XPR_STATE.previewSimVisitor = true;
      } else {
        XPR_STATE.previewSimVisitor = false;
        S.unlk = S.unlk || {};
        S.unlk.xpr_prev_on = 1;
      }
      xprRefreshStudio();
    } else if(cmd === 'copylink'){
      const url = xprShareUrl(XPR_STATE.D);
      try{ await navigator.clipboard.writeText(url); }catch(e){
        const inp = $('#xprShareInput'); if(inp){ inp.select(); document.execCommand('copy'); }
      }
      toast('🔗 ' + gzL('تم نسخ رابط المفاجأة! أرسله الآن بالواتساب','Surprise link copied! Ready for WhatsApp'));
    } else if(cmd === 'sharelink'){
      const url = xprShareUrl(XPR_STATE.D);
      if(navigator.share){
        try{ await navigator.share({ title: XPR_STATE.D.hk, text: (XPR_STATE.D.to ? `${XPR_STATE.D.to} — ` : '') + XPR_STATE.D.hk, url }); return; }catch(e){}
      }
      try{ await navigator.clipboard.writeText(url); }catch(e){}
      toast('🔗 ' + gzL('تم نسخ الرابط الجاهز للإرسال بالواتساب','Link copied for WhatsApp'));
    } else if(cmd === 'openfull' || cmd === 'openfullpreview'){
      xprOpenFullscreen(XPR_STATE.D, false);
    } else if(cmd === 'dlcard'){
      xprDownloadCardPNG();
    } else if(cmd === 'printcard'){
      xprPrintCardPDF();
    } else if(cmd === 'dlhtml'){
      xprDownloadStandaloneHTML();
    }
  });

  container.addEventListener('keydown', ev=>{
    if(ev.key === 'Enter' && ev.target){
      if(ev.target.id === 'xprTopicInp'){ ev.preventDefault(); xprRunApplyTopic(); }
      else if(ev.target.id === 'xprWhenTopicInp'){ ev.preventDefault(); xprRunApplyWhenTopic(); }
    }
  });

  container.addEventListener('input', ev=>{
    const t = ev.target;
    if(!t) return;
    if(t.id === 'xprTopicInp'){ XPR_STATE.topicDraft = t.value; return; }
    if(t.id === 'xprWhenTopicInp'){ XPR_STATE.whenTopicDraft = t.value; return; }

    /* Product #2 Live Inputs (iPad-safe: updates stage without re-mounting form) */
    if(t.dataset && t.dataset.wcol){
      const colKey = t.dataset.wcol;
      XPR_STATE.W.th = 'custom';
      XPR_STATE.W[colKey] = xprCleanHex(t.value, colKey==='cb'?'#24101B':'#F2B866');
      const lbl = colKey==='cb' ? $('#xprWHexCb') : $('#xprWHexCa');
      if(lbl) lbl.textContent = XPR_STATE.W[colKey];
      const dot = $('#xprWhenSwDot');
      if(dot) dot.style.background = `linear-gradient(135deg,${XPR_STATE.W.cb} 48%,${XPR_STATE.W.ca})`;
      xprRefreshStageOnly();
      return;
    }
    if(t.dataset && t.dataset.wsealSym){
      XPR_STATE.W.sl = 'custom';
      XPR_STATE.W.ss = t.value.slice(0, 5) || '🤍';
      XPR_STATE.whenView = 'box';
      xprRefreshStageOnly();
      return;
    }
    if(t.dataset && t.dataset.wfld){
      const wfld = t.dataset.wfld;
      XPR_STATE.W[wfld] = t.value;
      if(wfld === 'sn') xprPlayChime(t.value, 1);
      if(wfld === 'bx' || wfld === 'sb') XPR_STATE.whenView = 'box';
      xprRefreshStageOnly();
      return;
    }
    if(t.dataset && t.dataset.witem){
      const k = t.dataset.witem;
      const cur = XPR_STATE.W.it[XPR_STATE.whenIdx];
      if(cur){
        cur[k] = t.value;
        XPR_STATE.whenView = (k === 'tx' || k === 'gf' || k === 'lk') ? 'open' : XPR_STATE.whenView;
        xprRefreshStageOnly();
      }
      return;
    }

    /* Product #1 Live Inputs */
    if(t.dataset && t.dataset.xcol){
      const colKey = t.dataset.xcol;
      XPR_STATE.D.th = 'custom';
      XPR_STATE.D[colKey] = xprCleanHex(t.value, colKey==='cb'?'#1B120C':'#DDA35D');
      const lbl = colKey==='cb' ? $('#xprHexCb') : $('#xprHexCa');
      if(lbl) lbl.textContent = XPR_STATE.D[colKey];
      const dot = $('#xprCustomSwDot');
      if(dot) dot.style.background = `linear-gradient(135deg,${XPR_STATE.D.cb} 48%,${XPR_STATE.D.ca})`;
      xprRefreshStageOnly();
      return;
    }
    if(t.dataset && t.dataset.xcrest){
      XPR_STATE.D.sh = 'crest';
      XPR_STATE.D.st = t.value.slice(0, 6) || '✨';
      XPR_STATE.stage = 0;
      xprRefreshStageOnly();
      return;
    }
    const fld = t.dataset && t.dataset.xfld;
    if(!fld) return;
    XPR_STATE.D[fld] = t.value;
    if(fld === 'sn') xprPlayChime(t.value, 1);
    if(['ms'].includes(fld)) XPR_STATE.stage = 1;
    else if(['gf','sb','lk'].includes(fld)) XPR_STATE.stage = 2;
    xprRefreshStageOnly();
  });
}

/* Auto-Boot Recipient Fullscreen View when a shared gift link (?exp=cube|when&d=...) is opened */
(function xprCheckIncomingGiftLink(){
  const run = ()=>{
    try{
      const sp = new URLSearchParams(location.search);
      if(sp.get('explore') === 'experiences' && typeof go === 'function'){
        const p = sp.get('p') === 'when' ? '?p=when' : '';
        setTimeout(()=>go('eilan://experiences' + p), 80);
        return;
      }
      let expType = sp.get('exp'), tok = sp.get('d');
      if(!expType && /^#exp=(cube|when):/i.test(location.hash)){
        const m = /^#exp=(cube|when):(.*)$/i.exec(location.hash);
        if(m){ expType = m[1].toLowerCase(); tok = m[2]; }
      }
      if(!tok) return;
      if(expType === 'when'){
        const W = xprDecodeWhenData(tok);
        if(!W) return;
        const boot = $('#boot');
        if(boot) boot.classList.add('hide');
        document.title = (W.to ? `${W.to} · ` : '') + 'رسائل افتحها لمّا… — إيلان دول';
        xprOpenWhenFullscreen(W, true);
        return;
      }
      if(expType === 'cube'){
        const D = xprDecodeData(tok);
        if(!D) return;
        const boot = $('#boot');
        if(boot) boot.classList.add('hide');
        document.title = (D.to ? `${D.to} · ` : '') + 'مفاجأة خاصة لك — إيلان دول';
        xprOpenFullscreen(D, true);
      }
    }catch(e){}
  };
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ()=>setTimeout(run, 30));
  else setTimeout(run, 30);
})();
