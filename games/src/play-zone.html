.gzc-intro{padding:22px 24px;position:relative;overflow:hidden}

.gzc-intro .gzc-float{position:absolute;inset-inline-end:18px;top:18px;display:flex;gap:7px;opacity:.9}
.gzc-intro .gzc-float i{width:12px;height:12px;border-radius:4px;display:block;animation:gzcBob 3.2s ease-in-out infinite}

.gzc-legend{padding:18px 20px;display:flex;flex-direction:column;gap:10px;justify-content:center}

.gzc-legend .lg b{color:var(--w);display:block;font-size:13.5px}
.gzc-tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap;flex-shrink:0}
.gzc-tag svg{width:13px;height:13px;stroke-width:2.2}
.gzc-tag.pr{background:rgba(232,182,74,.14);color:#E8B64A;border:1px solid rgba(232,182,74,.35)}
.gzc-tag.dv{background:rgba(109,194,122,.13);color:#7FD08B;border:1px solid rgba(109,194,122,.32)}
.gzc-tag.on{background:rgba(239,233,218,.06);color:var(--mu);border:1px dashed rgba(239,233,218,.25)}
.gzc-tag.pd{background:rgba(79,132,96,.16);color:var(--p2);border:1px solid var(--bd)}
.gzc-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 16px}

.gzc-bar .sp{flex:1}
.gzc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}

.gzc{position:relative;display:flex;flex-direction:column;border-radius:22px;overflow:hidden;transition:transform .35s cubic-bezier(.2,1.2,.4,1),box-shadow .35s,border-color .35s}
.gzc:hover{transform:translateY(-4px);border-color:var(--bd2);box-shadow:0 24px 50px -24px rgba(0,0,0,.85),0 0 0 1px rgba(232,182,74,.12)}
.gzc-art{position:relative;aspect-ratio:16/10;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 110%,rgba(79,132,96,.38),transparent 60%),linear-gradient(160deg,#20231a,#121310);border-bottom:1px solid var(--bd);cursor:pointer;overflow:hidden}
.gzc-art::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(79,132,96,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(79,132,96,.08) 1px,transparent 1px);background-size:22px 22px;mask-image:radial-gradient(circle at 50% 55%,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(circle at 50% 55%,#000 30%,transparent 75%)}
.gzc-art ei-c.ei{width:104px;height:104px;filter:drop-shadow(0 12px 22px rgba(0,0,0,.55)) drop-shadow(0 0 18px rgba(232,182,74,.18))}
.gzc:hover .gzc-art ei-c.ei{transform:translateY(-4px) scale(1.06) rotate(-3deg);filter:drop-shadow(0 14px 24px rgba(0,0,0,.6)) drop-shadow(0 0 24px rgba(232,182,74,.38))}
.gzc-corner{position:absolute;top:10px;inset-inline-start:10px;display:flex;gap:6px;z-index:1}
.gzc-corner span{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;backdrop-filter:blur(8px);background:rgba(20,21,15,.65);border:1px solid var(--bd)}
.gzc-corner span svg{width:15px;height:15px}
.gzc-corner .pr{color:#E8B64A;border-color:rgba(232,182,74,.4)}.gzc-corner .dv{color:#7FD08B}
.gzc-price{position:absolute;top:10px;inset-inline-end:10px;z-index:1;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:rgba(20,21,15,.7);border:1px solid var(--bd2);color:var(--g)}
.gzc-price.free{color:#7FD08B;border-color:rgba(109,194,122,.4)}.gzc-price.own{color:#14150F;background:var(--grad);border-color:transparent}
.gzc-b{padding:15px 16px 16px;display:flex;flex-direction:column;gap:9px;flex:1}
.gzc-b h3{font-size:17px;line-height:1.3;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.gzc-b h3 bdi{font-size:12.5px;color:var(--mu);font-weight:600}
.gzc-b p{font-size:13px;color:var(--mu);line-height:1.6;margin:0}
.gzc-tags{display:flex;gap:6px;flex-wrap:wrap}
.gzc-meta{display:flex;gap:12px;font-size:12px;color:var(--mu2);flex-wrap:wrap}
.gzc-meta span{display:inline-flex;align-items:center;gap:4px}.gzc-meta svg{width:13px;height:13px}
.gzc-btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:4px}

.gzc-btns .btn svg{width:15px;height:15px}

/* game window */
.gzw{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:16px;background:rgba(8,9,6,.72);backdrop-filter:blur(10px);animation:gzwIn .25s ease}
@keyframes gzwIn{from{opacity:0}}
.gzw-box{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;border-radius:24px;padding:18px 18px 20px;background:linear-gradient(170deg,#1f2219,#14150F);border:1px solid var(--bd2);box-shadow:0 40px 90px -30px #000;animation:gzwUp .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes gzwUp{from{transform:translateY(24px) scale(.97);opacity:0}}
.gzw-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.gzw-h ei-c.ei{width:40px;height:40px}
.gzw-h h3{flex:1;font-size:18px;line-height:1.2}.gzw-h h3 small{display:block;font-size:11px;letter-spacing:2.5px;color:var(--g);font-family:var(--mono)}

.gzw .scorebar{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--mu);margin-top:10px;align-items:center}
.gzw .scorebar b{color:var(--w)}
.gzw .game-stage{max-width:400px;margin:0 auto}
.gzw .pad{max-width:200px;margin:0 auto}
.gzw .mem{max-width:400px}
/* XO */
.xo-modes{display:flex;gap:7px;justify-content:center;margin-bottom:12px}
.xo-b{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:330px;margin:0 auto}
.xo-c{aspect-ratio:1;border-radius:18px;background:linear-gradient(145deg,#272a1f,#15160f);border:1px solid var(--bd);display:grid;place-items:center;transition:.2s}
.xo-c:hover:not(.f){border-color:var(--bd2);transform:translateY(-2px)}
.xo-c svg{width:62%;height:62%;animation:xoPop .35s cubic-bezier(.2,1.6,.4,1)}
.xo-c.w{border-color:var(--g);box-shadow:0 0 22px -4px var(--g)}
@keyframes xoPop{from{transform:scale(.3) rotate(-25deg);opacity:0}}
.xo-msg{text-align:center;font-weight:800;margin-top:12px;min-height:24px}
/* Cube Catch */
.cc-b{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;max-width:340px;margin:0 auto;touch-action:manipulation}
.cc-c{aspect-ratio:1;border-radius:16px;background:linear-gradient(145deg,#24271c,#131410);border:1px solid var(--bd);position:relative;overflow:hidden}
.cc-c i{position:absolute;inset:14%;border-radius:26%;background:var(--c);box-shadow:0 0 26px -2px var(--c),inset 0 -6px 0 rgba(0,0,0,.18),inset 0 6px 0 rgba(255,255,255,.25);transform:scale(0);transition:transform .18s cubic-bezier(.2,1.6,.4,1)}
.cc-c.on i{transform:scale(1)}
.cc-c.hit{animation:ccHit .3s}.cc-c.miss{animation:ccMiss .3s}
@keyframes ccHit{50%{background:rgba(232,182,74,.35)}}@keyframes ccMiss{30%,70%{transform:translateX(4px)}50%{transform:translateX(-4px)}}
.cc-ov{text-align:center;padding:10px 0 4px}.cc-ov h3{margin:6px 0}
.cc-time{height:6px;border-radius:6px;background:rgba(255,255,255,.07);max-width:340px;margin:0 auto 12px;overflow:hidden}.cc-time i{display:block;height:100%;width:100%;background:var(--grad);transition:width .25s linear}
/* light mode */
html.light .gzc-art{background:radial-gradient(120% 90% at 50% 110%,rgba(79,132,96,.25),transparent 60%),linear-gradient(160deg,#f4efe2,#e9e2cf)}
html.light .gzc-corner span,html.light .gzc-price{background:rgba(255,255,255,.85)}
html.light .gzc-tag.on{color:#5c5b4c;border-color:rgba(47,90,61,.3)}
html.light .gzc-tag.pr{color:#9a6f12}html.light .gzc-tag.dv{color:#2F7A45}
html.light .gzw-box{background:linear-gradient(170deg,#fbf8f0,#f1ecdf)}
html.light .xo-c,html.light .cc-c{background:linear-gradient(145deg,#fff,#efe9da)}
</style>

function xoMark(m){const rows=CUBE_PAT[m==='X'?'g-x':'g-o'].split('|'),H=rows.length,W=rows[0].length,P=60/Math.max(W,H),Z=P*.84;let h=`<svg viewBox="0 0 64 64">`;
 rows.forEach((r,y)=>{for(let x=0;x<W;x++)if(r[x]==='#'){const c=m==='X'?CUBE_RAMP[Math.min(1,Math.floor(y/H*2))]:CUBE_RAMP[3+Math.min(1,Math.floor(y/H*2))];h+=`<rect x="${(2+(64-P*W)/2-2+(x+.5)*P-Z/2).toFixed(1)}" y="${((64-P*H)/2+(y+.5)*P-Z/2).toFixed(1)}" width="${Z.toFixed(1)}" height="${Z.toFixed(1)}" rx="${(Z*.28).toFixed(1)}" fill="${c}"/>`}});return h+'</svg>'}
const xoWin=b=>{for(const l of XO_W)if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[0]]===b[l[2]])return l;return null};
function xoDraw(){const B=$('#xoB');if(!B)return;const w=xoWin(XO.b)||[];
 B.innerHTML=XO.b.map((v,i)=>`<button class="xo-c ${v?'f':''} ${w.includes(i)?'w':''}" data-act="xo" data-i="${i}" aria-label="${v||i+1}">${v?xoMark(v):''}</button>`).join('');
 $('#xoSc').innerHTML=`<span>✕ ${XO.mode==='cpu'?gzL('أنت','You'):gzL('اللاعب ١','Player 1')}: <b>${XO.sc.X}</b></span><span>${gzL('تعادل','Draw')}: <b>${XO.sc.T}</b></span><span>◯ ${XO.mode==='cpu'?'Eilan':gzL('اللاعب ٢','Player 2')}: <b>${XO.sc.O}</b></span>`;
 $$('.xo-modes .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===XO.mode))}
function xoMsg(t){const m=$('#xoMsg');if(m)m.innerHTML=t}
function xoInit(){XO.b=Array(9).fill('');XO.turn='X';XO.over=false;XO.busy=false;xoDraw();xoMsg(XO.mode==='cpu'?gzL('دورك — أنت ✕','Your turn — you are ✕'):gzL('دور ✕','✕ to play'))}
function xoEnd(){const w=xoWin(XO.b);if(w){XO.over=true;const p=XO.b[w[0]];XO.sc[p]++;xoDraw();
   if(XO.mode==='cpu'){if(p==='X'){xoMsg(gzL('فزت على Eilan! 🏆','You beat Eilan! 🏆'));S.hi.xo=(S.hi.xo||0)+1;save();addXP(3,'XO')}else xoMsg(gzL('Eilan فازت هالمرة 😄 جرّب ثاني','Eilan won this time 😄 try again'))}
   else xoMsg(gzL(`فاز ${p==='X'?'✕':'◯'} 🎉`,`${p==='X'?'✕':'◯'} wins 🎉`));return true}
 if(XO.b.every(Boolean)){XO.over=true;XO.sc.T++;xoDraw();xoMsg(gzL('تعادل! 🤝','Draw! 🤝'));return true}return false}
function xoCpu(){const b=XO.b,free=b.map((v,i)=>v?-1:i).filter(i=>i>=0);
 const find=m=>{for(const i of free){b[i]=m;const w=xoWin(b);b[i]='';if(w)return i}return -1};
 let i=find('O');if(i<0)i=find('X');if(i<0&&Math.random()<.18)i=free[Math.floor(Math.random()*free.length)];
 if(i<0&&!b[4])i=4;if(i<0){const c=[0,2,6,8].filter(x=>!b[x]);i=c.length?c[Math.floor(Math.random()*c.length)]:free[0]}return i}
ACT.xo=d=>{const i=+d.i;if(XO.over||XO.busy||XO.b[i])return;XO.b[i]=XO.turn;if(xoEnd())return;
 if(XO.mode==='2p'){XO.turn=XO.turn==='X'?'O':'X';xoDraw();xoMsg(gzL(`دور ${XO.turn==='X'?'✕':'◯'}`,`${XO.turn==='X'?'✕':'◯'} to play`));return}
 XO.busy=true;xoDraw();xoMsg(gzL('Eilan تفكّر…','Eilan is thinking…'));setTimeout(()=>{if(!$('#xoB'))return;XO.b[xoCpu()]='O';XO.busy=false;if(!xoEnd()){xoDraw();xoMsg(gzL('دورك','Your turn'))}},420)};
ACT.xonew=xoInit;ACT.xomode=d=>{XO.mode=d.v;XO.sc={X:0,O:0,T:0};xoInit()};

/* ---------- Cube Catch ---------- */
const CC={run:false,sc:0,combo:0,end:0,tmr:null,lit:{},dur:30000};
function ccStop(){CC.run=false;clearTimeout(CC.tmr);clearInterval(CC.clock);Object.values(CC.lit).forEach(clearTimeout);CC.lit={}}
function ccSpawn(){if(!CC.run)return;const cells=$$('#ccB .cc-c');if(!cells.length)return ccStop();
 const free=cells.map((c,i)=>c.classList.contains('on')?-1:i).filter(i=>i>=0);if(free.length){const i=free[Math.floor(Math.random()*free.length)],c=cells[i];
   c.style.setProperty('--c',CUBE_RAMP[Math.floor(Math.random()*5)]);c.classList.add('on');
   const t=CC.end-Date.now(),life=Math.max(520,1150-(CC.dur-t)/CC.dur*600);
   CC.lit[i]=setTimeout(()=>{c.classList.remove('on');delete CC.lit[i];CC.combo=0;const e=$('#ccC');if(e)e.textContent=0},life)}
 const left=CC.end-Date.now();CC.tmr=setTimeout(ccSpawn,Math.max(260,700-(CC.dur-left)/CC.dur*420))}
ACT.ccstart=()=>{ccStop();CC.run=true;CC.sc=0;CC.combo=0;CC.end=Date.now()+CC.dur;$('#ccS').textContent=0;$('#ccC').textContent=0;$('#ccOv').innerHTML='';
 $$('#ccB .cc-c').forEach(c=>c.classList.remove('on'));
 CC.clock=setInterval(()=>{const l=CC.end-Date.now(),b=$('#ccT');if(b)b.style.width=Math.max(0,l/CC.dur*100)+'%';if(l<=0)ccDone()},200);ccSpawn()};
function ccDone(){ccStop();$$('#ccB .cc-c').forEach(c=>c.classList.remove('on'));const nb=CC.sc>(S.hi.catch||0);if(nb){S.hi.catch=CC.sc;save()}
 const h=$('#ccH');if(h)h.textContent=S.hi.catch||0;
 const o=$('#ccOv');if(o)o.innerHTML=`<h3>${gzL('انتهى الوقت','Time\'s up')} — ${CC.sc} ${gzL('مكعب','cubes')}${nb?' · '+gzL('رقم قياسي!','New best!'):''}</h3><button class="btn g" data-act="ccstart">↻ ${gzL('العب مجدداً','Play again')}</button>`;
 const xp=Math.floor(CC.sc/3);if(xp)addXP(xp,gzL('اصطد المكعب','Cube Catch'))}
ACT.cchit=d=>{if(!CC.run)return;const i=+d.i,c=$$('#ccB .cc-c')[i];if(!c)return;
 if(c.classList.contains('on')){clearTimeout(CC.lit[i]);delete CC.lit[i];c.classList.remove('on');CC.combo++;CC.sc+=CC.combo>=5?2:1;c.classList.remove('hit');void c.offsetWidth;c.classList.add('hit')}
 else{CC.combo=0;c.classList.remove('miss');void c.offsetWidth;c.classList.add('miss')}
 $('#ccS').textContent=CC.sc;$('#ccC').textContent=CC.combo};
</script>
