/* Procedural Original WebAudio Chimes (Zero external/copyrighted audio) */
let _xprAC = null;
function xprPlayChime(kind='warm', step=1){
  if(!kind || kind==='mute') return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!_xprAC) _xprAC = new AC();
    if(_xprAC.state === 'suspended') _xprAC.resume();
    const now = _xprAC.currentTime;
    const notes = kind==='calm'
      ? (step>=2 ? [293.66, 369.99, 440.00, 587.33] : [293.66, 440.00])
      : kind==='joy'
      ? (step>=2 ? [392.00, 493.88, 587.33, 783.99] : [392.00, 587.33])
      : (step>=2 ? [329.63, 415.30, 493.88, 659.25] : [329.63, 493.88, 659.25]);
    notes.forEach((freq, idx)=>{
      const osc = _xprAC.createOscillator();
      const gain = _xprAC.createGain();
      osc.type = kind==='calm' ? 'sine' : 'triangle';
      osc.frequency.setValueAtTime(freq, now + idx * 0.085);
      gain.gain.setValueAtTime(0.0001, now + idx * 0.085);
      gain.gain.exponentialRampToValueAtTime(0.085 / (1 + idx*0.2), now + idx * 0.085 + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.085 + (step>=2 ? 1.05 : 0.65));
      osc.connect(gain);
      gain.connect(_xprAC.destination);
      osc.start(now + idx * 0.085);
      osc.stop(now + idx * 0.085 + 1.15);
    });
  }catch(e){}
}

/* URL-safe UTF-8 Base64 Compact Encoder & Decoder for Instant Serverless Delivery */
function xprEncodeData(D){
  const p = XPR_CUBE_PRESETS[D.p] ? D.p : 'eid';
  const prObj = XPR_CUBE_PRESETS[p];
  const lg = D.lg === 'en' ? 'en' : 'ar';
  const def = prObj[lg];
  const o = { p };
  if(D.sh && D.sh !== prObj.sh) o.sh = D.sh;
  if(D.th && D.th !== 'gold') o.th = D.th;
  if(lg !== 'ar') o.lg = lg;
  if(D.sn && D.sn !== 'warm') o.sn = D.sn;
  if(D.to !== def.to) o.to = String(D.to||'').slice(0,80);
  if(D.hk !== def.hook) o.hk = String(D.hk||'').slice(0,140);
  if(D.ms !== def.msg) o.ms = String(D.ms||'').slice(0,420);
  if(D.gf !== def.gift) o.gf = String(D.gf||'').slice(0,140);
  if(D.sb !== def.sub) o.sb = String(D.sb||'').slice(0,220);
  if(D.fr !== def.fr) o.fr = String(D.fr||'').slice(0,80);
  if(D.lk && /^https:\/\/\S+/i.test(D.lk.trim())) o.lk = D.lk.trim().slice(0,220);
  const bytes = new TextEncoder().encode(JSON.stringify(o));
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

function xprDecodeData(tok){
  try{
    const b64 = String(tok||'').replace(/-/g,'+').replace(/_/g,'/');
    const pad = b64 + '==='.slice((b64.length + 3) % 4);
    const bin = atob(pad);
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    const o = JSON.parse(new TextDecoder().decode(bytes));
    const p = XPR_CUBE_PRESETS[o.p] ? o.p : 'eid';
    const prObj = XPR_CUBE_PRESETS[p];
    const lg = o.lg === 'en' ? 'en' : 'ar';
    const def = prObj[lg];

}

/* Pure Vanilla-JS ISO/IEC 18004 QR Matrix Generator (Versions 1..20, ECC-L, Byte Mode) */
function xprMakeQR(str){
  const data = Array.from(new TextEncoder().encode(str));
  const V_CAP = [0,19,34,55,80,108,136,156,194,232,274,324,370,428,461,523,589,647,721,795,861];
  const V_BLK = [null,
    [7,1,19,0,0],[10,1,34,0,0],[15,1,55,0,0],[20,1,80,0,0],[26,1,108,0,0],
    [18,2,68,0,0],[20,2,78,0,0],[24,2,97,0,0],[30,2,116,0,0],[18,2,68,2,69],
    [20,4,81,0,0],[24,2,92,2,93],[26,4,107,0,0],[30,3,115,1,116],[22,5,87,1,88],
    [24,5,98,1,99],[28,1,107,5,108],[30,5,120,1,121],[28,3,113,4,114],[28,3,107,5,108]
  ];
  const ALIGN = [null,[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50],
    [6,30,54],[6,32,58],[6,34,62],[6,26,46,66],[6,26,48,70],[6,26,50,74],[6,30,54,78],[6,30,56,82],[6,30,58,86],[6,34,62,90]];
  let ver = 1;
  while(ver <= 20){
    const lb = ver < 10 ? 8 : 16;
    if(4 + lb + data.length * 8 <= V_CAP[ver] * 8) break;
    ver++;
  }
  if(ver > 20) return null;
  const bits = [];
  const pushB = (v,n)=>{ for(let i=n-1;i>=0;i--) bits.push((v>>>i)&1); };
  pushB(0b0100, 4);
  pushB(data.length, ver < 10 ? 8 : 16);
  for(const b of data) pushB(b, 8);
  const maxB = V_CAP[ver] * 8;
  for(let i=0;i<4 && bits.length<maxB;i++) bits.push(0);
  while(bits.length % 8 !== 0) bits.push(0);
  const cw = [];
  for(let i=0;i<bits.length;i+=8){
    let b=0; for(let j=0;j<8;j++) b=(b<<1)|bits[i+j];
    cw.push(b);
  }
  let pad = 0xEC;
  while(cw.length < V_CAP[ver]){ cw.push(pad); pad = pad===0xEC ? 0x11 : 0xEC; }
  const EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  let x = 1;
  for(let i=0;i<255;i++){ EXP[i]=x; LOG[x]=i; x=(x<<1)^(x&0x80?0x11d:0); }
  for(let i=255;i<512;i++) EXP[i]=EXP[i-255];
  const mul = (a,b)=>(a&&b)?EXP[LOG[a]+LOG[b]]:0;
  const rsEnc = (msg, ecLen)=>{
    let g = [1];
    for(let i=0;i<ecLen;i++){
      const ng = new Array(g.length+1).fill(0);
      for(let j=0;j<g.length;j++){ ng[j]^=g[j]; ng[j+1]^=mul(g[j],EXP[i]); }
      g = ng;
    }
    const rem = new Array(ecLen).fill(0);
    for(const b of msg){
      const f = b ^ rem.shift(); rem.push(0);
      for(let j=0;j<ecLen;j++) rem[j] ^= mul(g[j+1], f);
    }
    return rem;
  };
  const [ecLen, g1b, g1c, g2b, g2c] = V_BLK[ver];
  const dB=[], eB=[]; let pos=0;
  for(let i=0;i<g1b;i++){ const blk=cw.slice(pos,pos+g1c); pos+=g1c; dB.push(blk); eB.push(rsEnc(blk,ecLen)); }
  for(let i=0;i<g2b;i++){ const blk=cw.slice(pos,pos+g2c); pos+=g2c; dB.push(blk); eB.push(rsEnc(blk,ecLen)); }
  const out=[]; const maxD=Math.max(g1c,g2c);
  for(let i=0;i<maxD;i++) for(const b of dB) if(i<b.length) out.push(b[i]);
  for(let i=0;i<ecLen;i++) for(const b of eB) out.push(b[i]);

  const N = ver*4 + 17;
  const M = Array.from({length:N}, ()=>new Array(N).fill(0));
  const R = Array.from({length:N}, ()=>new Uint8Array(N));
  const setF = (r,c,v)=>{ if(r>=0&&r<N&&c>=0&&c<N){ M[r][c]=v?1:0; R[r][c]=1; } };
  const finder = (r0,c0)=>{
    for(let r=-1;r<=7;r++) for(let c=-1;c<=7;c++){
      const on = (r>=0&&r<=6&&(c===0||c===6))||(c>=0&&c<=6&&(r===0||r===6))||(r>=2&&r<=4&&c>=2&&c<=4);
      setF(r0+r, c0+c, on);
    }
  };
  finder(0,0); finder(0,N-7); finder(N-7,0);
  for(let i=8;i<N-8;i++){ setF(6,i,i%2===0); setF(i,6,i%2===0); }
  for(const r of ALIGN[ver]) for(const c of ALIGN[ver]){
    if(R[r][c]) continue;
    for(let dr=-2;dr<=2;dr++) for(let dc=-2;dc<=2;dc++) setF(r+dr,c+dc,Math.max(Math.abs(dr),Math.abs(dc))!==1);
  }
  setF(N-8, 8, 1);
  for(let i=0;i<9;i++){ if(!R[8][i]) R[8][i]=1; if(!R[i][8]) R[i][8]=1; }
  for(let i=0;i<8;i++){ R[8][N-1-i]=1; R[N-1-i][8]=1; }
  if(ver >= 7){
    let rem = ver;
    for(let i=0;i<12;i++) rem = (rem<<1)^((rem>>>11)*0x1F25);
    const vI = (ver<<12)|rem;
    for(let i=0;i<18;i++){ const bit=(vI>>>i)&1, a=N-11+(i%3), b=Math.floor(i/3); setF(b,a,bit); setF(a,b,bit); }
  }
  const fBits=[];
  for(const b of out) for(let i=7;i>=0;i--) fBits.push((b>>>i)&1);
  let bi=0, up=true;
  for(let c=N-1;c>=1;c-=2){
    if(c===6) c--;
    for(let k=0;k<N;k++){
      const r = up ? N-1-k : k;
      for(let dc=0;dc<2;dc++){
        const cc = c-dc;
        if(!R[r][cc]){
          let bit = bi<fBits.length ? fBits[bi++] : 0;
          if((r+cc)%2===0) bit ^= 1;
          M[r][cc] = bit;
        }
      }
    }
    up = !up;
  }
  const fmt = 0x77C4;
  const fP = [[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],[7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]];
  for(let i=0;i<15;i++){
    const bit = (fmt>>>i)&1;
    const [r,c] = fP[14-i];
    M[r][c] = bit;
    if(i>=8) M[N-1-(14-i)][8] = bit;
    else M[8][N-1-i] = bit;
  }
  return M;
}

/* Activate Salla Code (Client-Side SHA-256 — Zero Owner Intervention Needed) */
async function xprVerifyCode(ev){
  ev.preventDefault();
  const f = ev.target;
  const msg = $('#xprCodeMsg');
  const raw = String(f.code.value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  let key = 'cube', body = raw;
  if(raw.startsWith('EXPB')){ key = 'bundle'; }
  else if(raw.startsWith('CUB1')){ key = 'cube'; }
  else { body = 'CUB1' + raw; }

  if(body.length < 15){
    msg.className = 'lh-msg bad';
    msg.textContent = gzL('الكود ناقص — الصيغة الصحيحة: CUB1-XXXX-XXXX-XXXX','Code incomplete — expected CUB1-XXXX-XXXX-XXXX');
    return;
  }
  const dg = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('eilan-arc-v1:' + body)));
  const hx = Array.from(dg, b => b.toString(16).padStart(2,'0')).join('').slice(0, 24);
  const validCube = Array.isArray(XPR_CODES.cube) && XPR_CODES.cube.includes(hx);
  const validBundle = Array.isArray(XPR_CODES.bundle) && XPR_CODES.bundle.includes(hx);

  if(!validCube && !validBundle){
    msg.className = 'lh-msg bad';
    msg.textContent = '❌ ' + gzL('الكود غير صحيح — تأكد من نسخه كما وصلك من سلة','Invalid activation code');
    return;
  }
  S.unlk = S.unlk || {};
  if(validBundle) S.unlk.x_bundle = 1;
  else S.unlk.x_cube = 1;
  S.owned = S.owned || {};
  S.owned['x-cube'] = Date.now();
  XPR_STATE.previewSimVisitor = false;
  save();
  xprPlayChime('joy', 2);
  toast('🎉 ' + gzL('تم التفعيل فوراً! رابطك وبطاقتك جاهزة للاستلام الآن','Unlocked! Your link & QR card are ready now'));
  xprRefreshStudio();
}

/* Luxury Landscape Gift Card Renderer (1600x1000 Canvas -> PNG or Landscape Print PDF) */
async function xprDrawGiftCardCanvas(D){
  const url = xprShareUrl(D);
  const qr = xprMakeQR(url);
  const W = 1600, H = 1000;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const en = D.lg === 'en';

  // Background matching official Eilan live palette
  const g = ctx.createLinearGradient(0, 0, W, H);
  if(D.th==='forest'){ g.addColorStop(0,'#0C2B1D'); g.addColorStop(1,'#06130C'); }
  else if(D.th==='royal'){ g.addColorStop(0,'#0E1E52'); g.addColorStop(1,'#070A16'); }
  else if(D.th==='velvet'){ g.addColorStop(0,'#1F1139'); g.addColorStop(1,'#07080C'); }
  else { g.addColorStop(0,'#0E1426'); g.addColorStop(1,'#07080C'); }
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Subtle golden glow
  const rg = ctx.createRadialGradient(W*0.72, H*0.35, 20, W*0.72, H*0.35, 520);
  rg.addColorStop(0, 'rgba(226,180,80,0.18)');
  rg.addColorStop(1, 'rgba(226,180,80,0)');
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, H);

  // Double Luxury Border
  ctx.strokeStyle = '#E2B450';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.roundRect(36, 36, W-72, H-72, 34); ctx.stroke();
  ctx.strokeStyle = 'rgba(226,180,80,0.28)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(54, 54, W-108, H-108, 26); ctx.stroke();

  const drawSvgStr = (svgStr, x, y, w, h)=>new Promise(res=>{
    const im = new Image();
    im.onload = ()=>{ try{ ctx.drawImage(im, x, y, w, h); }catch(e){} res(); };
    im.onerror = ()=>res();
    im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
  });

  // Left/Side QR Panel
  const qrBoxX = en ? W - 540 : 100;
  const qrBoxY = 150, qrBoxW = 440, qrBoxH = 700;
  ctx.fillStyle = 'rgba(7,8,12,0.74)';
  ctx.strokeStyle = 'rgba(226,180,80,0.48)';
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.roundRect(qrBoxX, qrBoxY, qrBoxW, qrBoxH, 28); ctx.fill(); ctx.stroke();

  if(qr){
    const qSize = 340;
    const qX = qrBoxX + (qrBoxW - qSize)/2, qY = qrBoxY + 44;
    ctx.fillStyle = '#F5F7FA';
    ctx.beginPath(); ctx.roundRect(qX - 18, qY - 18, qSize + 36, qSize + 36, 18); ctx.fill();
    const N = qr.length, cell = qSize / N;
    ctx.fillStyle = '#07080C';
    for(let r=0;r<N;r++){
      for(let c=0;c<N;c++){
        if(qr[r][c]) ctx.fillRect(qX + c*cell, qY + r*cell, Math.ceil(cell), Math.ceil(cell));
      }
    }
  }
  ctx.fillStyle = '#F2F5FA';
  ctx.font = '800 25px Cairo, Tajawal, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(en ? 'Scan Camera to Open Gift' : 'وجّه الكاميرا لفتح المفاجأة', qrBoxX + qrBoxW/2, qrBoxY + 462);
  ctx.fillStyle = '#E2B450';
  ctx.font = '700 19px Cairo, Tajawal, sans-serif';
  ctx.fillText(en ? 'Interactive Touch Surprise ✨' : 'تجربة مفاجأة تفاعلية تُفتح باللمس ✨', qrBoxX + qrBoxW/2, qrBoxY + 502);
  await drawSvgStr(xprShapeSvg(D.sh||'envelope'), qrBoxX + qrBoxW/2 - 64, qrBoxY + 520, 128, 128);

  // Text Content Side
  const txX = en ? 110 : W - 110;
  const maxW = 860;
  ctx.textAlign = en ? 'left' : 'right';
  ctx.direction = en ? 'ltr' : 'rtl';

  await drawSvgStr(xprLogoMini(), en ? 110 : W - 196, 108, 86, 86);
  ctx.fillStyle = '#E2B450';
  ctx.font = '900 24px Cairo, Tajawal, sans-serif';
  ctx.fillText(en ? 'EILAN INTERACTIVE GIFT' : 'بطاقة مفاجأة إيلان التفاعلية', en ? 215 : W - 215, 150);
  ctx.fillStyle = 'rgba(242,245,250,0.68)';
  ctx.font = '700 19px Cairo, Tajawal, sans-serif';
  ctx.fillText('EILAN DOLL · العالم الرقمي', en ? 215 : W - 215, 182);

  // Recipient
  ctx.fillStyle = '#F2F5FA';
  ctx.font = '900 50px Cairo, Tajawal, sans-serif';
  const toLine = (en ? 'To: ' : 'إهداء خاص إلى: ') + (D.to || '');
  ctx.fillText(toLine.slice(0, 42), txX, 320, maxW);

  // Hook & Warm Note Wrap
  ctx.fillStyle = '#F6DD8F';
  ctx.font = '800 32px Cairo, Tajawal, sans-serif';
  const wrapText = (text, x, y, mw, lh, maxLines)=>{
    const words = String(text||'').replace(/\n+/g,' ').split(/\s+/);
    let line = '', lines = [];
    for(const w of words){
      const test = line ? line + ' ' + w : w;
      if(ctx.measureText(test).width > mw && line){ lines.push(line); line = w; }
      else line = test;
    }
    if(line) lines.push(line);
    lines.slice(0, maxLines).forEach((ln, idx)=> ctx.fillText(ln, x, y + idx*lh));
    return y + Math.min(lines.length, maxLines) * lh;
  };

  let nextY = wrapText(D.hk || '', txX, 415, maxW, 48, 2);

  ctx.fillStyle = 'rgba(242,245,250,0.88)';
  ctx.font = '700 27px Cairo, Tajawal, sans-serif';
  nextY = wrapText(D.ms || '', txX, nextY + 42, maxW, 44, 4);

  // Sender pill
  if(D.fr){
    ctx.fillStyle = '#E2B450';
    ctx.font = '800 28px Cairo, Tajawal, sans-serif';
    ctx.fillText((en ? 'From: ' : 'من: ') + D.fr, txX, 790, maxW);
  }

  // Official Eilan Signature Footer
  ctx.fillStyle = 'rgba(242,245,250,0.58)';
  ctx.font = '700 20px Cairo, Tajawal, sans-serif';
  ctx.fillText('صُنع بتوقيع إيلان دول · EILAN DOLL — تجارب رقمية تفاعلية', txX, 905, maxW);

  return cv;
}

async function xprDownloadCardPNG(){
  if(!xprUnlocked('cube')){ toast(gzL('فعّل الكود أولاً لاستلام البطاقة بدون علامة معاينة','Unlock first to download your gift card')); return; }
  const cv = await xprDrawGiftCardCanvas(XPR_STATE.D);
  cv.toBlob(async blob=>{
    if(!blob) return;
    const file = new File([blob], 'Eilan-Surprise-Card.png', {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:'بطاقة مفاجأة إيلان التفاعلية'}); return; }catch(e){}
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = file.name;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    toast('🃏 ' + gzL('تم تحميل بطاقة الباركود الفاخرة (PNG)','Luxury QR Card downloaded'));
  }, 'image/png');
}

function xprBindStudioEvents(container){
  if(!container || container._xprBound) return;
  container._xprBound = true;

  container.addEventListener('click', async ev=>{
    // Stage interactions inside live preview
    const xact = ev.target.closest('[data-xact]');
    if(xact){
      const a = xact.dataset.xact;
      if(a === 'nextstage'){
        const btn = container.querySelector('.xpr-cube-btn');
        if(btn && XPR_STATE.stage===0) btn.classList.add('burst');
        XPR_STATE.stage = Math.min(2, XPR_STATE.stage + 1);
        xprPlayChime(XPR_STATE.D.sn, XPR_STATE.stage);
        setTimeout(xprRefreshStageOnly, XPR_STATE.stage===1 ? 170 : 30);
      } else if(a === 'replay'){
        XPR_STATE.stage = 0;
        xprPlayChime(XPR_STATE.D.sn, 1);
        xprRefreshStageOnly();
      } else if(a === 'togglesnd'){
        XPR_STATE.D.sn = XPR_STATE.D.sn === 'mute' ? 'warm' : 'mute';
        xprRefreshStudio();
      }
      return;
    }

    const ui = ev.target.closest('[data-xui]');
    if(!ui) return;
    const cmd = ui.dataset.xui;
    if(cmd === 'stage'){
      XPR_STATE.stage = +ui.dataset.st || 0;
      xprRefreshStageOnly();
    } else if(cmd === 'preset'){
      const k = ui.dataset.k;
      const pr = XPR_CUBE_PRESETS[k];
      if(!pr) return;
      XPR_STATE.preset = k;
      const lg = XPR_STATE.D.lg || 'ar';
      const src = pr[lg];
      Object.assign(XPR_STATE.D, { p:k, sh:pr.sh, to:src.to, hk:src.hook, ms:src.msg, gf:src.gift, sb:src.sub, fr:src.fr });
      XPR_STATE.stage = 0;
      xprPlayChime(XPR_STATE.D.sn, 1);
      xprRefreshStudio();
    } else if(cmd === 'shape'){
      const sh = ui.dataset.v;
      if(!XPR_SHAPES[sh]) return;
      XPR_STATE.D.sh = sh;
      XPR_STATE.stage = 0;
      xprPlayChime(XPR_STATE.D.sn, 1);
      xprRefreshStudio();
    } else if(cmd === 'lang'){
      const lg = ui.dataset.v === 'en' ? 'en' : 'ar';
      const curPr = XPR_CUBE_PRESETS[XPR_STATE.preset];
      const prevLg = XPR_STATE.D.lg;
      XPR_STATE.D.lg = lg;
      if(curPr && prevLg !== lg){
        const oldDef = curPr[prevLg], newDef = curPr[lg];
        if(XPR_STATE.D.to === oldDef.to) XPR_STATE.D.to = newDef.to;
        if(XPR_STATE.D.hk === oldDef.hook) XPR_STATE.D.hk = newDef.hook;
        if(XPR_STATE.D.ms === oldDef.msg) XPR_STATE.D.ms = newDef.msg;
        if(XPR_STATE.D.gf === oldDef.gift) XPR_STATE.D.gf = newDef.gift;
        if(XPR_STATE.D.sb === oldDef.sub) XPR_STATE.D.sb = newDef.sub;
        if(XPR_STATE.D.fr === oldDef.fr) XPR_STATE.D.fr = newDef.fr;
      }
      xprRefreshStudio();
    } else if(cmd === 'theme'){
      XPR_STATE.D.th = ui.dataset.v;
      xprRefreshStudio();
    } else if(cmd === 'toggleprev'){
      if(!xprCanPreviewToggle()) return;
      if(xprUnlocked('cube')){
        XPR_STATE.previewSimVisitor = true;
      } else {
        XPR_STATE.previewSimVisitor = false;
        S.unlk = S.unlk || {};
        S.unlk.xpr_prev_on = 1;
      }
      xprRefreshStudio();
    } else if(cmd === 'copylink'){
      const url = xprShareUrl(XPR_STATE.D);
      try{ await navigator.clipboard.writeText(url); }catch(e){
        const inp = $('#xprShareInput'); if(inp){ inp.select(); document.execCommand('copy'); }
      }
      toast('🔗 ' + gzL('تم نسخ رابط المفاجأة! أرسله الآن بالواتساب','Surprise link copied! Ready for WhatsApp'));
    } else if(cmd === 'sharelink'){
      const url = xprShareUrl(XPR_STATE.D);
      if(navigator.share){
        try{ await navigator.share({ title: XPR_STATE.D.hk, text: (XPR_STATE.D.to ? `${XPR_STATE.D.to} — ` : '') + XPR_STATE.D.hk, url }); return; }catch(e){}
      }
      try{ await navigator.clipboard.writeText(url); }catch(e){}
      toast('🔗 ' + gzL('تم نسخ الرابط الجاهز للإرسال بالواتساب','Link copied for WhatsApp'));
    } else if(cmd === 'openfull' || cmd === 'openfullpreview'){
      xprOpenFullscreen(XPR_STATE.D, false);
    } else if(cmd === 'dlcard'){
      xprDownloadCardPNG();
    } else if(cmd === 'printcard'){
      xprPrintCardPDF();
    } else if(cmd === 'dlhtml'){
      xprDownloadStandaloneHTML();
    }
  });

  container.addEventListener('input', ev=>{
    const fld = ev.target.dataset && ev.target.dataset.xfld;
    if(!fld) return;
    XPR_STATE.D[fld] = ev.target.value;
    if(fld === 'sn') xprPlayChime(ev.target.value, 1);
    if(['ms'].includes(fld)) XPR_STATE.stage = 1;
    else if(['gf','sb','lk'].includes(fld)) XPR_STATE.stage = 2;
    xprRefreshStageOnly();
  });
}

/* Auto-Boot Recipient Fullscreen View when a shared gift link (?exp=cube&d=...) is opened */
(function xprCheckIncomingGiftLink(){
  const run = ()=>{
    try{
      const sp = new URLSearchParams(location.search);
      if(sp.get('explore') === 'experiences' && typeof go === 'function'){
        setTimeout(()=>go('eilan://experiences'), 80);
        return;
      }
      let expType = sp.get('exp'), tok = sp.get('d');
      if(!expType && /^#exp=cube:/i.test(location.hash)){
        expType = 'cube';
        tok = location.hash.slice('#exp=cube:'.length);
      }
      if(expType !== 'cube' || !tok) return;
      const D = xprDecodeData(tok);
      if(!D) return;
      const boot = $('#boot');
      if(boot) boot.classList.add('hide');
      document.title = (D.to ? `${D.to} · ` : '') + 'مفاجأة خاصة لك — إيلان دول';
      xprOpenFullscreen(D, true);
    }catch(e){}
  };
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ()=>setTimeout(run, 30));
  else setTimeout(run, 30);
})();
