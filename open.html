<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نوافذ إيلان — كتب وقاموس وموسوعة وألعاب ودول وفن | إيلان دول</title>
<meta name="description" content="نوافذ إيلان: كتب حقيقية، قاموس، حاسبة معادلات، موسوعة ويكيبيديا، تحدّي المعلومات، خمّن الدولة، بطاقات الدول والإجازات والعملات، ومعرض لوحات عالمية — بيانات حقيقية من مصادر مفتوحة.">
<meta name="theme-color" content="#07080C">
<link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--night:#07080C;--blue:#1E44C8;--blue-d:#0B1F5E;--green:#0F6B44;--green-d:#07341F;--purple:#4A2A8F;--purple-d:#251147;--mint:#D8FFE6;--gold:#E2B450;--mu:#9FB3A8;--ui:'Tajawal',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--night);color:#EDEFF6;font-family:var(--ui);-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:40px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(7,8,12,.92);border-bottom:1px solid rgba(216,255,230,.08);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;min-width:0}
.brand img{width:32px;height:32px}
.brand b{display:block;font-size:15px}.brand small{display:block;font-size:11px;color:var(--mu)}
.sp{flex:1}
.ib{height:38px;padding:0 12px;border-radius:11px;display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(216,255,230,.16);background:rgba(15,18,30,.7);font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px}
.hero{display:flex;gap:16px;align-items:center;margin:4px 0 16px}
.cubes{display:grid;grid-template-columns:repeat(3,14px);gap:4px;flex:0 0 auto}
.cubes i{display:block;width:14px;height:14px;border-radius:4px;animation:glow 3.2s ease-in-out infinite}
.cubes i:nth-child(2n){animation-delay:.5s}.cubes i:nth-child(3n){animation-delay:1s}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.45)}}
@media (prefers-reduced-motion:reduce){.cubes i{animation:none}}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--gold);font-weight:700}
h1{font-family:'Reem Kufi',var(--ui);font-size:28px;line-height:1.25;margin:2px 0 4px}
.lead{color:#B9C7C0;font-size:15px;line-height:1.7}
/* section switcher */
.secs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.secs::-webkit-scrollbar{display:none}
.sec{flex:0 0 auto;border:1px solid rgba(216,255,230,.18);background:rgba(15,18,30,.6);border-radius:12px;padding:8px 13px;font-size:14px;font-weight:700;display:inline-flex;gap:7px;align-items:center}
.sec.on{background:linear-gradient(135deg,var(--purple),var(--purple-d));border-color:rgba(226,180,80,.55)}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid rgba(216,255,230,.3);background:transparent;border-radius:999px;padding:6px 13px;font-size:14px}
.tab.on{background:var(--mint);color:var(--green-d);border-color:var(--mint);font-weight:700}
.panel{background:rgba(11,31,94,.18);border:1px solid rgba(30,68,200,.35);border-radius:16px;padding:16px}
.panel h2{font-size:18px;margin-bottom:4px;display:flex;gap:8px;align-items:center}
.panel .sub{color:var(--mu);font-size:13px;line-height:1.6;margin-bottom:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar input,.bar select{flex:1 1 180px;min-width:0;height:42px;border-radius:10px;border:1px solid rgba(216,255,230,.18);background:rgba(7,8,12,.6);padding:0 10px;font-size:15px}
.bar select{flex:0 1 auto}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.btn{height:42px;border-radius:10px;border:1px solid rgba(226,180,80,.6);background:transparent;color:var(--gold);padding:0 14px;font-weight:700;font-size:14px;white-space:nowrap}
.btn.g{background:linear-gradient(135deg,var(--green),var(--green-d));border-color:transparent;color:#fff}
.btn.sm{height:34px;font-size:13px;padding:0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:rgba(7,8,12,.55);border:1px solid rgba(216,255,230,.1);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none}
.card .im{aspect-ratio:3/4;background:linear-gradient(135deg,var(--blue-d),var(--purple-d));display:grid;place-items:center;font-size:34px}
.card .im img{width:100%;height:100%;object-fit:cover;display:block}
.card.wide .im{aspect-ratio:4/3}
.card .bd{padding:9px 10px;font-size:13px;line-height:1.5}
.card .bd b{display:block;font-size:14px;margin-bottom:2px;overflow-wrap:anywhere}
.mu{color:var(--mu)}
.state{padding:22px 8px;text-align:center;color:var(--mu);font-size:14px}
.err{color:#F09595}
.src{margin-top:14px;font-size:12px;color:var(--mu);line-height:1.7;border-top:1px solid rgba(216,255,230,.08);padding-top:10px}
.src a{color:var(--mint)}
.def{border-top:1px solid rgba(216,255,230,.08);padding:10px 0}
.def:first-child{border-top:0}
.def .pos{display:inline-block;font-size:12px;background:var(--purple-d);border-radius:6px;padding:1px 8px;margin-bottom:4px}
.ltr{direction:ltr;text-align:left}
.res{font-size:22px;font-weight:900;color:var(--mint);background:rgba(7,8,12,.6);border-radius:12px;padding:14px;margin-top:8px;overflow-wrap:anywhere}
.wl a{display:block;padding:10px;border-radius:10px;text-decoration:none;border:1px solid transparent}
.wl a:hover{border-color:rgba(216,255,230,.15);background:rgba(7,8,12,.4)}
.wsum{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.wsum img{width:160px;max-width:40%;border-radius:12px}
.wsum div{flex:1 1 220px;line-height:1.8}
/* quiz */
.q{font-size:19px;line-height:1.6;font-weight:700;margin:6px 0 12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{min-height:48px;border-radius:12px;border:1px solid rgba(216,255,230,.22);background:rgba(7,8,12,.55);padding:8px 12px;font-size:15px;text-align:start}
.opt.ok{background:var(--green);border-color:var(--mint)}
.opt.no{background:#5a1d2a;border-color:#F09595}
.score{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:14px;color:var(--mu)}
.flag{width:min(260px,70%);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.5);display:block;margin:4px auto 14px}
.lock{text-align:center;padding:20px 10px;border:1px dashed rgba(226,180,80,.6);border-radius:14px;margin-top:10px}
.lock b{display:block;font-size:18px;margin-bottom:6px}
/* country card */
.cc{display:grid;grid-template-columns:minmax(0,220px) 1fr;gap:16px;align-items:start}
@media (max-width:640px){.cc{grid-template-columns:1fr}}
.cc img{width:100%;border-radius:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.fact{background:rgba(7,8,12,.55);border-radius:10px;padding:8px 10px;font-size:13px}
.fact span{display:block;color:var(--mu);font-size:12px}
.hol{margin-top:14px}
.hol li{list-style:none;display:flex;gap:10px;padding:7px 0;border-top:1px solid rgba(216,255,230,.07);font-size:14px}
.hol li b{min-width:92px;color:var(--gold);font-weight:700}
.fxrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.fxrow div{background:rgba(7,8,12,.55);border-radius:10px;padding:10px;font-size:14px}
.fxrow div b{display:block;font-size:18px;color:var(--mint)}
.foot{margin-top:22px;text-align:center;font-size:12px;color:var(--mu)}
</style>
</head>
<body>
<header class="top">
 <a class="brand" id="home" href="/"><img src="/assets/logo/eilan-icon.svg" alt=""><span><b>إيلان دول</b><small data-t="نوافذ إيلان|Eilan Windows"></small></span></a>
 <span class="sp"></span>
 <button class="ib" id="langBtn" type="button">EN</button>
 <a class="ib" id="backBtn" href="/" data-t="↩ العالم|↩ World"></a>
</header>
<main class="wrap">
 <div class="hero">
  <div class="cubes" aria-hidden="true"><i style="background:#0B1F5E"></i><i style="background:#1E44C8"></i><i style="background:#E2B450"></i><i style="background:#07341F"></i><i style="background:#0F6B44"></i><i style="background:#4A2A8F"></i><i style="background:#251147"></i><i style="background:#0F6B44"></i><i style="background:#1E44C8"></i></div>
  <div>
   <div class="eyebrow">EILAN WINDOWS</div>
   <h1 data-t="نوافذ إيلان|Eilan Windows"></h1>
   <p class="lead" data-t="بيانات حقيقية من مصادر مفتوحة ومجانية، داخل عالم إيلان.|Real data from free, open sources — inside the Eilan world."></p>
  </div>
 </div>
 <nav class="secs" id="secs" aria-label="sections"></nav>
 <div class="tabs" id="tabs"></div>
 <section class="panel" id="panel" aria-live="polite"></section>
 <p class="foot">© إيلان دول · EILAN DOLL</p>
</main>
<script>
(()=>{
/* ---------- language ---------- */
const P=new URLSearchParams(location.search);let EN=P.get('lang')==='en';
const T=(a,e)=>EN?e:a;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{try{return new Intl.NumberFormat(EN?'en-US':'ar-SA-u-nu-latn').format(n)}catch(e){return String(n)}};
const $=s=>document.querySelector(s);
function applyLang(){document.documentElement.lang=EN?'en':'ar';document.documentElement.dir=EN?'ltr':'rtl';
 document.querySelectorAll('[data-t]').forEach(el=>{const [a,e]=el.dataset.t.split('|');el.textContent=EN?e:a});
 $('#langBtn').textContent=EN?'عربي':'EN';const q=EN?'?lang=en':'';$('#home').href='/'+q;$('#backBtn').href=backHref()}
function backHref(){const m={books:'/learn/',dict:'/learn/',math:'/learn/',wiki:'/',trivia:'/play/',flags:'/play/',country:'/cities/',holidays:'/cities/',fx:'/cities/',price:'/store/',art:'/studio/'};return (m[cur]||'/')+(EN?'?lang=en':'')}

/* ---------- API gateway ---------- */
const cache=new Map();
async function api(params){const k=new URLSearchParams(params).toString();if(cache.has(k))return cache.get(k);
 const r=await fetch('/api/open?'+k);if(!r.ok)throw new Error(r.status);const j=await r.json();cache.set(k,j);return j}
const loading=()=>`<div class="state">${T('لحظة… نجيب البيانات','One moment… fetching data')}</div>`;
const failed=()=>`<div class="state err">${T('ما قدرنا نوصل للمصدر الحين. جرّب بعد شوي.','Could not reach the source right now. Try again shortly.')}</div>`;
const empty=()=>`<div class="state">${T('ما لقينا نتائج. جرّب كلمة ثانية.','No results. Try another word.')}</div>`;
const src=(html)=>`<div class="src">${html}</div>`;

/* ---------- paid-game rule: first 3 free ---------- */
const FREE=3;
const lockBox=()=>`<div class="lock"><b>${T('تبي تكمل؟','Want to keep playing?')}</b><p class="mu">${T('أول 3 أسئلة مجانية. اللعبة الكاملة تتوفر في متجر إيلان قريبًا.','The first 3 questions are free. The full game is coming soon to the Eilan store.')}</p><p style="margin-top:10px"><a class="btn g" href="/store/${EN?'?lang=en':''}" style="display:inline-flex;align-items:center;text-decoration:none">${T('🛒 متجر إيلان','🛒 Eilan store')}</a></p></div>`;

/* ---------- sections & tabs ---------- */
const SECS=[
 {id:'learn',ic:'🎓',ar:'الأكاديمية والمكتبة',en:'Academy & Library',tabs:['books','dict','math']},
 {id:'wiki',ic:'📖',ar:'الموسوعة',en:'Encyclopedia',tabs:['wiki']},
 {id:'play',ic:'🎮',ar:'منطقة الألعاب',en:'Games',tabs:['flags','trivia']},
 {id:'dest',ic:'🧭',ar:'وجهتي',en:'My Destination',tabs:['country','holidays','fx']},
 {id:'studio',ic:'🎨',ar:'الاستوديو والتصميم',en:'Design Studio',tabs:['art']},
 {id:'store',ic:'🛒',ar:'المتجر',en:'Store',tabs:['price']}
];
const TABS={books:['📚 كتب حقيقية','📚 Real books'],dict:['🔤 القاموس الإنجليزي','🔤 English dictionary'],math:['➗ حاسبة المعادلات','➗ Equation solver'],
 wiki:['📖 ويكيبيديا','📖 Wikipedia'],flags:['🏳️ خمّن الدولة','🏳️ Guess the country'],trivia:['🧠 تحدّي المعلومات','🧠 Trivia challenge'],
 country:['🌍 بطاقة دولة','🌍 Country card'],holidays:['🗓️ الإجازات الرسمية','🗓️ Public holidays'],fx:['💱 محوّل العملات','💱 Currency converter'],
 art:['🖼️ معرض اللوحات العالمية','🖼️ World art gallery'],price:['💳 الأسعار بعملتك','💳 Prices in your currency']};
let cur=(location.hash.slice(1)||'books');if(!TABS[cur])cur='books';
const secOf=t=>SECS.find(s=>s.tabs.includes(t));
function drawNav(){const s=secOf(cur);
 $('#secs').innerHTML=SECS.map(x=>`<button class="sec${x===s?' on':''}" data-sec="${x.id}" type="button">${x.ic} ${EN?x.en:x.ar}</button>`).join('');
 $('#tabs').innerHTML=s.tabs.length>1?s.tabs.map(t=>`<button class="tab${t===cur?' on':''}" data-tab="${t}" type="button">${EN?TABS[t][1]:TABS[t][0]}</button>`).join(''):''}
function open(t){cur=t;history.replaceState(null,'',location.pathname+location.search+'#'+t);drawNav();applyLang();VIEWS[t]($('#panel'))}
document.addEventListener('click',ev=>{const a=ev.target.closest('[data-sec]');if(a){open(SECS.find(s=>s.id===a.dataset.sec).tabs[0]);return}
 const b=ev.target.closest('[data-tab]');if(b)open(b.dataset.tab)});
$('#langBtn').onclick=()=>{EN=!EN;const u=new URL(location.href);EN?u.searchParams.set('lang','en'):u.searchParams.delete('lang');history.replaceState(null,'',u);open(cur)};
const onEnter=(inp,fn)=>inp.addEventListener('keydown',e=>{if(e.key==='Enter')fn()});

/* ---------- 📚 books: Open Library + Project Gutenberg ---------- */
function vBooks(el){
 el.innerHTML=`<h2>📚 ${T('ابحث عن كتاب','Find a book')}</h2><p class="sub">${T('ملايين الكتب الحقيقية بأغلفتها من Open Library، وكتب كلاسيكية مجانية تُقرأ كاملة من مشروع غوتنبرغ.','Millions of real books with covers from Open Library, plus free classics you can read in full from Project Gutenberg.')}</p>
 <div class="bar"><input id="bq" type="search" placeholder="${T('اسم كتاب أو كاتب… مثل: الخيميائي','Book or author… e.g. The Alchemist')}"><select id="bs"><option value="books">${T('كل الكتب','All books')}</option><option value="gutenberg">${T('مجانية للقراءة','Free to read')}</option></select><button class="btn g" id="bgo" type="button">${T('ابحث','Search')}</button></div>
 <div id="bout"><div class="state">${T('اكتب اسم كتاب واضغط ابحث.','Type a title and press Search.')}</div></div>
 ${src(T('المصادر: <a href="https://openlibrary.org" target="_blank" rel="noopener">Open Library</a> (أرشيف الإنترنت) و<a href="https://www.gutenberg.org" target="_blank" rel="noopener">Project Gutenberg</a> عبر Gutendex. كتب غوتنبرغ ملكية عامة في الولايات المتحدة.','Sources: <a href="https://openlibrary.org" target="_blank" rel="noopener">Open Library</a> (Internet Archive) and <a href="https://www.gutenberg.org" target="_blank" rel="noopener">Project Gutenberg</a> via Gutendex. Gutenberg books are public domain in the USA.'))}`;
 const go=async()=>{const q=$('#bq').value.trim();if(!q)return;const s=$('#bs').value,out=$('#bout');out.innerHTML=loading();
  try{if(s==='books'){const j=await api({src:'books',q});const d=(j.docs||[]).slice(0,12);if(!d.length){out.innerHTML=empty();return}
    out.innerHTML=`<div class="grid">${d.map(b=>`<a class="card" href="https://openlibrary.org${esc(b.key)}" target="_blank" rel="noopener"><div class="im">${b.cover_i?`<img src="https://covers.openlibrary.org/b/id/${+b.cover_i}-M.jpg" alt="" loading="lazy">`:'📘'}</div><div class="bd"><b>${esc(b.title)}</b><span class="mu">${esc((b.author_name||[]).slice(0,2).join('، '))}${b.first_publish_year?' · '+b.first_publish_year:''}</span></div></a>`).join('')}</div>`}
   else{const j=await api({src:'gutenberg',q});const d=(j.results||[]).slice(0,12);if(!d.length){out.innerHTML=empty();return}
    out.innerHTML=`<div class="grid">${d.map(b=>{const f=b.formats||{};const read=f['text/html']||f['text/html; charset=utf-8']||f['text/plain; charset=utf-8']||f['text/plain']||'';const img=f['image/jpeg'];
     return `<a class="card" href="${esc(/^https:\/\//.test(read)?read:'https://www.gutenberg.org/ebooks/'+(+b.id))}" target="_blank" rel="noopener"><div class="im">${img?`<img src="${esc(img)}" alt="" loading="lazy">`:'📖'}</div><div class="bd"><b>${esc(b.title)}</b><span class="mu">${esc((b.authors||[]).map(a=>a.name).slice(0,2).join('، '))}</span><br><span style="color:var(--mint)">${T('📖 اقرأه مجانًا','📖 Read free')}</span></div></a>`}).join('')}</div>`}
  }catch(e){out.innerHTML=failed()}};
 $('#bgo').onclick=go;onEnter($('#bq'),go)}

/* ---------- 🔤 English dictionary ---------- */
function vDict(el){
 el.innerHTML=`<h2>🔤 ${T('القاموس الإنجليزي','English dictionary')}</h2><p class="sub">${T('اكتب كلمة إنجليزية وتطلع لك معانيها وأمثلتها ونطقها بالصوت.','Type an English word to get meanings, examples and spoken pronunciation.')}</p>
 <div class="bar"><input id="dq" type="search" class="ltr" placeholder="e.g. curious" autocapitalize="off"><button class="btn g" id="dgo" type="button">${T('ابحث','Look up')}</button></div><div id="dout"></div>
 ${src(T('المصدر: <a href="https://dictionaryapi.dev" target="_blank" rel="noopener">Free Dictionary API</a> (بيانات ويكاموس، CC BY-SA).','Source: <a href="https://dictionaryapi.dev" target="_blank" rel="noopener">Free Dictionary API</a> (Wiktionary data, CC BY-SA).'))}`;
 const go=async()=>{const w=$('#dq').value.trim(),out=$('#dout');if(!w)return;if(!/^[A-Za-z][A-Za-z' -]{0,39}$/.test(w)){out.innerHTML=`<div class="state">${T('اكتب كلمة إنجليزية بالحروف اللاتينية.','Use an English word in Latin letters.')}</div>`;return}
  out.innerHTML=loading();
  try{const j=await api({src:'dict',word:w});const e=Array.isArray(j)?j[0]:null;if(!e){out.innerHTML=empty();return}
   const audio=(e.phonetics||[]).map(p=>p.audio).find(a=>/^https:\/\//.test(a||''));const ph=e.phonetic||(e.phonetics||[]).map(p=>p.text).find(Boolean)||'';
   out.innerHTML=`<div class="ltr"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px"><b style="font-size:24px">${esc(e.word)}</b><span class="mu">${esc(ph)}</span>${audio?`<button class="btn sm" id="say" type="button">🔊</button>`:''}</div>
   ${(e.meanings||[]).slice(0,4).map(m=>`<div class="def"><span class="pos">${esc(m.partOfSpeech)}</span>${(m.definitions||[]).slice(0,3).map(d=>`<p style="line-height:1.7">• ${esc(d.definition)}${d.example?`<br><i class="mu">“${esc(d.example)}”</i>`:''}</p>`).join('')}${(m.synonyms||[]).length?`<p class="mu" style="font-size:13px">≈ ${esc(m.synonyms.slice(0,6).join(', '))}</p>`:''}</div>`).join('')}</div>`;
   if(audio)$('#say').onclick=()=>{try{new Audio(audio).play()}catch(x){}}
  }catch(e){out.innerHTML=String(e.message)==='404'?empty():failed()}};
 $('#dgo').onclick=go;onEnter($('#dq'),go)}

/* ---------- ➗ Equation solver (Newton) ---------- */
function vMath(el){
 const OPS=[['simplify','تبسيط','Simplify'],['factor','تحليل','Factor'],['derive','اشتقاق','Derivative'],['integrate','تكامل','Integral'],['zeroes','الأصفار (الحلول)','Zeroes (roots)']];

 const next=async()=>{if(n>=FREE){el.innerHTML=shell(`<div class="score"><span>${T('نتيجتك','Your score')}: <b>${score}/${n}</b></span></div>${lockBox()}`);return}

  try{const all=(await countries()).filter(c=>(c.population||0)>300000);if(all.length<4)throw 0;const pick=shuffle(all).slice(0,4),ans=pick[0],opts=shuffle(pick);

 const shell=b=>`<h2>🧠 ${T('تحدّي المعلومات','Trivia challenge')} <span class="mu" style="font-size:13px">English</span></h2><p class="sub">${T('أسئلة معلومات عامة باللغة الإنجليزية — تمرين ممتع للمعلومات واللغة معًا.','General-knowledge questions in English — a fun workout for facts and language.')}</p>
 <div class="bar"><select id="td"><option value="">${T('كل المستويات','Any level')}</option><option value="easy">${T('سهل','Easy')}</option><option value="medium">${T('متوسط','Medium')}</option><option value="hard">${T('صعب','Hard')}</option></select><button class="btn" id="tnew" type="button">${T('ابدأ من جديد','Restart')}</button></div>${b}
 ${src(T('الأسئلة من <a href="https://opentdb.com" target="_blank" rel="noopener">Open Trivia Database</a> بترخيص CC BY-SA 4.0.','Questions from <a href="https://opentdb.com" target="_blank" rel="noopener">Open Trivia Database</a>, CC BY-SA 4.0.'))}`;
 let lvl='';
 const bind=()=>{const s=$('#td');s.value=lvl;s.onchange=()=>{lvl=s.value;start()};$('#tnew').onclick=start};

  const q=qs[n],right=dec(q.correct_answer),opts=shuffle([right,...q.incorrect_answers.map(dec)]);
  el.innerHTML=shell(`<div class="score"><span>${T('سؤال','Question')} ${n+1}/${FREE} · ${esc(dec(q.category))}</span><span>${T('النقاط','Points')}: <b>${score}</b></span></div><div class="ltr"><p class="q">${esc(dec(q.question))}</p><div class="opts">${opts.map(o=>`<button class="opt" type="button">${esc(o)}</button>`).join('')}</div></div><p style="margin-top:12px;text-align:center" id="tnext"></p>`);bind();
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{el.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.textContent===right)x.classList.add('ok')});
   if(b.textContent===right)score++;else b.classList.add('no');n++;
   $('#tnext').innerHTML=`<button class="btn g" type="button" id="tgo">${n>=FREE?T('النتيجة','Result'):T('التالي ←','Next →')}</button>`;$('#tgo').onclick=show})};
 const start=async()=>{n=0;score=0;el.innerHTML=shell(loading());bind();
  try{const j=await fetch('/api/open?'+new URLSearchParams({src:'trivia',n:String(FREE),d:lvl})).then(r=>{if(!r.ok)throw 0;return r.json()});qs=(j.results||[]).filter(q=>q.correct_answer);if(!qs.length)throw 0;show()}
  catch(e){el.innerHTML=shell(failed());bind()}};
 start()}

 return `<ul>${h.map(x=>`<li><b>${esc(df.format(new Date(x.date+'T12:00:00')))}</b><span>${esc(x.localName)}${x.name&&x.name!==x.localName?` <span class="mu">· ${esc(x.name)}</span>`:''}</span></li>`).join('')}</ul>`}
 catch(e){return String(e.message)==='404'?`<p class="mu">${T('هذي الدولة غير مغطاة في مصدر الإجازات.','This country is not covered by the holidays source.')}</p>`:`<p class="err">${T('ما قدرنا نجيب الإجازات الحين.','Could not load holidays right now.')}</p>`}}

 const arr=Array.isArray(j)?j:(j.rates||j.data||[]);const r={};let date='';arr.forEach(x=>{if(x.quote&&x.rate){r[x.quote]=x.rate;date=x.date||date}});if(!Object.keys(r).length)throw new Error('fx');return {r,date}}

  <div id="cfx" class="fxrow"></div></div></div><div class="hol"><h3 style="font-size:16px;margin-bottom:4px">🗓️ ${T('الإجازات الرسمية','Public holidays')} ${y}</h3><div id="chol">${loading()}</div></div>`;

const CUR_AR={SAR:'ريال سعودي',USD:'دولار أمريكي',EUR:'يورو',GBP:'جنيه إسترليني',AED:'درهم إماراتي',KWD:'دينار كويتي',QAR:'ريال قطري',BHD:'دينار بحريني',OMR:'ريال عماني',EGP:'جنيه مصري',JOD:'دينار أردني',TRY:'ليرة تركية',JPY:'ين ياباني',KRW:'وون كوري',MYR:'رينغيت ماليزي',INR:'روبية هندية',CNY:'يوان صيني',CHF:'فرنك سويسري',CAD:'دولار كندي',AUD:'دولار أسترالي',IDR:'روبية إندونيسية',THB:'بات تايلندي',MAD:'درهم مغربي'};
const curName=k=>EN?k:(CUR_AR[k]?CUR_AR[k]+' ('+k+')':k);

 const card=(img,link,t,s)=>`<a class="card wide" href="${esc(link)}" target="_blank" rel="noopener"><div class="im"><img src="${esc(img)}" alt="" loading="lazy"></div><div class="bd"><b>${esc(t)}</b><span class="mu">${esc(s)}</span></div></a>`;
 const go=async()=>{const q=$('#aq').value.trim()||'landscape',m=$('#am').value,out=$('#aout');out.innerHTML=loading();
  try{if(m==='artic'){const j=await api({src:'artic',q});const d=(j.data||[]).filter(a=>a.image_id&&a.is_public_domain);if(!d.length){out.innerHTML=empty();return}
    out.innerHTML=`<div class="grid">${d.map(a=>card(`https://www.artic.edu/iiif/2/${encodeURIComponent(a.image_id)}/full/400,/0/default.jpg`,`https://www.artic.edu/artworks/${+a.id}`,a.title,[a.artist_title,a.date_display].filter(Boolean).join(' · '))).join('')}</div>`}
   else{const j=await api({src:'met',q});const ids=(j.objectIDs||[]).slice(0,24);if(!ids.length){out.innerHTML=empty();return}
    const objs=(await Promise.all(ids.map(id=>api({src:'metobj',id}).catch(()=>null)))).filter(o=>o&&o.isPublicDomain&&/^https:\/\//.test(o.primaryImageSmall||'')).slice(0,12);
    out.innerHTML=objs.length?`<div class="grid">${objs.map(o=>card(o.primaryImageSmall,o.objectURL||'https://www.metmuseum.org',o.title,[o.artistDisplayName,o.objectDate].filter(Boolean).join(' · '))).join('')}</div>`:empty()}
  }catch(e){out.innerHTML=failed()}};
 $('#ago').onclick=go;onEnter($('#aq'),go);go()}

const VIEWS={books:vBooks,dict:vDict,math:vMath,wiki:vWiki,flags:vFlags,trivia:vTrivia,country:vCountry,holidays:vHolidays,fx:el=>vFx(el,false),price:el=>vFx(el,true),art:vArt};
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(TABS[t]&&t!==cur)open(t)});
open(cur);
})();
</script>
