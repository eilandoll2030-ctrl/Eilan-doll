<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ورشة إيلان — باقة الكشتة | إيلان دول</title>
<meta name="description" content="باقة الكشتة من إيلان دول: غلاف، دعوة، برنامج الليلة، تحدّي الكشتة، بطاقات المهام وشهادة نجم الكشتة — خصّصها إيلان باسمك، أو خذها قالب كانفا تعدّله بنفسك.">
<meta name="theme-color" content="#07080C">
<link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--night:#07080C;--blue:#1E44C8;--blue-d:#0B1F5E;--green:#0F6B44;--green-d:#07341F;--purple:#4A2A8F;--purple-d:#251147;--mint:#D8FFE6;--gold:#E2B450;--mu:#9FB3A8;--ui:'Tajawal',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--night);color:#EDEFF6;font-family:var(--ui);-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(7,8,12,.92);border-bottom:1px solid rgba(216,255,230,.08);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;min-width:0}
.brand img{width:32px;height:32px}
.brand b{display:block;font-size:15px}.brand small{display:block;font-size:11px;color:var(--mu)}
.sp{flex:1}
.ib{height:38px;padding:0 12px;border-radius:11px;display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(216,255,230,.16);background:rgba(15,18,30,.7);font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--gold);font-weight:700}
h1{font-family:'Readex Pro',var(--ui);font-size:30px;line-height:1.25;margin:2px 0 6px}
h2.sec{font-family:'Readex Pro',var(--ui);font-size:22px;margin:30px 0 4px}
.lead{color:#B9C7C0;font-size:15px;line-height:1.7}
.ad{position:relative;overflow:hidden;border-radius:18px;border:1px solid rgba(226,180,80,.45);background:linear-gradient(120deg,rgba(74,42,143,.35),rgba(11,31,94,.3) 55%,rgba(15,107,68,.25));padding:16px;margin-top:6px}
.ad .tag{display:inline-block;font-size:12px;font-weight:700;color:#412402;background:var(--gold);border-radius:999px;padding:3px 10px;margin-bottom:8px}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
@media (max-width:700px){.gal{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gal figure{position:relative;border-radius:10px;overflow:hidden;border:1px solid rgba(216,255,230,.12);background:#000}
.gal figure.big{grid-column:1/-1}
.gal canvas{display:block;width:100%;height:auto}
.gal figcaption{position:absolute;bottom:6px;inset-inline-start:6px;font-size:11px;background:rgba(7,8,12,.8);padding:2px 8px;border-radius:999px;color:var(--mint)}
.gal .smp{position:absolute;top:6px;inset-inline-end:6px;font-size:11px;font-weight:700;background:var(--gold);color:#412402;padding:2px 8px;border-radius:999px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
@media (max-width:700px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{border-radius:16px;border:1px solid rgba(30,68,200,.45);background:rgba(11,31,94,.22);padding:14px;display:flex;flex-direction:column;gap:8px}
.opt.feat{border:2px solid var(--gold);background:linear-gradient(140deg,rgba(74,42,143,.32),rgba(11,31,94,.28))}
.opt h3{font-size:17px;display:flex;align-items:center;gap:8px}
.opt h3 .n{width:26px;height:26px;border-radius:8px;background:var(--purple);display:inline-grid;place-items:center;font-size:13px;color:var(--mint);flex:0 0 auto}
.opt p{font-size:14px;color:#C2CEC8;line-height:1.7}
.opt ul{list-style:none;font-size:13px;color:#B9C7C0;line-height:1.9}
.opt ul li::before{content:'▪ ';color:var(--gold)}
.opt .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px}
.price{font-weight:900;font-size:15px;color:var(--gold)}
.badge{font-size:11px;font-weight:700;color:#412402;background:var(--gold);border-radius:999px;padding:2px 8px}
.grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:18px;align-items:start;margin-top:12px}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:rgba(11,31,94,.18);border:1px solid rgba(30,68,200,.35);border-radius:16px;padding:14px}
.step{border-top:1px solid rgba(216,255,230,.08);padding:14px 2px}
.step:first-child{border-top:0;padding-top:4px}
.step h4{font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.step h4 .n{width:24px;height:24px;border-radius:7px;background:var(--purple);display:inline-grid;place-items:center;font-size:13px;color:var(--mint)}
.hint{font-size:12px;color:var(--mu);margin-bottom:6px;line-height:1.6}
label.f{display:block;font-size:13px;color:#B9C7C0;margin:8px 0 4px}
input[type=text],input[type=date],input[type=time]{width:100%;height:40px;border-radius:10px;border:1px solid rgba(216,255,230,.18);background:rgba(7,8,12,.6);padding:0 10px;font-size:15px}
input:focus{outline:2px solid var(--blue);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid rgba(216,255,230,.35);background:transparent;border-radius:999px;padding:6px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--mint);color:var(--green-d);border-color:var(--mint);font-weight:700}
.chip .x{opacity:.6;font-size:12px}
.add{display:flex;gap:6px;margin-top:8px}
.add input{flex:1}
.btn{height:40px;border-radius:10px;border:1px solid rgba(226,180,80,.6);background:transparent;color:var(--gold);padding:0 14px;font-weight:700;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.g{background:linear-gradient(135deg,var(--green),var(--green-d));border-color:transparent;color:#fff}
.btn.full{width:100%;height:48px;font-size:16px}
.err{color:#F09595;font-size:12px;min-height:16px;margin-top:4px}
.list .it{display:grid;grid-template-columns:110px 1fr 34px;gap:6px;margin-bottom:6px}
.list.tasks .it{grid-template-columns:34px 1fr 1fr;align-items:center}
.list.tasks .ico{font-size:20px;text-align:center}
.del{height:40px;border-radius:10px;border:1px solid rgba(240,149,149,.4);background:transparent;color:#F09595}
.prev{position:sticky;top:70px}
@media (max-width:900px){.prev{position:static}}
.pv-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.pv-h b{font-size:15px}
.pv-h small{color:var(--mu);font-size:12px}
.pages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pages figure{background:#000;border-radius:10px;overflow:hidden;border:1px solid rgba(216,255,230,.1)}
.pages canvas{display:block;width:100%;height:auto}
.pages figcaption{font-size:12px;color:var(--mu);padding:5px 8px;background:rgba(7,8,12,.9)}
.pages figure.big{grid-column:1/-1}
.buy{margin-top:14px;background:linear-gradient(120deg,rgba(74,42,143,.35),rgba(15,107,68,.25));border:1px solid rgba(226,180,80,.4);border-radius:14px;padding:14px}
.buy p{font-size:13px;color:#C9D6CF;line-height:1.7;margin-top:8px}
.note{font-size:12px;color:var(--mu);line-height:1.7;margin-top:10px}
</style>
</head>
<body>
<header class="top">
 <a class="brand" href="/"><img src="/assets/logo/eilan-icon.svg" alt=""><span><b data-t="إيلان دول|EILAN DOLL"></b><small data-t="ورشة إيلان|Eilan Workshop"></small></span></a>
 <span class="sp"></span>
 <button class="ib" id="langBtn" type="button">EN</button>
 <a class="ib" href="/" data-t="الرئيسية|Home"></a>
</header>

<main class="wrap">
 <section class="ad" aria-labelledby="adT">
  <span class="tag" data-t="جديد في ورشة إيلان|New in Eilan Workshop"></span>
  <div class="eyebrow">EILAN WORKSHOP · KASHTA KIT</div>
  <h1 id="adT" data-t="باقة الكشتة — تخصّصها إيلان باسمك|The Kashta Kit — Eilan makes it yours"></h1>
  <p class="lead" data-t="٦ صفحات لليلة البر: غلاف، دعوة، برنامج الليلة، تحدّي الكشتة، بطاقات المهام وشهادة نجم الكشتة. شوف المثال تحت، وبعدها اختر اللي يناسبك.|Six pages for your desert night: cover, invitation, night plan, the kashta challenge, task cards and a star certificate. See the sample below, then pick what suits you."></p>
  <div class="gal" id="gal" aria-label="sample"></div>
 </section>

 <h2 class="sec" data-t="اختر طريقتك|Choose your way"></h2>
 <p class="lead" data-t="كل الخيارات بنفس التصميم اللي شفته في المثال.|Every option uses the same design as the sample."></p>
 <div class="opts">
  <article class="opt feat">
   <h3><span class="n">1</span><span data-t="باقة تخصّصها إيلان|Made by Eilan for you"></span> <span class="badge" data-t="الأسهل|Easiest"></span></h3>
   <p data-t="تكتب اسمكم والموعد والأشياء والأسئلة والمهام، وإيلان تبني الباقة كاملة على طول.|Type your names, time, items, questions and tasks — Eilan builds the full kit instantly."></p>
   <ul><li data-t="ملف PDF جاهز للطباعة والآيباد|Print and iPad-ready PDF"></li><li data-t="ما تحتاج كانفا ولا أي برنامج|No Canva or app needed"></li></ul>
   <div class="row"><span class="price" data-t="السعر قريبًا|Price coming soon"></span><a class="btn g" href="#make" data-t="صمّم باقتك|Design your kit"></a></div>
  </article>
  <article class="opt">
   <h3><span class="n">2</span><span data-t="قالب كانفا فاضي|Blank Canva template"></span></h3>
   <p data-t="نفس التصميم بدون أي كلام. تفتحه في حسابك في كانفا وتكتب فيه اللي تبيه.|The same design with no text. Open it in your Canva account and write anything."></p>
   <ul><li data-t="يشتغل مع حساب كانفا المجاني|Works with a free Canva account"></li><li data-t="حرية كاملة في الكلام والترتيب|Full freedom over text and layout"></li></ul>
   <div class="row"><span class="price" data-t="السعر قريبًا|Price coming soon"></span><button class="btn" type="button" data-soon data-t="يفتح البيع قريبًا|Sales open soon"></button></div>
  </article>
  <article class="opt">
   <h3><span class="n">3</span><span data-t="قالب كانفا جاهز بالمثال|Ready Canva template (sample)"></span></h3>
   <p data-t="ملف «كشتة عائلة الريّان» نفسه، وتغيّر فيه الاسم والأشياء والأسئلة على كيفك.|The “Al-Rayyan” sample itself — change the name, items and questions as you like."></p>
   <ul><li data-t="كل شي مكتوب، تعدّل بس|Everything written — just edit"></li><li data-t="يشتغل مع حساب كانفا المجاني|Works with a free Canva account"></li></ul>
   <div class="row"><span class="price" data-t="السعر قريبًا|Price coming soon"></span><button class="btn" type="button" data-soon data-t="يفتح البيع قريبًا|Sales open soon"></button></div>
  </article>
  <article class="opt">
   <h3><span class="n">4</span><span data-t="القالبين مع بعض|Both templates"></span></h3>
   <p data-t="القالب الفاضي والقالب الجاهز في طلب واحد.|The blank and the ready template in one order."></p>
   <ul><li data-t="ابدأ من المثال أو من الصفر|Start from the sample or from scratch"></li></ul>
   <div class="row"><span class="price" data-t="السعر قريبًا|Price coming soon"></span><button class="btn" type="button" data-soon data-t="يفتح البيع قريبًا|Sales open soon"></button></div>
  </article>
 </div>
 <p class="err" id="soonMsg" role="status"></p>

 <h2 class="sec" id="make" data-t="صمّم باقتك|Design your kit"></h2>
 <p class="lead" data-t="أي خانة تتركها فاضية تطلع بكلام المثال.|Any field you leave empty uses the sample text."></p>
 <div class="grid">
  <form class="panel" id="form" autocomplete="off" onsubmit="return false">
   <div class="step">
    <h4><span class="n">1</span><span data-t="الغلاف والدعوة|Cover and invitation"></span></h4>
    <label class="f" for="name" data-t="اسم العائلة أو الشلة|Family or group name"></label>
    <input type="text" id="name" maxlength="28">
    <label class="f" for="tagline" data-t="سطر تحت الاسم|Line under the name"></label>
    <input type="text" id="tagline" maxlength="48">
    <div class="row2">
     <div><label class="f" for="date" data-t="التاريخ (اختياري)|Date (optional)"></label><input type="date" id="date"></div>
     <div><label class="f" for="time" data-t="وقت التجمّع (اختياري)|Meet-up time (optional)"></label><input type="time" id="time"></div>
    </div>
    <label class="f" for="place" data-t="المكان|Place"></label>
    <input type="text" id="place" maxlength="28">
    <label class="f" for="placeSub" data-t="وصف أو رابط المكان (اختياري)|Place note or link (optional)"></label>
    <input type="text" id="placeSub" maxlength="34">
   </div>

   <div class="step">
    <h4><span class="n">2</span><span data-t="وش تجيب معك؟|What to bring"></span></h4>
    <p class="hint" data-t="اختر لين ٨ أشياء، أو أضف من عندك.|Pick up to 8 items, or add your own."></p>
    <div class="chips" id="bring"></div>
    <div class="add"><input type="text" id="bringIn" maxlength="16" data-ph="أضف شي من عندك|Add your own item" aria-label="bring"><button class="btn" type="button" id="bringAdd" data-t="أضف|Add"></button></div>
    <div class="err" id="bringErr"></div>
   </div>

   <div class="step">
    <h4><span class="n">3</span><span data-t="برنامج الليلة|Night plan"></span></h4>
    <p class="hint" data-t="لين ٥ فقرات.|Up to 5 items."></p>
    <div class="list" id="prog"></div>
    <button class="btn" type="button" id="progAdd" data-t="+ فقرة|+ Item"></button>
   </div>

   <div class="step">
    <h4><span class="n">4</span><span data-t="تحدّي الكشتة|The kashta challenge"></span></h4>
    <div class="row2">
     <div><label class="f" for="teamA" data-t="الفريق الأول|Team one"></label><input type="text" id="teamA" maxlength="14"></div>
     <div><label class="f" for="teamB" data-t="الفريق الثاني|Team two"></label><input type="text" id="teamB" maxlength="14"></div>
    </div>
    <label class="f" data-t="اختر لين ٤ أسئلة (يجاوبون عليها غلط!)|Pick up to 4 questions (answer them wrong!)"></label>
    <div class="chips" id="qs"></div>
    <div class="add"><input type="text" id="qIn" maxlength="38" data-ph="سؤال من عندك|Your own question" aria-label="question"><button class="btn" type="button" id="qAdd" data-t="أضف|Add"></button></div>
    <div class="err" id="qErr"></div>
   </div>

   <div class="step">
    <h4><span class="n">5</span><span data-t="بطاقات المهام|Task cards"></span></h4>
    <p class="hint" data-t="٤ بطاقات، كل وحدة لها رسمتها. غيّر اسم المهمة واكتب مين عليها.|4 cards, each with its own drawing. Rename the task and add who does it."></p>
    <div class="list tasks" id="tasks"></div>
   </div>

   <div class="step">
    <h4><span class="n">6</span><span data-t="شهادة نجم الكشتة|Star certificate"></span></h4>
    <label class="f" for="wName" data-t="اسم الفائز (اتركه فاضي لو تبي تكتبه بيدك)|Winner's name (leave blank to write by hand)"></label>
    <input type="text" id="wName" maxlength="24">
    <label class="f" for="wTitle" data-t="اللقب|Title"></label>
    <input type="text" id="wTitle" maxlength="26">
   </div>
  </form>

  <aside class="prev">
   <div class="pv-h"><b data-t="معاينة باقتك|Your kit preview"></b><small data-t="٦ صفحات|6 pages"></small></div>
   <div class="pages" id="pages"></div>
   <div class="buy">
    <button class="btn g full" type="button" id="dl" data-t="حمّل نسخة المعاينة PDF|Download the preview PDF"></button>
    <p data-t="نسخة المعاينة عليها كلمة «معاينة». النسخة النظيفة الجاهزة للطباعة تفتح بعد الشراء، والبيع يفتح قريبًا.|The preview carries a “preview” mark. The clean print-ready file unlocks after purchase — sales open soon."></p>
   </div>
   <p class="note" data-t="الباقة تُبنى في جهازك وما تنرسل بياناتك لأي مكان. للاستخدام الشخصي فقط، وإعادة بيعها غير مسموحة.|The kit is built on your device; your details are not sent anywhere. Personal use only — reselling is not allowed."></p>
  </aside>
 </div>
</main>

<script>
(function(){
'use strict';
var W=1920,H=1080,UNLOCKED=false;
var EN=new URLSearchParams(location.search).get('lang')==='en';
function T(s){var p=String(s).split('|');return EN&&p[1]!==undefined?p[1]:p[0]}
function A(a){return typeof a==='string'?a:(EN?a[1]:a[0])}
var MINT='#B6F4D0',WHITE='#FFFFFF';

var BRING=[['فروة','Rug',1],['قهوة','Coffee',1],['حطب','Firewood',1],['شاي','Tea',0],['تمر','Dates',0],['حلا','Dessert',0],['كشاف','Flashlight',0],['بطانية','Blanket',0],['شوّاية','Grill',0],['ماء','Water',0],['سماعة','Speaker',0],['ألعاب','Games',0]];
var QS=[['مين أول شخص يقول برد؟','Who says “it’s cold” first?',1],['وش أكثر شي ننساه في الكشتة؟','What do we always forget?',1],['كم فنجان قهوة يشرب أبو فلان؟','How many coffees will Uncle drink?',1],['وش لون النار؟','What colour is the fire?',0],['كم نجمة في السما الحين؟','How many stars are out now?',0],['مين أول شخص بينام؟','Who falls asleep first?',0]];
var TASK_ICONS=['🔥','☕','🍢','📷'];
var SAMPLE={name:['عائلة الريّان','The Al-Rayyan family'],tagline:['رحلة شتوية في البر باسم العائلة أو الشلة','A winter desert night for the family or the crew'],
 dateL:['عطلة نهاية الأسبوع','This weekend'],dateS:['في أقرب وقت يناسبكم','Whenever suits you'],place:['البر – وجهتكم الخاصة','The desert — your spot'],placeSub:['رابط الموقع','Location link'],
 teamA:['الفريق الأول','Team one'],teamB:['الفريق الثاني','Team two'],wTitle:['نجم الضحك حول النار','Star of laughs by the fire'],
 prog:[['16:30',['الوصول ونصب الخيمة','Arrive & pitch the tent']],['17:30',['غروب وقهوة','Sunset & coffee']],['19:00',['العشاء','Dinner']],['20:00',['لعبة جاوب غلط','Answer-wrong game']],['22:00',['سوالف تحت النجوم','Stories under the stars']]],
 tasks:[['مهمة النار','Fire'],['مهمة القهوة','Coffee'],['مهمة الشواء','Grill'],['مهمة الصور','Photos']]};

function freshState(){return{name:'',tagline:'',date:'',time:'',place:'',placeSub:'',
 bring:BRING.map(function(b){return{t:[b[0],b[1]],on:!!b[2]}}),
 prog:SAMPLE.prog.map(function(p){return{time:p[0],act:p[1]}}),
 teamA:'',teamB:'',qs:QS.map(function(q){return{t:[q[0],q[1]],on:!!q[2]}}),
 tasks:SAMPLE.tasks.map(function(t){return{role:t,who:''}}),wName:'',wTitle:''}}
var st=freshState();
var sample=freshState();

/* ---------- UI ---------- */
var $=function(id){return document.getElementById(id)};
function applyLang(){

function b64(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
function buildPdf(jp){var enc=new TextEncoder(),parts=[],off=0,offs=[];function push(x){var b=typeof x==='string'?enc.encode(x):x;parts.push(b);off+=b.length}
 function obj(n,f){offs[n]=off;push(n+' 0 obj\n');f();push('\nendobj\n')}
 var PW=842,PH=474,n=jp.length,kids=[];for(var i=0;i<n;i++)kids.push((3+i*3)+' 0 R');
 push('%PDF-1.4\n');obj(1,function(){push('<< /Type /Catalog /Pages 2 0 R >>')});obj(2,function(){push('<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>')});
 jp.forEach(function(j,i){var p=3+i*3,im=p+1,cs=p+2,ct='q '+PW+' 0 0 '+PH+' 0 0 cm /Im0 Do Q';
  obj(p,function(){push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /XObject << /Im0 '+im+' 0 R >> >> /Contents '+cs+' 0 R >>')});
  obj(im,function(){push('<< /Type /XObject /Subtype /Image /Width '+W+' /Height '+H+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+j.length+' >>\nstream\n');push(j);push('\nendstream')});
  obj(cs,function(){push('<< /Length '+ct.length+' >>\nstream\n'+ct+'\nendstream')})});
 var total=3+n*3,x=off;push('xref\n0 '+total+'\n0000000000 65535 f \n');for(var k=1;k<total;k++)push(String(offs[k]).padStart(10,'0')+' 00000 n \n');
 push('trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+x+'\n%%EOF');return new Blob(parts,{type:'application/pdf'})}
