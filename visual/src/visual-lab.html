<style>
/* ===== مختبر إيلان البصري — Eilan Visual Lab (.vl-*) ===== */
@font-face{font-family:"Marhey";src:url(/visual/fonts/marhey.woff2) format("woff2");font-display:swap}
.vl-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.vl-hero h1{font-size:30px;line-height:1.25;margin:4px 0 6px}
.vl-hero p{color:var(--mu);max-width:640px}
.vl-quota{font-size:12.5px;color:var(--mu);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vl-wrap{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;align-items:start}
.vl-side{padding:14px;display:flex;flex-direction:column;gap:12px;position:sticky;top:8px;max-height:calc(100vh - 220px);overflow:auto}
.vl-tpls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.vl-tpl{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 6px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--bd);font-size:11px;font-weight:700;color:var(--mu);line-height:1.2;text-align:center;transition:.2s}
.vl-tpl ei-c.ei{width:30px;height:30px}
.vl-tpl.on{border-color:var(--g);color:var(--w);background:linear-gradient(160deg,rgba(232,182,74,.16),rgba(79,132,96,.12))}
.vl-tpl:hover{transform:translateY(-2px)}
.vl-desc{font-size:12.5px;color:var(--mu);line-height:1.6;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.03)}
.vl-desc b{color:var(--w)}
.vl-f label{display:block;font-size:12.5px;font-weight:800;margin-bottom:4px}
.vl-f small{display:block;font-size:11px;color:var(--mu2);margin-top:3px;line-height:1.5}
.vl-f input,.vl-f textarea{width:100%;background:#0d0e0a;border:1px solid var(--bd);border-radius:10px;padding:8px 10px;color:var(--w);font-size:13.5px;line-height:1.55;resize:vertical}
.vl-f textarea{min-height:86px}
.vl-f input:focus,.vl-f textarea:focus{outline:none;border-color:var(--g)}
.vl-row{display:flex;gap:6px;flex-wrap:wrap}
.vl-row .chip.on{background:var(--grad);color:#14150F;border-color:transparent;font-weight:800}
.vl-main{display:flex;flex-direction:column;gap:10px;min-width:0}
.vl-stage{padding:12px;border-radius:20px;display:grid;place-items:center;overflow:hidden}
.vl-stage svg{stroke:none!important;width:100%!important;height:auto!important;max-height:calc(100vh - 230px);border-radius:12px;box-shadow:0 20px 50px -24px #000;display:block}
.vl-acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-start}
.vl-acts .btn svg{width:16px;height:16px}
.vl-promo{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:18px 20px;margin-bottom:18px;border-color:var(--bd2)}
.vl-promo h3{font-size:19px;margin:4px 0}
.vl-pk{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.vl-pk .card{padding:14px;display:flex;flex-direction:column;gap:6px}
.vl-pk b{font-size:15px}.vl-pk p{font-size:12.5px;color:var(--mu);margin:0;line-height:1.6;flex:1}
.vl-pk .pr{font-weight:900;color:var(--g)}
@media (max-width:980px){.vl-wrap{grid-template-columns:1fr}.vl-main{order:-1}.vl-side{position:static;max-height:none}.vl-pk{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.vl-tpls{grid-template-columns:repeat(4,1fr)}.vl-promo{grid-template-columns:1fr}.vl-pk{grid-template-columns:1fr}.vl-hero h1{font-size:24px}}
html.light .vl-f input,html.light .vl-f textarea{background:#fff}
</style>
