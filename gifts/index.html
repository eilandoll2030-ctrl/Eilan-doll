<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080C">
<title>هدايا إيلان الحيّة · Eilan Living Gifts</title>
<link rel="icon" href="/favicon-96.png">
<style>
  :root{--bg:#07080C;--blue:#1E44C8;--blue2:#0B1F5E;--green:#0F6B44;--green2:#07341F;--pur:#4A2A8F;--pur2:#251147;--mint:#D8FFE6;--gold:#f5c242;--line:#ffffff1c}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#0B1F5E55,transparent),radial-gradient(900px 500px at 0% 110%,#25114755,transparent),var(--bg);color:#fff;font-family:"Segoe UI",Tahoma,"PingFang SC","Hiragino Sans","Apple SD Gothic Neo","Noto Sans CJK SC",system-ui,sans-serif;min-height:100vh}
  a{color:inherit}
  .wrap{max-width:1140px;margin:0 auto;padding:16px 16px 60px}
  header{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none}
  .brand img{width:38px;height:38px}
  .brand b{letter-spacing:2px;font-size:14px}.brand small{display:block;opacity:.55;font-size:10px;letter-spacing:3px}
  .pill{border:1px solid var(--line);background:#ffffff0d;border-radius:999px;padding:8px 14px;font-size:13px;text-decoration:none;cursor:pointer;color:#fff;font-family:inherit}
  .langs{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
  .langs button{border:1px solid var(--line);background:#ffffff08;color:#fff;border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  .langs button.on{background:linear-gradient(90deg,var(--blue),var(--pur));border-color:transparent}
  h1{font-size:clamp(26px,5vw,42px);margin:22px 0 6px}
  h1 span{background:linear-gradient(90deg,var(--mint),#7fa2ff,#b79cff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lead{opacity:.78;line-height:1.8;margin:0 0 6px;max-width:720px}
  .steps{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 16px}
  .steps span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:#ffffff08}
  .occ{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
  .occ button{border:1px solid var(--line);background:transparent;color:#fff;border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;opacity:.8}
  .occ button.on{background:#ffffff1a;opacity:1;border-color:#ffffff55}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
  .card{background:linear-gradient(160deg,#ffffff10,#ffffff04);border:1px solid var(--line);border-radius:20px;overflow:hidden;cursor:pointer;transition:transform .25s,border-color .25s;text-align:start;color:#fff;padding:0;font:inherit}
  .card:hover{transform:translateY(-4px);border-color:#ffffff40}
  .card .th{aspect-ratio:1/1;background:#05040a center/cover no-repeat;display:block}
  .card .meta{padding:10px 12px 12px}
  .card b{font-size:15px}.card .o{font-size:11px;opacity:.65;margin-top:5px}
  #editor{display:none}
  .ed{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:20px;align-items:start;margin-top:16px}
  @media (max-width:780px){.ed{grid-template-columns:1fr}}
  .stage{position:sticky;top:12px;aspect-ratio:3/4;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:#05040a;box-shadow:0 20px 60px #0008}
  @media (max-width:780px){.stage{position:relative;top:0}}
  .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .panel{background:#ffffff0a;border:1px solid var(--line);border-radius:22px;padding:18px}
  .panel h2{margin:0 0 2px;font-size:22px}.panel .o{opacity:.6;font-size:13px;margin-bottom:4px}
  label{display:block;font-size:12px;opacity:.78;margin:14px 0 6px}
  input{width:100%;background:#00000055;border:1px solid #ffffff25;border-radius:12px;color:#fff;padding:11px 12px;font-size:16px;font-family:inherit}
  input:focus{outline:none;border-color:#7fa2ff}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#00000040;border:1px solid var(--line);border-radius:14px;padding:4px}
  .seg button{border:0;background:transparent;color:#fff;border-radius:10px;padding:9px 4px;font-size:13px;cursor:pointer;font-family:inherit}
  .seg button.on{background:linear-gradient(90deg,var(--blue),var(--pur))}
  .syms{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
  .syms button{font-size:22px;padding:6px 0;border-radius:12px;border:1px solid var(--line);background:#ffffff08;cursor:pointer}
  .syms button.on{border-color:#fff;background:#ffffff22}
  .mixline{font-size:12px;opacity:.75;line-height:1.9;background:#ffffff08;border:1px dashed #ffffff30;border-radius:12px;padding:8px 10px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chips button{border:1px solid #ffffff2a;background:#ffffff0a;color:#fff;border-radius:999px;padding:6px 11px;font-size:12px;cursor:pointer;font-family:inherit;text-align:start}
  .colors{display:flex;gap:10px;flex-wrap:wrap}
  .colors button{width:36px;height:36px;border-radius:50%;border:2px solid transparent;cursor:pointer;box-shadow:0 0 14px var(--c)}
  .colors button.on{border-color:#fff}
  .colors .def{width:auto;padding:0 12px;border-radius:999px;background:#ffffff12;color:#fff;font-size:12px;box-shadow:none;border:1px solid var(--line);font-family:inherit}
  .colors .def.on{border-color:#fff}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  .btn{padding:12px;border-radius:14px;border:1px solid var(--line);background:#ffffff10;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;text-decoration:none}
  .btn.p{background:linear-gradient(90deg,var(--blue),var(--pur));border:0}
  .btn.g{background:linear-gradient(90deg,var(--green),#13995f);border:0}
  .btn.q{background:linear-gradient(90deg,#b98a12,#f5c242);border:0;color:#1a1204}
  .btn.full{grid-column:1/-1}
  .note{font-size:12px;opacity:.6;line-height:1.8;margin-top:14px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(30px);background:#0F6B44;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:20}
  .toast.on{opacity:1;transform:translateX(-50%)}
  #qrModal{position:fixed;inset:0;background:#000c;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
  #qrModal .box{background:#0d0f18;border:1px solid var(--line);border-radius:22px;padding:16px;max-width:420px;width:100%;text-align:center;max-height:96vh;overflow:auto}
  #qrImg{width:100%;border-radius:16px;display:block;-webkit-touch-callout:default}
  #qrModal .tip{font-size:12px;opacity:.65;margin:10px 0 0;line-height:1.7}
  footer{text-align:center;opacity:.4;font-size:11px;letter-spacing:2px;margin-top:40px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="/"><img src="/assets/logo/eilan-icon.svg" alt=""><div><b>EILAN DOLL</b><small>THE DIGITAL WORLD</small></div></a>
    <a class="pill" href="/" id="toStore"></a>
  </header>

  <section id="gallery">
    <h1>🎁 <span id="title"></span></h1>
    <p class="lead" id="lead"></p>
    <div class="steps"><span id="s1"></span><span id="s2"></span><span id="s3"></span></div>
    <div class="occ" id="occ"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="editor">
    <button class="pill" id="backBtn"></button>
    <div class="ed">
      <div class="stage"><iframe id="prev" title="preview"></iframe></div>
      <div class="panel">
        <h2 id="dName"></h2><div class="o" id="dOcc"></div>
        <label id="lLang">🌍 لغة الهدية</label><div class="langs" id="langs" style="margin-top:0"></div>
        <label id="lFill"></label>
        <div class="seg" id="mode"><button data-m="w" id="mW"></button><button data-m="m" id="mM"></button><button data-m="s" id="mS"></button></div>
        <div id="boxW"><label id="lWord"></label><input id="fW" maxlength="16"></div>
        <div id="boxM" style="display:none"><label id="lMix"></label><div class="mixline" id="mixList"></div></div>
        <div id="boxS" style="display:none"><label>&nbsp;</label><div class="syms" id="syms"></div></div>
        <label id="lTo"></label><input id="fTo" maxlength="28">
        <label id="lMsg"></label><input id="fM" maxlength="70">
        <label id="lIdeas" style="opacity:.6"></label><div class="chips" id="ideas"></div>
        <label id="lFrom"></label><input id="fFrom" maxlength="24">
        <label id="lColor"></label><div class="colors" id="fC"></div>
        <div class="btns">
          <button class="btn p full" id="bPrev"></button>
          <button class="btn g" id="bCopy"></button>
          <button class="btn q" id="bQR"></button>
          <button class="btn" id="bShare"></button>
          <a class="btn" id="bOpen" target="_blank" rel="noopener"></a>
        </div>
        <p class="note" id="note"></p>
      </div>
    </div>
  </section>
  <footer>إيلان دول · EILAN DOLL</footer>
</div>
<div id="qrModal"><div class="box"><img id="qrImg" alt="QR"><p class="tip" id="qrTip"></p>
  <div class="btns"><a class="btn q" id="qrSave" download="eilan-gift-qr.png"></a><button class="btn" id="qrClose"></button></div></div></div>
<div class="toast" id="toast"></div>
<script src="i18n.js"></script>
<script src="engine.js"></script>
<script src="qr.js"></script>
<script>
(function(){
  const I=EilanI18N,G=EilanGift,D=G.DESIGNS,T=G.TINTS,$=id=>document.getElementById(id);
  let lang='ar';
  const qs=new URLSearchParams(location.search);if(I.ORDER.includes(qs.get('l')))lang=qs.get('l');
  let cur=null,color='',mode='w',sym=G.SYMBOLS[0],occF='all';
  const UI_L='ar',t=k=>I.t(k,UI_L),tg=k=>I.t(k,lang),nm=g=>I.NAMES[g][UI_L],occ=g=>D[g].occ.map(o=>I.OCC[o][UI_L]).join(' · ');

  /* ---------- language ---------- */
  $('langs').innerHTML=I.LANGS.map(([k,n])=>`<button data-l="${k}">${n}</button>`).join('');
  $('langs').onclick=e=>{const b=e.target.closest('button');if(!b)return;setLang(b.dataset.l);};
  function setLang(l){
    const oldWord=cur?I.WORDS[D[cur].wk][lang]:null;lang=l;
    [...$('langs').children].forEach(b=>b.classList.toggle('on',b.dataset.l===l));
    $('title').textContent=t('title');$('lead').textContent=t('lead');['s1','s2','s3'].forEach(k=>$(k).textContent=t(k));
    $('toStore').textContent='← '+t('store');$('backBtn').textContent='→ '+t('back');
    $('lFill').textContent=t('fill');$('mW').textContent=t('mWord');$('mM').textContent=t('mMix');$('mS').textContent=t('mSym');
    $('lWord').textContent=t('word');$('lMix').textContent=t('mixNote');$('lMsg').textContent=t('msg');$('lIdeas').textContent=t('ideas');
    $('lFrom').textContent=t('from');$('lColor').textContent=t('color');$('bPrev').textContent=t('preview');$('bCopy').textContent=t('copy');
    $('bQR').textContent=t('qr');$('bShare').textContent=t('share');$('bOpen').textContent=t('open');$('note').textContent=t('note');
    $('qrTip').textContent=t('saveTip');$('qrSave').textContent=t('save');$('qrClose').textContent=t('close');
    $('fC').querySelector('.def').textContent=t('orig');
    if(!$('grid').children.length){drawOcc();drawGrid();}
    if(cur){
      if(!$('fW').value||$('fW').value===oldWord)$('fW').value=I.WORDS[D[cur].wk][lang];
      if(D[cur].shape&&/^(نور|Noor)$/.test($('fTo').value))$('fTo').value=lang==='ar'?'نور':'Noor';drawIdeas();refresh();}
  }

  /* ---------- gallery ---------- */
  function drawOcc(){const keys=[...new Set(Object.values(D).flatMap(d=>d.occ))];
    $('occ').innerHTML=`<button data-o="all" class="${occF==='all'?'on':''}">✦ ${t('all')}</button>`+keys.map(k=>`<button data-o="${k}" class="${occF===k?'on':''}">${I.OCC[k][UI_L]}</button>`).join('');}
  $('occ').onclick=e=>{const b=e.target.closest('button');if(!b)return;occF=b.dataset.o;drawOcc();drawGrid();};
  function drawGrid(){$('grid').innerHTML=Object.keys(D).filter(g=>occF==='all'||D[g].occ.includes(occF)).map(g=>`<button class="card" data-g="${g}"><span class="th" style="background-image:url(thumbs/${g}.jpg)"></span><div class="meta"><b>${nm(g)}</b><div class="o">${occ(g)}</div></div></button>`).join('');}
  $('grid').onclick=e=>{const c=e.target.closest('.card');if(c)open(c.dataset.g,true);};

  /* ---------- editor ---------- */
  $('fC').innerHTML=`<button class="def" data-c=""></button>`+Object.keys(T).map(k=>`<button data-c="${k}" style="background:${T[k][0]};--c:${T[k][0]}88"></button>`).join('');
  $('fC').onclick=e=>{const b=e.target.closest('button');if(!b)return;color=b.dataset.c;markC();refresh();};
  const markC=()=>[...$('fC').children].forEach(b=>b.classList.toggle('on',b.dataset.c===color));
  $('syms').innerHTML=G.SYMBOLS.map(s=>`<button data-s="${s}">${s}</button>`).join('');
  $('syms').onclick=e=>{const b=e.target.closest('button');if(!b)return;sym=b.dataset.s;markS();refresh();};
  const markS=()=>[...$('syms').children].forEach(b=>b.classList.toggle('on',b.dataset.s===sym));
  $('mode').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;markM();refresh();};
  function markM(){[...$('mode').children].forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
    $('boxW').style.display=mode==='w'?'':'none';$('boxM').style.display=mode==='m'?'':'none';$('boxS').style.display=mode==='s'?'':'none';
    if(cur)$('mixList').textContent=I.ORDER.map(l=>I.WORDS[D[cur].wk][l]).join('  ·  ');}
  function drawIdeas(){$('ideas').innerHTML=I.phrases(D[cur].ph,lang).map(p=>`<button>${p}</button>`).join('');}
  $('ideas').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('fM').value=b.textContent;refresh();};

  function gift(){const o={g:cur,l:lang};const w=$('fW').value.trim(),to=$('fTo').value.trim(),m=$('fM').value.trim(),f=$('fFrom').value.trim();
    if(mode==='m')o.k='m';else if(mode==='s'){o.k='s';o.s=sym;}else if(w&&w!==I.WORDS[D[cur].wk][lang])o.w=w;
    if(to)o.to=to;if(m)o.m=m;if(f)o.f=f;if(color)o.c=color;return o;}
  const base=()=>location.origin+location.pathname.replace(/index\.html$/,'').replace(/\/?$/,'/');
  const link=()=>base()+'view.html?d='+G.encode(gift());
  function refresh(){$('prev').src='view.html?auto=1&d='+G.encode(gift());$('bOpen').href=link();}
  function open(g,push){
    cur=D[g]?g:'heart';const d=D[cur];
    $('dName').textContent=nm(cur);$('dOcc').textContent=occ(cur);
    $('fW').value=I.WORDS[d.wk][lang];$('lTo').textContent=d.shape?t('toName'):t('to');
    if(!$('fTo').value&&d.shape)$('fTo').value=lang==='ar'?'نور':'Noor';
    mode=d.shape?'s':'w';if(d.shape)sym='✨';color='';markC();markS();markM();drawIdeas();
    $('gallery').style.display='none';$('editor').style.display='block';scrollTo(0,0);
    if(push)history.pushState(null,'','?g='+cur);
    refresh();
  }
  function closeEd(){$('editor').style.display='none';$('gallery').style.display='block';$('prev').src='about:blank';cur=null;}
  $('backBtn').onclick=()=>{history.pushState(null,'',location.pathname);closeEd();};
  addEventListener('popstate',()=>{const g=new URLSearchParams(location.search).get('g');g?open(g,false):closeEd();});
  $('bPrev').onclick=refresh;
  ['fW','fTo','fM','fFrom'].forEach(id=>$(id).addEventListener('change',refresh));
  function toast(x){const e=$('toast');e.textContent=x;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200);}
  $('bCopy').onclick=()=>{const l=link();(navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).then(()=>toast(t('copied')),()=>prompt('',l));};
  $('bShare').onclick=()=>{const l=link();if(navigator.share)navigator.share({title:'🎁 '+tg('got'),url:l}).catch(()=>{});else $('bCopy').click();};

  /* ---------- QR card ---------- */
  $('bQR').onclick=()=>{
    const l=link(),q=EilanQR.make(l),W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
    const bg=x.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#0B1F5E');bg.addColorStop(.55,'#07080C');bg.addColorStop(1,'#251147');x.fillStyle=bg;x.fillRect(0,0,W,H);
    const font=s=>`800 ${s}px "Segoe UI",Tahoma,"PingFang SC","Hiragino Sans","Apple SD Gothic Neo","Noto Sans CJK SC",system-ui,sans-serif`;
    x.textAlign='center';x.fillStyle='#fff';x.font=font(64);x.direction=I.RTL(lang)?'rtl':'ltr';
    x.fillText('🎁 '+tg('got'),W/2,150);
    x.font=font(38);x.fillStyle='#D8FFE6';x.fillText(tg('scan'),W/2,215);
    const box=760,bx=(W-box)/2,by=280;x.fillStyle='#fff';
    x.beginPath();x.roundRect?x.roundRect(bx,by,box,box,48):x.rect(bx,by,box,box);x.fill();
    const px=Math.floor((box-80)/(q.size+8)),qs=px*(q.size+8),qx=bx+(box-qs)/2+px*4,qy=by+(box-qs)/2+px*4;
    EilanQR.draw(x,q,qx,qy,px,'#07080C');
    const fin=()=>{x.font=font(44);x.fillStyle='#fff';x.fillText(I.NAMES[cur][lang],W/2,by+box+95);
      const to=$('fTo').value.trim();if(to){x.font=font(36);x.fillStyle='#f5c242';x.fillText(to,W/2,by+box+150);}
      x.font=font(26);x.fillStyle='#ffffff88';x.direction='ltr';x.fillText('إيلان دول · EILAN DOLL',W/2,H-50);
      const url=c.toDataURL('image/png');$('qrImg').src=url;$('qrSave').href=url;$('qrModal').style.display='flex';};
    const im=new Image();im.onload=()=>{const s=150,cx=W/2-s/2,cy=by+box/2-s/2;x.save();x.beginPath();x.arc(W/2,by+box/2,s/2+10,0,7);x.fillStyle='#fff';x.fill();x.beginPath();x.arc(W/2,by+box/2,s/2,0,7);x.clip();x.drawImage(im,cx,cy,s,s);x.restore();fin();};
    im.onerror=fin;im.src='thumbs/'+cur+'.jpg';
  };
  $('qrClose').onclick=()=>$('qrModal').style.display='none';
  $('qrModal').onclick=e=>{if(e.target.id==='qrModal')$('qrModal').style.display='none';};

  setLang(lang);
  const g0=qs.get('g');if(g0)open(g0,false);
})();
</script>
</body>
</html>
