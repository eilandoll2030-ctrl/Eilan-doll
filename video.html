<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ورشة إيلان — فيديو إطلاق لمشروعك | إيلان دول</title>
<meta name="description" content="ورشة إيلان: فيديو إطلاق قصير لمشروعك (حوالي 40 ثانية) مبني من موقعك الحقيقي، بشخصيات لطيفة وموسيقى خاصة. تشوف المثال وتطلب فيديوك.">
<meta name="theme-color" content="#07080C">
<link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--night:#07080C;--blue:#1E44C8;--blue-d:#0B1F5E;--green:#0F6B44;--green-d:#07341F;--purple:#4A2A8F;--purple-d:#251147;--mint:#D8FFE6;--gold:#E2B450;--mu:#9FB3A8;--ui:'Tajawal',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--night);color:#EDEFF6;font-family:var(--ui);-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(7,8,12,.92);border-bottom:1px solid rgba(216,255,230,.08);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;min-width:0}
.brand img{width:32px;height:32px}
.brand b{display:block;font-size:15px}.brand small{display:block;font-size:11px;color:var(--mu)}
.sp{flex:1}
.ib{height:38px;padding:0 12px;border-radius:11px;display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(216,255,230,.16);background:rgba(15,18,30,.7);font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px}
.hero{display:flex;gap:18px;align-items:center;margin:6px 0 18px}
.cubes{display:grid;grid-template-columns:repeat(3,16px);gap:4px;flex:0 0 auto}
.cubes i{display:block;width:16px;height:16px;border-radius:4px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--gold);font-weight:700}
h1{font-family:'Reem Kufi',var(--ui);font-size:30px;line-height:1.25;margin:2px 0 4px}
.lead{color:#B9C7C0;font-size:15px;line-height:1.7}
.box{border-radius:18px;border:1px solid rgba(226,180,80,.45);background:linear-gradient(120deg,rgba(74,42,143,.3),rgba(11,31,94,.26) 55%,rgba(15,107,68,.2));padding:16px;margin-bottom:18px}
.box.cv{border-color:rgba(30,68,200,.5);background:rgba(11,31,94,.2)}
.box h2{font-family:'Reem Kufi',var(--ui);font-size:21px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;color:#412402;background:var(--gold);border-radius:999px;padding:2px 9px}
.box p.d{font-size:14px;color:#C2CEC8;line-height:1.7;margin-top:4px}
.vid{margin-top:12px;border-radius:14px;overflow:hidden;border:1px solid rgba(216,255,230,.14);background:#000}
.vid video{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#000}
.cap{font-size:12px;color:var(--mu);margin-top:6px}
.feat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
@media (max-width:760px){.feat{grid-template-columns:minmax(0,1fr)}}
.feat div{border-radius:14px;border:1px solid rgba(216,255,230,.14);background:rgba(7,8,12,.55);padding:12px}
.feat b{display:block;font-size:15px;margin-bottom:4px}.feat span{font-size:13px;color:#B9C7C0;line-height:1.6}
.steps{list-style:none;counter-reset:s;margin-top:10px;display:grid;gap:8px}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;font-size:14px;color:#C9D6CF;line-height:1.6}
.steps li::before{content:counter(s);flex:0 0 26px;height:26px;border-radius:8px;background:var(--purple);color:var(--mint);display:grid;place-items:center;font-weight:700;font-size:13px}
.fit{margin-top:10px;font-size:13px;color:#C9D6CF;line-height:1.8}
.fit b{color:var(--mint)}
form{margin-top:8px}
label.f{display:block;font-size:13px;color:#B9C7C0;margin:10px 0 4px}
label.f em{font-style:normal;color:var(--gold)}
input[type=text],input[type=email],input[type=url],input[type=tel],textarea{width:100%;height:42px;border-radius:10px;border:1px solid rgba(216,255,230,.18);background:rgba(7,8,12,.6);padding:0 10px;font-size:16px}
textarea{height:80px;padding:8px 10px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:600px){.row2{grid-template-columns:minmax(0,1fr)}}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid rgba(216,255,230,.25);background:transparent;border-radius:10px;padding:8px 12px;font-size:14px}
.seg button.on{border-color:var(--gold);color:var(--gold);font-weight:700}
.btn{height:48px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;padding:0 18px;font-weight:700;font-size:16px;width:100%;margin-top:16px}
.btn[disabled]{opacity:.6}
.err{color:#F09595;font-size:13px;min-height:18px;margin-top:6px}
.ok{display:none;margin-top:12px;border-radius:14px;border:1px solid rgba(216,255,230,.35);background:rgba(15,107,68,.25);padding:14px;font-size:15px;line-height:1.7}
.ok.show{display:block}
.price{font-weight:900;font-size:15px;color:var(--gold)}
.note{font-size:12px;color:var(--mu);line-height:1.7;margin-top:10px}
</style>
</head>
<body>
<header class="top">
 <a class="brand" href="/"><img src="/assets/logo/eilan-icon.svg" alt=""><span><b data-t="إيلان دول|EILAN DOLL"></b><small data-t="ورشة إيلان|Eilan Workshop"></small></span></a>
 <span class="sp"></span>
 <button class="ib" id="langBtn" type="button">EN</button>
 <a class="ib" href="/templates" data-t="القوالب|Templates"></a>
 <a class="ib" href="/" data-t="الرئيسية|Home"></a>
</header>

<main class="wrap">
 <section class="hero">
  <div class="cubes" aria-hidden="true"><i style="background:#0F6B44"></i><i style="background:#1E44C8"></i><i style="background:#E2B450;transform:translateY(-7px)"></i><i style="background:#4A2A8F"></i><i style="background:#07341F"></i><i style="background:#0B1F5E"></i></div>
  <div>
   <div class="eyebrow">EILAN WORKSHOP · LAUNCH VIDEO</div>
   <h1 data-t="فيديو إطلاق لمشروعك|A launch video for your project"></h1>
   <p class="lead" data-t="فيديو قصير (حوالي 40 ثانية) يشرح مشروعك بطريقة مرحة: شخصيات لطيفة تبني إعلانك قدّام المشاهد، بصور حقيقية من موقعك وموسيقى خاصة فيه.|A short (about 40 seconds) fun video that explains your project: cute characters build your promo on screen, using real screenshots from your site and its own music."></p>
  </div>
 </section>

 <section class="box" aria-labelledby="sT">
  <h2 id="sT"><span data-t="شوف المثال: فيديو إيلان دول|See the sample: the Eilan Doll video"></span><span class="badge" data-t="مثال حقيقي|Real sample"></span></h2>
  <p class="d" data-t="هذا الفيديو انصنع لإيلان دول نفسها. فيديوك يطلع بنفس الفكرة، بس بمشروعك وصوره وألوانه.|This video was made for Eilan Doll itself. Yours follows the same idea, with your project, its screenshots and colours."></p>
  <div class="vid"><video controls playsinline preload="metadata" poster="/studio/sample-poster.jpg"><source src="/studio/sample-eilan.mp4" type="video/mp4"></video></div>
  <p class="cap" data-t="المثال بالإنجليزي، والشخصيات هنا بشكل دمى القماش.|The sample is in English, with the felt-plush characters."></p>
  <div class="feat">
   <div><b data-t="من موقعك الحقيقي|From your real site"></b><span data-t="نقرأ موقعك ونأخذ منه الصور والكلام، وكل معلومة في الفيديو موجودة في موقعك.|We read your site and use its screenshots and words; every claim in the video is on your site."></span></div>
   <div><b data-t="٣ نسخ|3 versions"></b><span data-t="نسخة عرضية 4K، ونسخة 1080p أخف، ونسخة طولية لإنستقرام وتيك توك.|A 4K landscape version, a lighter 1080p one, and a vertical one for Instagram and TikTok."></span></div>
   <div><b data-t="موسيقى خاصة|Its own music"></b><span data-t="موسيقى ومؤثرات صوتية مصنوعة للفيديو نفسه.|Music and sound effects made for the video itself."></span></div>
  </div>
 </section>

 <section class="box cv" aria-labelledby="hT">
  <h2 id="hT" data-t="كيف يمشي الطلب؟|How ordering works"></h2>
  <ol class="steps">
   <li data-t="تعبّي النموذج تحت: رابط موقعك واسم مشروعك.|Fill in the form below: your site link and project name."></li>
   <li data-t="يوصلنا طلبك، ونرد عليك بالإيميل بالتفاصيل والسعر.|We receive your order and reply by email with the details and price."></li>
   <li data-t="نصنع الفيديو ونراجعه، وبعدها نرسل لك النسخ الثلاث.|We make and review the video, then send you the three versions."></li>
  </ol>
  <p class="fit"><b data-t="يناسب:|Good for:"></b> <span data-t="أي مشروع عنده موقع أو متجر إلكتروني (تطبيق، متجر، خدمة، منصة).|Any project with a website or online store (app, shop, service, platform)."></span><br>
  <b data-t="ما يناسب:|Not for:"></b> <span data-t="الحسابات اللي ما لها موقع، الفيديو بصوت معلّق أو بالعربي (الكتابة داخل الفيديو بالإنجليزي)، أو شخصيات مشروعك الخاصة.|Accounts without a website, voice-over or Arabic text (on-screen text is in English), or your own mascot characters."></span></p>
  <p class="note"><span class="price" data-t="السعر: يوصلك بالإيميل مع الرد|Price: sent to you by email with our reply"></span></p>
 </section>

 <section class="box" aria-labelledby="oT" id="order">
  <h2 id="oT" data-t="اطلب فيديوك|Order your video"></h2>
  <form id="f" novalidate>
   <div class="row2">
    <div><label class="f" for="name"><span data-t="اسمك|Your name"></span> <em>*</em></label><input type="text" id="name" autocomplete="name" maxlength="120"></div>
    <div><label class="f" for="project"><span data-t="اسم المشروع|Project name"></span> <em>*</em></label><input type="text" id="project" maxlength="120"></div>
   </div>
   <label class="f" for="url"><span data-t="رابط موقعك أو متجرك|Your website or store link"></span> <em>*</em></label>
   <input type="url" id="url" inputmode="url" placeholder="https://" maxlength="300" dir="ltr">
   <div class="row2">
    <div><label class="f" for="email"><span data-t="إيميلك (نرد عليك فيه)|Your email (we reply here)"></span> <em>*</em></label><input type="email" id="email" autocomplete="email" maxlength="160" dir="ltr"></div>
    <div><label class="f" for="whatsapp" data-t="واتساب (اختياري)|WhatsApp (optional)"></label><input type="tel" id="whatsapp" autocomplete="tel" maxlength="40" dir="ltr"></div>
   </div>
   <label class="f" data-t="شكل الشخصيات|Character style"></label>
   <div class="seg" id="style">
    <button type="button" data-v="felt" class="on" data-t="دمى قماش|Felt plush"></button>
    <button type="button" data-v="bots" data-t="روبوتات|Bots"></button>
    <button type="button" data-v="faces" data-t="أشكال بوجوه|Shapes with faces"></button>
   </div>
   <label class="f" for="colors" data-t="ألوان مشروعك (اختياري)|Your brand colours (optional)"></label>
   <input type="text" id="colors" maxlength="200">
   <label class="f" for="notes" data-t="وش أهم شي تبي الفيديو يقوله؟ (اختياري)|What should the video say most? (optional)"></label>
   <textarea id="notes" maxlength="1000"></textarea>
   <button class="btn" type="submit" id="send" data-t="أرسل الطلب|Send order"></button>
   <p class="err" id="err" role="alert"></p>
  </form>
  <div class="ok" id="ok" role="status"></div>
  <p class="note" data-t="نستخدم بياناتك للرد على طلبك فقط. إرسال الطلب ما يعني دفع، والسعر يوصلك قبل أي شي.|We use your details only to reply to your order. Sending the order is not a payment; you get the price first."></p>
 </section>
</main>

<script>
var qs=new URLSearchParams(location.search);
var EN=qs.get('lang')==='en';
function T(s){var p=String(s).split('|');return EN&&p[1]!==undefined?p[1]:p[0]}
var $=function(id){return document.getElementById(id)};
var PH={name:['مثال: سارة|e.g. Sara'],project:['مثال: متجر ورد|e.g. Bloom Shop'],colors:['مثال: أخضر غامق وذهبي|e.g. dark green and gold'],notes:['مثال: نبي الناس تعرف إن التوصيل مجاني|e.g. we want people to know delivery is free']};
function applyLang(){
 document.documentElement.lang=EN?'en':'ar';document.documentElement.dir=EN?'ltr':'rtl';
 document.querySelectorAll('[data-t]').forEach(function(e){e.textContent=T(e.getAttribute('data-t'))});
 Object.keys(PH).forEach(function(k){$(k).placeholder=T(PH[k][0])});
 $('langBtn').textContent=EN?'عربي':'EN';
}
$('langBtn').onclick=function(){EN=!EN;var u=new URL(location.href);if(EN)u.searchParams.set('lang','en');else u.searchParams.delete('lang');history.replaceState(null,'',u);applyLang()};
var style='felt';
document.querySelectorAll('#style button').forEach(function(b){b.onclick=function(){style=b.getAttribute('data-v');document.querySelectorAll('#style button').forEach(function(x){x.classList.toggle('on',x===b)})}});
function orderId(){var d=new Date(),p=function(n){return String(n).padStart(2,'0')};return 'V'+String(d.getFullYear()).slice(2)+p(d.getMonth()+1)+p(d.getDate())+'-'+Math.random().toString(36).slice(2,6).toUpperCase()}
$('f').onsubmit=function(e){
 e.preventDefault();
 var v=function(id){return $(id).value.trim()};
 var url=v('url');if(url&&!/^https?:\/\//i.test(url))url='https://'+url;
 if(!v('name')||!v('project')||!url||!v('email')){$('err').textContent=T('عبّي الخانات اللي عليها *|Please fill in the fields marked *');return}
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v('email'))){$('err').textContent=T('الإيميل مو صحيح|That email does not look right');return}
 try{new URL(url)}catch(x){$('err').textContent=T('الرابط مو صحيح|That link does not look right');return}
 $('err').textContent='';$('send').disabled=true;$('send').textContent=T('جاري الإرسال…|Sending…');
 var id=orderId();
 fetch('/api/video-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order:id,name:v('name'),project:v('project'),url:url,email:v('email'),whatsapp:v('whatsapp'),style:style,colors:v('colors'),notes:v('notes')})})
 .then(function(r){return r.json().catch(function(){return{}}).then(function(j){return r.ok&&j.ok})})
 .then(function(ok){
  if(!ok)throw 0;
  $('f').style.display='none';
  $('ok').innerHTML='';var a=document.createElement('div');a.textContent=T('وصلنا طلبك ✨ بنرد عليك على إيميلك بالتفاصيل والسعر.|We got your order ✨ We will email you the details and price.');var c=document.createElement('div');c.style.marginTop='6px';c.appendChild(document.createTextNode(T('رقم الطلب: |Order number: ')));var bd=document.createElement('bdi');bd.style.fontWeight='700';bd.textContent=id;c.appendChild(bd);$('ok').appendChild(a);$('ok').appendChild(c);
  $('ok').classList.add('show');
 })
 .catch(function(){$('err').textContent=T('ما قدرنا نرسل الطلب الحين، جرّب بعد شوي.|We could not send the order right now. Please try again shortly.');$('send').disabled=false;$('send').textContent=T('أرسل الطلب|Send order')});
};
applyLang();
</script>
</body>
</html>
