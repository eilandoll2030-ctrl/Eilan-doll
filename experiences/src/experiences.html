.xpr-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.xpr-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:800;background:rgba(239,233,218,.06);border:1px solid rgba(224,180,84,.28);color:#EFE9DA}

.xpr-pill.grn{background:rgba(62,122,85,.2);border-color:rgba(127,170,138,.45);color:#CFE4D4}

.xpr-flow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.xpr-step{padding:14px 16px;border-radius:16px;background:#151711;border:1px solid var(--bd);display:flex;align-items:flex-start;gap:12px}

.xpr-step b{display:block;font-size:13.5px;margin-bottom:3px;color:#EFE9DA}
.xpr-step span{font-size:12.5px;color:var(--mu);line-height:1.55;display:block}

.xpr-ownbar{padding:14px 16px;border-radius:16px;background:rgba(224,180,84,.1);border:1px dashed rgba(224,180,84,.5);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

.xpr-ownbar small{display:block;color:var(--mu);font-size:12px;margin-top:2px}

/* Studio Workspace: Side-by-side on iPad Landscape & Desktop */
.xpr-work{display:grid;grid-template-columns:minmax(320px,1.02fr) minmax(320px,1fr);gap:18px;align-items:start}

.xpr-stabs{display:flex;gap:6px;flex-wrap:wrap}
.xpr-stab{padding:7px 12px;border-radius:10px;border:1px solid var(--bd);background:#171912;color:var(--mu);font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;transition:.2s}
.xpr-stab.on{background:rgba(224,180,84,.18);border-color:#E0B454;color:#F3D486}

.xpr-frame[data-th="royal"]{--xbg:#080F26;--xbg2:#0B1F5E;--xcard:rgba(11,28,78,.88);--xacc:#E2B450;--xacc2:#F6DD8F;--xtxt:#F2F5FF;--xmu:rgba(230,238,255,.76);--xbd:rgba(30,68,200,.52);--xsub:#1E44C8;background:radial-gradient(circle at 50% 20%,rgba(226,180,80,.17),transparent 54%),radial-gradient(circle at 20% 82%,rgba(30,68,200,.32),transparent 55%),linear-gradient(180deg,#0E1E52,#070A16);color:#F2F5FF}
.xpr-frame[data-th="velvet"]{--xbg:#0B0714;--xbg2:#1B0F33;--xcard:rgba(28,16,52,.9);--xacc:#E2B450;--xacc2:#F6DD8F;--xtxt:#F5F2FA;--xmu:rgba(245,242,250,.74);--xbd:rgba(74,42,143,.52);--xsub:#4A2A8F;background:radial-gradient(circle at 50% 22%,rgba(226,180,80,.16),transparent 54%),radial-gradient(circle at 82% 82%,rgba(74,42,143,.32),transparent 54%),linear-gradient(180deg,#1A0F30,#07080C);color:#F5F2FA}

.xpr-top{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:2}

.xpr-hook{font-size:20px;font-weight:900;line-height:1.45;color:var(--xtxt);margin:0}
.xpr-subhint{font-size:13px;color:var(--xmu);margin:0}

/* 3x3 Sunrise Cube Interactive Emblem */
.xpr-cube-btn{position:relative;width:176px;height:176px;border:0;background:transparent;cursor:pointer;padding:0;display:grid;place-items:center;touch-action:manipulation;transition:transform .28s cubic-bezier(.2,.9,.3,1.2)}
.xpr-cube-btn:hover{transform:scale(1.04)}
.xpr-cube-btn:active{transform:scale(.95)}
.xpr-cube-halo{position:absolute;inset:8px;border-radius:36px;background:radial-gradient(circle,rgba(224,180,84,.34),transparent 68%);animation:xprPulse 3.2s ease-in-out infinite;pointer-events:none}
.xpr-cube-svg{width:156px;height:156px;position:relative;z-index:2;filter:drop-shadow(0 14px 28px rgba(0,0,0,.38))}
.xpr-cube-svg .xg-gold{transform-origin:50px 11px;animation:xprFloat 2.8s ease-in-out infinite}
.xpr-cube-svg .xg-c{transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s}
.xpr-cube-btn.burst .xg-gold{animation:xprBurst .65s ease forwards}
@keyframes xprFloat{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(3px,-6px) rotate(3deg)}}
@keyframes xprPulse{0%,100%{transform:scale(.94);opacity:.65}50%{transform:scale(1.08);opacity:1}}
@keyframes xprBurst{0%{transform:scale(1)}45%{transform:translate(6px,-14px) scale(1.22) rotate(8deg)}100%{transform:translate(0,-4px) scale(1.05)}}

.xpr-tap-cta{padding:11px 22px;border-radius:999px;border:1px solid var(--xacc);background:rgba(224,180,84,.16);color:var(--xtxt);font-family:inherit;font-size:14px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:.22s}
.xpr-tap-cta:hover{background:var(--xacc);color:#14150F}

/* Stage 1 & Stage 2 Cards */
.xpr-mcard{width:100%;padding:22px 20px;border-radius:20px;background:var(--xcard);border:1px solid var(--xbd);box-shadow:0 16px 38px rgba(0,0,0,.26);animation:xprIn .42s cubic-bezier(.2,.8,.2,1)}

.xpr-gift-lbl{font-size:12px;font-weight:800;color:var(--xacc);letter-spacing:1px;margin-bottom:6px}
.xpr-gift-val{font-size:24px;font-weight:900;line-height:1.4;color:var(--xtxt);margin:0 0 8px;word-break:break-word}
.xpr-gift-sub{font-size:14px;line-height:1.65;color:var(--xmu);margin:0 0 14px;white-space:pre-line}
.xpr-from{display:inline-block;padding:6px 14px;border-radius:999px;background:rgba(224,180,84,.14);border:1px solid var(--xbd);font-size:13px;font-weight:800;color:var(--xtxt)}
.xpr-extlink{margin-top:12px;display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:12px;background:var(--xacc);color:#14150F;font-weight:900;font-size:13.5px;text-decoration:none}

/* Calm Floating Golden Sparks */
.xpr-sparks{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.xpr-sparks i{position:absolute;bottom:-12px;width:6px;height:6px;border-radius:2px;background:#E8B64A;opacity:0;animation:xprSpark 5.2s ease-in-out infinite}

.xpr-tcard-auto{position:absolute;bottom:10px;inset-inline-end:10px;padding:4px 9px;border-radius:999px;font-size:10.5px;font-weight:800;background:rgba(14,17,13,.82);border:1px solid rgba(127,170,138,.45);color:#CFE4D4}

  .xpr-work{grid-template-columns:1fr}
  .xpr-stage-col{position:static}
  .xpr-flow{grid-template-columns:1fr}
}

  .xpr-frame{min-height:460px;padding:20px 16px 16px}
  .xpr-swatches{grid-template-columns:repeat(2,1fr)}
  .xpr-grid2,.xpr-acts-grid{grid-template-columns:1fr}
}

/* Procedural Original WebAudio Chimes (Zero external/copyrighted audio) */
let _xprAC = null;
function xprPlayChime(kind='warm', step=1){
  if(!kind || kind==='mute') return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!_xprAC) _xprAC = new AC();
    if(_xprAC.state === 'suspended') _xprAC.resume();
    const now = _xprAC.currentTime;
    const notes = kind==='calm'
      ? (step>=2 ? [293.66, 369.99, 440.00, 587.33] : [293.66, 440.00])
      : kind==='joy'
      ? (step>=2 ? [392.00, 493.88, 587.33, 783.99] : [392.00, 587.33])
      : (step>=2 ? [329.63, 415.30, 493.88, 659.25] : [329.63, 493.88, 659.25]);
    notes.forEach((freq, idx)=>{
      const osc = _xprAC.createOscillator();
      const gain = _xprAC.createGain();
      osc.type = kind==='calm' ? 'sine' : 'triangle';
      osc.frequency.setValueAtTime(freq, now + idx * 0.085);
      gain.gain.setValueAtTime(0.0001, now + idx * 0.085);
      gain.gain.exponentialRampToValueAtTime(0.085 / (1 + idx*0.2), now + idx * 0.085 + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.085 + (step>=2 ? 1.05 : 0.65));
      osc.connect(gain);
      gain.connect(_xprAC.destination);
      osc.start(now + idx * 0.085);
      osc.stop(now + idx * 0.085 + 1.15);
    });
  }catch(e){}
}

/* URL-safe UTF-8 Base64 Compact Encoder & Decoder for Instant Serverless Delivery */
function xprEncodeData(D){
  const p = XPR_CUBE_PRESETS[D.p] ? D.p : 'eid';
  const lg = D.lg === 'en' ? 'en' : 'ar';
  const def = XPR_CUBE_PRESETS[p][lg];
  const o = { p };
  if(D.th && D.th !== 'gold') o.th = D.th;
  if(lg !== 'ar') o.lg = lg;
  if(D.sn && D.sn !== 'warm') o.sn = D.sn;
  if(D.to !== def.to) o.to = String(D.to||'').slice(0,80);
  if(D.hk !== def.hook) o.hk = String(D.hk||'').slice(0,140);
  if(D.ms !== def.msg) o.ms = String(D.ms||'').slice(0,420);
  if(D.gf !== def.gift) o.gf = String(D.gf||'').slice(0,140);
  if(D.sb !== def.sub) o.sb = String(D.sb||'').slice(0,220);
  if(D.fr !== def.fr) o.fr = String(D.fr||'').slice(0,80);
  if(D.lk && /^https:\/\/\S+/i.test(D.lk.trim())) o.lk = D.lk.trim().slice(0,220);
  const bytes = new TextEncoder().encode(JSON.stringify(o));
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

function xprDecodeData(tok){
  try{
    const b64 = String(tok||'').replace(/-/g,'+').replace(/_/g,'/');
    const pad = b64 + '==='.slice((b64.length + 3) % 4);
    const bin = atob(pad);
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    const o = JSON.parse(new TextDecoder().decode(bytes));
    const p = XPR_CUBE_PRESETS[o.p] ? o.p : 'eid';
    const lg = o.lg === 'en' ? 'en' : 'ar';
    const def = XPR_CUBE_PRESETS[p][lg];
    const lk = (typeof o.lk==='string' && /^https:\/\/\S+/i.test(o.lk.trim())) ? o.lk.trim() : '';
    return {
      p,
      th: XPR_THEMES[o.th] ? o.th : 'gold',
      lg,
      sn: XPR_SOUNDS[o.sn] ? o.sn : 'warm',
      to: typeof o.to==='string' ? o.to : def.to,
      hk: typeof o.hk==='string' ? o.hk : def.hook,
      ms: typeof o.ms==='string' ? o.ms : def.msg,
      gf: typeof o.gf==='string' ? o.gf : def.gift,
      sb: typeof o.sb==='string' ? o.sb : def.sub,
      fr: typeof o.fr==='string' ? o.fr : def.fr,
      lk
    };
  }catch(e){ return null; }
}

/* Pure Vanilla-JS ISO/IEC 18004 QR Matrix Generator (Versions 1..20, ECC-L, Byte Mode) */
function xprMakeQR(str){
  const data = Array.from(new TextEncoder().encode(str));
  const V_CAP = [0,19,34,55,80,108,136,156,194,232,274,324,370,428,461,523,589,647,721,795,861];
  const V_BLK = [null,
    [7,1,19,0,0],[10,1,34,0,0],[15,1,55,0,0],[20,1,80,0,0],[26,1,108,0,0],
    [18,2,68,0,0],[20,2,78,0,0],[24,2,97,0,0],[30,2,116,0,0],[18,2,68,2,69],
    [20,4,81,0,0],[24,2,92,2,93],[26,4,107,0,0],[30,3,115,1,116],[22,5,87,1,88],
    [24,5,98,1,99],[28,1,107,5,108],[30,5,120,1,121],[28,3,113,4,114],[28,3,107,5,108]
  ];
  const ALIGN = [null,[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50],
    [6,30,54],[6,32,58],[6,34,62],[6,26,46,66],[6,26,48,70],[6,26,50,74],[6,30,54,78],[6,30,56,82],[6,30,58,86],[6,34,62,90]];
  let ver = 1;
  while(ver <= 20){
    const lb = ver < 10 ? 8 : 16;
    if(4 + lb + data.length * 8 <= V_CAP[ver] * 8) break;
    ver++;
  }
  if(ver > 20) return null;
  const bits = [];
  const pushB = (v,n)=>{ for(let i=n-1;i>=0;i--) bits.push((v>>>i)&1); };
  pushB(0b0100, 4);
  pushB(data.length, ver < 10 ? 8 : 16);
  for(const b of data) pushB(b, 8);
  const maxB = V_CAP[ver] * 8;
  for(let i=0;i<4 && bits.length<maxB;i++) bits.push(0);
  while(bits.length % 8 !== 0) bits.push(0);
  const cw = [];
  for(let i=0;i<bits.length;i+=8){
    let b=0; for(let j=0;j<8;j++) b=(b<<1)|bits[i+j];
    cw.push(b);
  }
  let pad = 0xEC;
  while(cw.length < V_CAP[ver]){ cw.push(pad); pad = pad===0xEC ? 0x11 : 0xEC; }
  const EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  let x = 1;
  for(let i=0;i<255;i++){ EXP[i]=x; LOG[x]=i; x=(x<<1)^(x&0x80?0x11d:0); }
  for(let i=255;i<512;i++) EXP[i]=EXP[i-255];
  const mul = (a,b)=>(a&&b)?EXP[LOG[a]+LOG[b]]:0;
  const rsEnc = (msg, ecLen)=>{
    let g = [1];
    for(let i=0;i<ecLen;i++){
      const ng = new Array(g.length+1).fill(0);
      for(let j=0;j<g.length;j++){ ng[j]^=g[j]; ng[j+1]^=mul(g[j],EXP[i]); }
      g = ng;
    }
    const rem = new Array(ecLen).fill(0);
    for(const b of msg){
      const f = b ^ rem.shift(); rem.push(0);
      for(let j=0;j<ecLen;j++) rem[j] ^= mul(g[j+1], f);
    }
    return rem;
  };
  const [ecLen, g1b, g1c, g2b, g2c] = V_BLK[ver];
  const dB=[], eB=[]; let pos=0;
  for(let i=0;i<g1b;i++){ const blk=cw.slice(pos,pos+g1c); pos+=g1c; dB.push(blk); eB.push(rsEnc(blk,ecLen)); }
  for(let i=0;i<g2b;i++){ const blk=cw.slice(pos,pos+g2c); pos+=g2c; dB.push(blk); eB.push(rsEnc(blk,ecLen)); }
  const out=[]; const maxD=Math.max(g1c,g2c);
  for(let i=0;i<maxD;i++) for(const b of dB) if(i<b.length) out.push(b[i]);
  for(let i=0;i<ecLen;i++) for(const b of eB) out.push(b[i]);

  const N = ver*4 + 17;
  const M = Array.from({length:N}, ()=>new Array(N).fill(0));
  const R = Array.from({length:N}, ()=>new Uint8Array(N));
  const setF = (r,c,v)=>{ if(r>=0&&r<N&&c>=0&&c<N){ M[r][c]=v?1:0; R[r][c]=1; } };
  const finder = (r0,c0)=>{
    for(let r=-1;r<=7;r++) for(let c=-1;c<=7;c++){
      const on = (r>=0&&r<=6&&(c===0||c===6))||(c>=0&&c<=6&&(r===0||r===6))||(r>=2&&r<=4&&c>=2&&c<=4);
      setF(r0+r, c0+c, on);
    }
  };
  finder(0,0); finder(0,N-7); finder(N-7,0);
  for(let i=8;i<N-8;i++){ setF(6,i,i%2===0); setF(i,6,i%2===0); }
  for(const r of ALIGN[ver]) for(const c of ALIGN[ver]){
    if(R[r][c]) continue;
    for(let dr=-2;dr<=2;dr++) for(let dc=-2;dc<=2;dc++) setF(r+dr,c+dc,Math.max(Math.abs(dr),Math.abs(dc))!==1);
  }
  setF(N-8, 8, 1);
  for(let i=0;i<9;i++){ if(!R[8][i]) R[8][i]=1; if(!R[i][8]) R[i][8]=1; }
  for(let i=0;i<8;i++){ R[8][N-1-i]=1; R[N-1-i][8]=1; }
  if(ver >= 7){
    let rem = ver;
    for(let i=0;i<12;i++) rem = (rem<<1)^((rem>>>11)*0x1F25);
    const vI = (ver<<12)|rem;
    for(let i=0;i<18;i++){ const bit=(vI>>>i)&1, a=N-11+(i%3), b=Math.floor(i/3); setF(b,a,bit); setF(a,b,bit); }
  }
  const fBits=[];
  for(const b of out) for(let i=7;i>=0;i--) fBits.push((b>>>i)&1);
  let bi=0, up=true;
  for(let c=N-1;c>=1;c-=2){
    if(c===6) c--;
    for(let k=0;k<N;k++){
      const r = up ? N-1-k : k;
      for(let dc=0;dc<2;dc++){
        const cc = c-dc;
        if(!R[r][cc]){
          let bit = bi<fBits.length ? fBits[bi++] : 0;
          if((r+cc)%2===0) bit ^= 1;
          M[r][cc] = bit;
        }
      }
    }
    up = !up;
  }
  const fmt = 0x77C4;
  const fP = [[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],[7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]];
  for(let i=0;i<15;i++){
    const bit = (fmt>>>i)&1;
    const [r,c] = fP[14-i];
    M[r][c] = bit;
    if(i>=8) M[N-1-(14-i)][8] = bit;
    else M[8][N-1-i] = bit;
  }
  return M;
}

/* Activate Salla Code (Client-Side SHA-256 — Zero Owner Intervention Needed) */
async function xprVerifyCode(ev){
  ev.preventDefault();
  const f = ev.target;
  const msg = $('#xprCodeMsg');
  const raw = String(f.code.value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  let key = 'cube', body = raw;
  if(raw.startsWith('EXPB')){ key = 'bundle'; }
  else if(raw.startsWith('CUB1')){ key = 'cube'; }
  else { body = 'CUB1' + raw; }

  if(body.length < 15){
    msg.className = 'lh-msg bad';
    msg.textContent = gzL('الكود ناقص — الصيغة الصحيحة: CUB1-XXXX-XXXX-XXXX','Code incomplete — expected CUB1-XXXX-XXXX-XXXX');
    return;
  }
  const dg = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('eilan-arc-v1:' + body)));
  const hx = Array.from(dg, b => b.toString(16).padStart(2,'0')).join('').slice(0, 24);
  const validCube = Array.isArray(XPR_CODES.cube) && XPR_CODES.cube.includes(hx);
  const validBundle = Array.isArray(XPR_CODES.bundle) && XPR_CODES.bundle.includes(hx);

  if(!validCube && !validBundle){
    msg.className = 'lh-msg bad';
    msg.textContent = '❌ ' + gzL('الكود غير صحيح — تأكد من نسخه كما وصلك من سلة','Invalid activation code');
    return;
  }
  S.unlk = S.unlk || {};
  if(validBundle) S.unlk.x_bundle = 1;
  else S.unlk.x_cube = 1;
  S.owned = S.owned || {};
  S.owned['x-cube'] = Date.now();
  XPR_STATE.previewSimVisitor = false;
  save();
  xprPlayChime('joy', 2);
  toast('🎉 ' + gzL('تم التفعيل فوراً! رابطك وبطاقتك جاهزة للاستلام الآن','Unlocked! Your link & QR card are ready now'));
  xprRefreshStudio();
}

/* Fullscreen Recipient Overlay (Used both when recipient opens WhatsApp link AND when sender tests fullscreen) */
function xprOpenFullscreen(D, isRecipientLink=false){
  let ov = $('#xprFullOverlay');
  if(ov) ov.remove();
  ov = document.createElement('div');
  ov.id = 'xprFullOverlay';
  ov.className = 'xpr-full no-ei';
  let st = 0;
  const localD = {...D};

  const paint = ()=>{
    ov.innerHTML = `
      ${isRecipientLink
        ? `<a class="xpr-full-close" href="/?explore=experiences">✦ ${localD.lg==='en'?'Made with Eilan Doll · Create Yours':'صُنع في إيلان دول · اصنع مفاجأتك'}</a>`
        : `<button type="button" class="xpr-full-close" data-xclose="1">✕ ${gzL('إغلاق المعاينة والعودة','Close Preview')}</button>`}
      ${xprRenderFrameHTML(localD, st, {preview:false, recipient:isRecipientLink})}
    `;
  };
  ov.addEventListener('click', ev=>{
    if(ev.target.closest('[data-xclose]')){ ov.remove(); return; }
    const actEl = ev.target.closest('[data-xact]');
    if(!actEl) return;
    const act = actEl.dataset.xact;
    if(act === 'nextstage'){
      const btn = ov.querySelector('.xpr-cube-btn');
      if(btn && st===0){ btn.classList.add('burst'); }
      st = Math.min(2, st + 1);
      xprPlayChime(localD.sn, st);
      setTimeout(paint, st===1 ? 180 : 40);
    } else if(act === 'replay'){
      st = 0;
      xprPlayChime(localD.sn, 1);
      paint();
    } else if(act === 'togglesnd'){
      localD.sn = localD.sn === 'mute' ? 'warm' : 'mute';
      paint();
    }
  });
  document.body.appendChild(ov);
  paint();
}

function xprBindStudioEvents(container){
  if(!container || container._xprBound) return;
  container._xprBound = true;

  container.addEventListener('click', async ev=>{
    // Stage interactions inside live preview
    const xact = ev.target.closest('[data-xact]');
    if(xact){
      const a = xact.dataset.xact;
      if(a === 'nextstage'){
        const btn = container.querySelector('.xpr-cube-btn');
        if(btn && XPR_STATE.stage===0) btn.classList.add('burst');
        XPR_STATE.stage = Math.min(2, XPR_STATE.stage + 1);
        xprPlayChime(XPR_STATE.D.sn, XPR_STATE.stage);
        setTimeout(xprRefreshStageOnly, XPR_STATE.stage===1 ? 170 : 30);
      } else if(a === 'replay'){
        XPR_STATE.stage = 0;
        xprPlayChime(XPR_STATE.D.sn, 1);
        xprRefreshStageOnly();
      } else if(a === 'togglesnd'){
        XPR_STATE.D.sn = XPR_STATE.D.sn === 'mute' ? 'warm' : 'mute';
        xprRefreshStudio();
      }
      return;
    }

    const ui = ev.target.closest('[data-xui]');
    if(!ui) return;
    const cmd = ui.dataset.xui;
    if(cmd === 'stage'){
      XPR_STATE.stage = +ui.dataset.st || 0;
      xprRefreshStageOnly();
    } else if(cmd === 'preset'){
      const k = ui.dataset.k;
      const pr = XPR_CUBE_PRESETS[k];
      if(!pr) return;
      XPR_STATE.preset = k;
      const lg = XPR_STATE.D.lg || 'ar';
      const src = pr[lg];
      Object.assign(XPR_STATE.D, { p:k, to:src.to, hk:src.hook, ms:src.msg, gf:src.gift, sb:src.sub, fr:src.fr });
      XPR_STATE.stage = 0;
      xprPlayChime(XPR_STATE.D.sn, 1);
      xprRefreshStudio();
    } else if(cmd === 'lang'){
      const lg = ui.dataset.v === 'en' ? 'en' : 'ar';
      const curPr = XPR_CUBE_PRESETS[XPR_STATE.preset];
      const prevLg = XPR_STATE.D.lg;
      XPR_STATE.D.lg = lg;
      if(curPr && prevLg !== lg){
        const oldDef = curPr[prevLg], newDef = curPr[lg];
        if(XPR_STATE.D.to === oldDef.to) XPR_STATE.D.to = newDef.to;
        if(XPR_STATE.D.hk === oldDef.hook) XPR_STATE.D.hk = newDef.hook;
        if(XPR_STATE.D.ms === oldDef.msg) XPR_STATE.D.ms = newDef.msg;
        if(XPR_STATE.D.gf === oldDef.gift) XPR_STATE.D.gf = newDef.gift;
        if(XPR_STATE.D.sb === oldDef.sub) XPR_STATE.D.sb = newDef.sub;
        if(XPR_STATE.D.fr === oldDef.fr) XPR_STATE.D.fr = newDef.fr;
      }
      xprRefreshStudio();
    } else if(cmd === 'theme'){
      XPR_STATE.D.th = ui.dataset.v;
      xprRefreshStudio();
    } else if(cmd === 'toggleprev'){
      if(!xprCanPreviewToggle()) return;
      if(xprUnlocked('cube')){
        XPR_STATE.previewSimVisitor = true;
      } else {
        XPR_STATE.previewSimVisitor = false;
        S.unlk = S.unlk || {};
        S.unlk.xpr_prev_on = 1;
      }
      xprRefreshStudio();
    } else if(cmd === 'copylink'){
      const url = xprShareUrl(XPR_STATE.D);
      try{ await navigator.clipboard.writeText(url); }catch(e){
        const inp = $('#xprShareInput'); if(inp){ inp.select(); document.execCommand('copy'); }
      }
      toast('🔗 ' + gzL('تم نسخ رابط المفاجأة! أرسله الآن بالواتساب','Surprise link copied! Ready for WhatsApp'));
    } else if(cmd === 'sharelink'){
      const url = xprShareUrl(XPR_STATE.D);
      if(navigator.share){
        try{ await navigator.share({ title: XPR_STATE.D.hk, text: (XPR_STATE.D.to ? `${XPR_STATE.D.to} — ` : '') + XPR_STATE.D.hk, url }); return; }catch(e){}
      }
      try{ await navigator.clipboard.writeText(url); }catch(e){}
      toast('🔗 ' + gzL('تم نسخ الرابط الجاهز للإرسال بالواتساب','Link copied for WhatsApp'));
    } else if(cmd === 'openfull' || cmd === 'openfullpreview'){
      xprOpenFullscreen(XPR_STATE.D, false);
    } else if(cmd === 'dlcard'){
      xprDownloadCardPNG();
    } else if(cmd === 'printcard'){
      xprPrintCardPDF();
    } else if(cmd === 'dlhtml'){
      xprDownloadStandaloneHTML();
    }
  });

  container.addEventListener('input', ev=>{
    const fld = ev.target.dataset && ev.target.dataset.xfld;
    if(!fld) return;
    XPR_STATE.D[fld] = ev.target.value;
    if(fld === 'sn') xprPlayChime(ev.target.value, 1);
    if(['ms'].includes(fld)) XPR_STATE.stage = 1;
    else if(['gf','sb','lk'].includes(fld)) XPR_STATE.stage = 2;
    xprRefreshStageOnly();
  });
}

        return;
      }
      let expType = sp.get('exp'), tok = sp.get('d');
      if(!expType && /^#exp=cube:/i.test(location.hash)){
        expType = 'cube';
        tok = location.hash.slice('#exp=cube:'.length);
      }
      if(expType !== 'cube' || !tok) return;
      const D = xprDecodeData(tok);
      if(!D) return;
      const boot = $('#boot');
      if(boot) boot.classList.add('hide');
      document.title = (D.to ? `${D.to} · ` : '') + 'مكعب المفاجأة الذهبي — إيلان دول';
      xprOpenFullscreen(D, true);
    }catch(e){}
  };
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ()=>setTimeout(run, 30));
  else setTimeout(run, 30);
})();
</script>
