<div id="bg"><div class="orb" style="width:620px;height:620px;background:#4F8460;opacity:.34;top:-220px;right:-140px" id="o1"></div><div class="orb" style="width:520px;height:520px;background:#E8B64A;opacity:.14;bottom:-240px;left:-160px" id="o2"></div><div class="grid" id="grid"></div></div>
<div id="wm"><img id="logo" alt=""><div>EILAN DOLL<small>THE DIGITAL WORLD</small></div></div>
<div id="stage"></div><div id="dots"></div>
<script>
const CUBE_PAT=/*CUBE_PAT*/{};const LOGO=/*LOGO*/"";
/* same sunrise ramp as the site icons (CUBE_RAMP in index.html): cream · gold · dark purple (touch) · green · dark green */
const RAMP=/*CUBE_RAMP*/['#F6E3A8','#E8B64A','#4B2A7B','#6FA37C','#2F7A52'];
const LANG=new URLSearchParams(location.search).get('l')==='en'?'en':'ar',EN=LANG==='en';
if(EN){document.documentElement.lang='en';document.documentElement.dir='ltr';document.body.classList.add('en')}
const L=(a,e)=>EN?e:a;
document.getElementById('logo').src=LOGO;
const $=s=>document.querySelector(s);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=cl(x);const c=1.15;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const ramp=(t,a,b)=>cl((t-a)/(b-a));
/* cube icon with per-cube elements so they can fly in */
/* Crazy Kashta: the cube campfire of its cover and the 5 card-kind icons (same patterns as games/print-src/build_kashta.py) */
const XPAT={
 kashta:{rows:'.....o.....|....oo.....|....ooo..o.|...oooo..o.|..ooooooo..|..oooiooo..|.oooiiiooo.|.ooiiiiioo.|.ooiiiiioo.|..ooiiioo..|...ooooo...|ll.lllll.ll|.lllllllll.',col:(c,y)=>c==='o'?(y<4?'#EBC66A':'#E0B454'):c==='i'?'#F6E3A8':'#2F5E42'},
 'k-fire':{rows:'....#....|...##..#.|..####.#.|..######.|.########|.########|..######.|...####..',cols:['#F6E3A8','#E0B454','#E0B454','#B58A2E']},
 'k-talk':{rows:'.#######.|#########|##.#.#.##|#########|.#######.|...##....|..#......'},
 'k-riddle':{rows:'..###..|.##.##.|....##.|...##..|..##...|.......|..##...',cols:['#F6E3A8','#E0B454']},

 'k-star':{rows:'...#...|...#...|#######|.#####.|..###..|.##.##.|##...##',cols:['#E0B454','#EBDDB0']}};
function xColor(X,c,y,H,cols){if(X.col)return X.col(c,y);cols=cols||X.cols;return cols[Math.min(cols.length-1,Math.floor(y/Math.max(1,H-1)*cols.length))]}
function cubeIcon(key,size,bg=true,cols){if(XPAT[key])return xIcon(key,size,bg,cols);const rows=(CUBE_PAT[key]||CUBE_PAT.spark).split('|'),H=rows.length,W=rows[0].length;
  const P=Math.min(7.4,60/W,60/H),Z=P*.82,OX=(64-P*W)/2,OY=(64-P*H)/2;let seed=7;for(const c of key)seed=(seed*31+c.charCodeAt(0))|0;
  const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff};
  let h=`<svg viewBox="0 0 64 64" width="${size}" height="${size}" style="overflow:visible">${bg?'<rect width="64" height="64" rx="15" fill="#1C1E16" class="ib"/>':''}`;
  rows.forEach((r,y)=>{for(let x=0;x<W;x++)if(r[x]==='#'){const cx=OX+(x+.5)*P,cy=OY+(y+.5)*P,a=rnd()*6.283,m=40+rnd()*60;
    h+=`<rect class="cq" data-dx="${(Math.cos(a)*m).toFixed(1)}" data-dy="${(Math.sin(a)*m).toFixed(1)}" data-d="${rnd().toFixed(3)}" x="${(cx-Z/2).toFixed(2)}" y="${(cy-Z/2).toFixed(2)}" width="${Z.toFixed(2)}" height="${Z.toFixed(2)}" rx="${(Z*.27).toFixed(2)}" fill="${RAMP[Math.min(4,Math.floor(y/Math.max(1,H-1)*5))]}" style="transform-box:fill-box;transform-origin:center"/>`}});
  return h+'</svg>'}
function xIcon(key,size,bg,cols){const X=XPAT[key],rows=X.rows.split('|'),H=rows.length,W=rows[0].length;
  const P=Math.min(X.col?64/Math.max(W,H):7.4,X.col?99:60/W,X.col?99:60/H),Z=P*.84,OX=(64-P*W)/2,OY=(64-P*H)/2;let seed=11;for(const c of key)seed=(seed*31+c.charCodeAt(0))|0;
  const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff};
  let h=`<svg viewBox="0 0 64 64" width="${size}" height="${size}" style="overflow:visible;display:block">${bg?'<rect width="64" height="64" rx="15" fill="#1C1E16" class="ib"/>':''}`;
  rows.forEach((r,y)=>{for(let x=0;x<W;x++)if(r[x]!=='.'){const cx=OX+(x+.5)*P,cy=OY+(y+.5)*P,a=rnd()*6.283,m=30+rnd()*40;
    h+=`<rect class="cq" data-dx="${(Math.cos(a)*m).toFixed(1)}" data-dy="${(Math.sin(a)*m).toFixed(1)}" data-d="${rnd().toFixed(3)}" x="${(cx-Z/2).toFixed(2)}" y="${(cy-Z/2).toFixed(2)}" width="${Z.toFixed(2)}" height="${Z.toFixed(2)}" rx="${(Z*.27).toFixed(2)}" fill="${xColor(X,r[x],y,H,cols)}" style="transform-box:fill-box;transform-origin:center"/>`}});
  return h+'</svg>'}
function assemble(root,p){root.querySelectorAll('.cq').forEach(r=>{const d=+r.dataset.d,q=back(ramp(p,d*.45,d*.45+.55));
  r.style.transform=`translate(${(1-q)*r.dataset.dx}px,${(1-q)*r.dataset.dy}px) rotate(${(1-q)*140}deg) scale(${.3+.7*q})`;r.style.opacity=cl(q*1.4)});
  const b=root.querySelector('.ib');if(b)b.style.opacity=ease(ramp(p,0,.5))}
function shimmer(root,t){root.querySelectorAll('.cq').forEach((r,i)=>{const s=.5+.5*Math.sin(t*3.2-i*.35);r.style.filter=`brightness(${1+s*.28})`})}

   const a=(left/s.n)*360;r.style.background=`conic-gradient(#E8B64A ${a}deg,rgba(239,233,218,.08) 0) border-box`;r.style.boxShadow='inset 0 0 0 22px #1C1E16';r.style.transform=`scale(${.6+.4*q})`}
 if(s.k==='mem'){root.querySelectorAll('[data-m]').forEach((c,i)=>{const v=back(ramp(lt,.05+i*.025,.5+i*.025));c.style.transform=`scale(${v})`;
   const f=c.querySelector('[data-face]');if(f){const o=ease(ramp(lt,1.0+(i%3)*.35,1.4+(i%3)*.35));c.style.background=o>.5?'linear-gradient(135deg,rgba(79,132,96,.5),rgba(232,182,74,.25))':'';f.style.opacity=o;
     if(s.match&&lt>2.2)c.style.boxShadow=`0 0 ${20+10*Math.sin(lt*6)}px #E8B64A`}})}
 if(s.k==='xo'){root.querySelectorAll('[data-mk]').forEach((m,i)=>{const v=back(ramp(lt,.3+i*.35,.7+i*.35));m.style.transform=`scale(${v}) rotate(${(1-v)*-40}deg)`;m.style.opacity=cl(v)});
   if(s.w)s.w.forEach(i=>{const c=root.querySelector(`[data-xo="${i}"]`);c.style.boxShadow=lt>2?`0 0 ${18+10*Math.sin(lt*6)}px #E8B64A`:''})}
 if(s.k==='catch'){root.querySelectorAll('[data-c]').forEach((c,i)=>{const ph=(lt*1.6+i*.37)%1;c.style.transform=`scale(${ph<.7?back(ph/.35):0})`})}
 if(s.k==='snake'){const b=root.querySelector('[data-snk]');const C=30,step=Math.floor(lt*7);let h='';const path=[];for(let k=0;k<6+Math.min(4,Math.floor(step/6));k++){const s2=step-k;const x=(s2%12+12)%12,y=3+Math.round(Math.sin(s2/4)*2);path.push([x,y])}
   path.forEach(([x,y],k)=>{h+=`<i style="position:absolute;left:${x*C+30}px;top:${y*C+20}px;width:${C-4}px;height:${C-4}px;border-radius:7px;background:${k?RAMP[3]:RAMP[1]};box-shadow:0 0 14px ${k?RAMP[3]:RAMP[1]}"></i>`});
   h+=`<i style="position:absolute;left:${((step+4)%12)*C+34}px;top:${(3+Math.round(Math.sin((step+4)/4)*2))*C+24}px;width:18px;height:18px;border-radius:50%;background:#ff835c;box-shadow:0 0 16px #ff835c"></i>`;b.innerHTML=h}
 if(s.k==='pad'){const seq=[1,5,4,3];const on=seq[Math.floor(lt*2)%4];root.querySelectorAll('[data-pd]').forEach(c=>{const a=+c.dataset.pd===on;c.style.background=a?'linear-gradient(135deg,#E8B64A,#6FA37C)':'';c.style.color=a?'#14150F':'#E8B64A';c.style.transform=a?'scale(.92)':''})}
 if(s.k==='icon'){const ic=root.querySelector('[data-ic]');assemble(ic,ramp(lt,.1,1.6));shimmer(ic,lt);ic.style.transform=`translateY(${Math.sin(lt*2)*8}px)`}
 if(['score','players','teams','levels'].includes(s.k))root.querySelectorAll('[data-row]').forEach((r,i)=>{const v=back(ramp(lt,.25+i*.28,.75+i*.28));r.style.transform=`translateX(${(1-v)*-80}px)`;r.style.opacity=cl(v)});
 if(s.k==='pass'){const ph=root.querySelector('[data-ph]');const pts=[[-60,0],[0,-60],[60,0],[0,60]];const seg=lt*1.1,k=Math.floor(seg)%4,f=ease(seg%1);
   const A=pts[k],B=pts[(k+1)%4];ph.style.transform=`translate(${A[0]+(B[0]-A[0])*f}px,${A[1]+(B[1]-A[1])*f}px) rotate(${Math.sin(lt*3)*8}deg)`}
 if(s.k==='kinds')root.querySelectorAll('[data-row]').forEach((r,i)=>{const v=ease(ramp(lt,.3+i*.32,1.0+i*.32));r.style.transform=`translateY(${(1-v)*24}px)`;r.style.opacity=cl(v)});
 if(s.k==='kcard'){root.querySelectorAll('[data-kc]').forEach((c,i)=>{const v=ease(ramp(lt,.35+i*1.1,1.25+i*1.1)),sc=s.c.length>1?.78:1;
     (s.c.length>1?c.parentElement:c).style.transform=`translateY(${(1-v)*30+Math.sin(lt*1.2+i*1.7)*3}px) rotate(${(i?2.5:-2.5)*(s.c.length>1)+(1-v)*(i?4:-4)}deg) scale(${sc})`;c.style.opacity=cl(v)});
   const a=root.querySelector('[data-ans]');if(a){const v=ease(ramp(lt,3.2,3.9));a.style.opacity=v;if(v>.99&&lt<4.6)a.style.background=`rgba(224,180,84,${.18+.08*Math.sin((lt-3.9)*4)})`;else a.style.background=''}}
 if(s.k==='kwin'){root.querySelectorAll('[data-row]').forEach((r,i)=>{const v=ease(ramp(lt,.3+i*.3,1.0+i*.3));r.style.transform=`translateY(${(1-v)*24}px)`;r.style.opacity=cl(v);
     const f=r.querySelector('[data-fill]');if(f)f.style.transform=`scaleX(${f.dataset.fill*ease(ramp(lt,.9+i*.3,2.6+i*.3))})`});
   const w=root.querySelector('[data-row="1"]');if(w)w.style.boxShadow=lt>3?`0 0 ${14+6*Math.sin((lt-3)*2.4)}px rgba(224,180,84,.55)`:''}
 if(s.k==='vs')root.querySelectorAll('.chip').forEach((c,i)=>{const v=back(ramp(lt,.2+i*.3,.7+i*.3));c.style.transform=`scale(${v}) translateY(${Math.sin(lt*2+i)*6}px)`})
}

/* ---------- scenes ---------- */
const stage=$('#stage');
SC.forEach(sc=>{const d=document.createElement('div');d.className='scene';sc.el=d;
 if(sc.k==='intro')d.innerHTML=`<div class="center" style="position:absolute;inset:0;gap:16px"><div data-icon>${cubeIcon(G.ic,230,G.icBg!==false)}</div><div class="eb" data-a>${G.eb||`EILAN GAMES · ${G.free?L('مجانية','FREE'):L('لعبة إيلان','HOW TO PLAY')}`}</div><div class="t1" data-b><span class="grad">${G.n}</span><bdi dir="${EN?'rtl':'ltr'}">${G.en}</bdi></div><div class="t3" data-c>${G.sub}</div></div>`;
 if(sc.k==='step'){const s=G.steps[sc.i];d.innerHTML=`<div class="step"><div class="txt">${G.ardig&&!EN?`<div data-a style="width:92px;height:92px;border-radius:26px;border:2.4px solid #E8B64A;display:grid;place-items:center;font-weight:900;font-size:54px;line-height:1;color:#E8B64A">${AD(sc.i+1)}</div>`:`<div class="num" data-a>0${sc.i+1}</div>`}<div class="t2" data-b${G.calm?' style="font-size:'+(EN?40:46)+'px"':''}>${s[0]}</div><div class="t3" data-c>${s[1]}</div>${s[3]?`<div class="note" data-d>${s[3]}</div>`:''}</div><div class="ill">${illHTML(s[2])}</div></div>`}
 if(sc.k==='outro'&&G.ic==='kashta'){
   d.innerHTML=`<div class="center" style="position:absolute;inset:0;gap:20px"><img src="${LOGO}" data-icon style="width:140px;height:140px"><div class="t2" data-b>${L('الكشتة المجنونة في متجر','Crazy Kashta at the')} <span class="grad">${L('إيلان دول','Eilan Doll store')}</span></div><div data-c style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:1040px"><span class="pill g">${L('أول ٣ بطاقات مجانًا','First 3 cards free')}</span><span class="pill o">${L('تبي تكمل؟ اشترِ اللعبة — ٣٠ ريال','Want more? Get the game — 30 SAR')}</span><span class="pill">${L('نسخة للشاشة | iPad والكمبيوتر','Screen edition | iPad & computer')}</span><span class="pill o">${L('ونسخة طباعة وجه وقفا','Print-ready, double-sided')}</span></div><div class="t3" data-a style="font-family:Poppins,Cairo;letter-spacing:${EN?4:1}px;font-size:20px">${L('منطقة الترفيه | EILAN DOLL','ENTERTAINMENT ZONE · EILAN DOLL')}</div></div>`}
 else if(sc.k==='outro'){const tags=G.paid?`<span class="pill g">${G.arc?L('أول ٣ جولات مجاناً','First 3 rounds free'):L('أول ٣ بطاقات مجاناً','First 3 cards free')}</span><span class="pill o">${L('اللعبة كاملة ٣٠ ر.س','Full game 30 SAR')}</span>`:`<span class="pill g">${L('مجانية ١٠٠٪','100% free')}</span>`;
   d.innerHTML=`<div class="center" style="position:absolute;inset:0;gap:20px"><img src="${LOGO}" data-icon style="width:150px;height:150px"><div class="t2" data-b>${L('العبها الحين في','Play it now on')} <span class="grad">${L('إيلان دول','Eilan Doll')}</span></div><div data-c style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:1000px">${tags}<span class="pill">${L('على الجوال · الآيباد · الكمبيوتر','Phone · iPad · Computer')}</span>${G.print?`<span class="pill o">🖨️ ${L('وفيه ملف PDF للطباعة',G.free?'Free print PDF':'Includes a print PDF')}</span>`:''}</div><div class="t3" data-a style="font-family:Poppins;letter-spacing:4px;font-size:20px">${L('منطقة الترفيه','ENTERTAINMENT ZONE')} · EILAN DOLL</div></div>`}
 stage.appendChild(d)});

function render(t){
 $('#o1').style.transform=`translate(${Math.sin(t*.4)*50}px,${Math.cos(t*.3)*40}px)`;$('#o2').style.transform=`translate(${Math.cos(t*.35)*60}px,${Math.sin(t*.45)*30}px)`;
 $('#grid').style.backgroundPosition=`0 ${(t*20)%56}px,0 0`;
 SC.forEach(sc=>{const d=sc.el,lt=t-sc.a,dur=sc.b-sc.a;const fin=ease(ramp(lt,0,.45)),fout=1-ease(ramp(lt,dur-.4,dur));const vis=sc===SC[0]?(t<.0001?1:fout):(sc===SC[SC.length-1]?fin:Math.min(fin,fout));
  const on=lt>-0.01&&lt<dur+.01;d.style.opacity=on?vis:0;d.style.display=on?'block':'none';if(!on)return;
  d.style.transform=`scale(${1+.04*(1-fin)})`;
  const A=d.querySelector('[data-a]'),B=d.querySelector('[data-b]'),C=d.querySelector('[data-c]'),D=d.querySelector('[data-d]');
  [[A,.15],[B,.3],[C,.5],[D,.9]].forEach(([e,o])=>{if(!e)return;const v=G.calm?ease(ramp(lt,o,o+.8)):back(ramp(lt,o,o+.6));e.style.transform=`translateY(${(1-v)*40}px)`;e.style.opacity=cl(v)});
  if(sc.k==='intro'){const ic=d.querySelector('[data-icon]');assemble(ic,ramp(lt,0,1.5));shimmer(ic,lt);[A,B,C].forEach((e,i)=>{const v=back(ramp(lt,1.2+i*.25,1.9+i*.25));e.style.transform=`translateY(${(1-v)*40}px)`;e.style.opacity=cl(v)})}
  if(sc.k==='outro'){const ic=d.querySelector('[data-icon]');const v=back(ramp(lt,.1,.8));ic.style.transform=`scale(${v}) translateY(${Math.sin(lt*2)*6}px)`;ic.style.opacity=cl(v)}
  if(sc.k==='step')illUpdate(d.querySelector('.ill'),G.steps[sc.i][2],0,lt)});
 const cur=SC.findIndex(s=>t>=s.a&&t<s.b);
 document.querySelectorAll('#dots b').forEach((b,i)=>{const s=SC[i+1];b.style.transform=`scaleX(${cl((t-s.a)/(s.b-s.a))})`});
 $('#dots').style.opacity=cur>0&&cur<SC.length-1?1:0;
}
render(0);
</script></body></html>
