<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ورشة إيلان — باقة الغبقة الرمضانية | إيلان دول</title>
<meta name="description" content="ورشة إيلان: صمّم باقة الغبقة الرمضانية باسمك — غلاف، دعوة، سفرة الغبقة، بطاقات المهام وبطاقة شكر — وتطلع لك جاهزة PDF للطباعة أو الشاشة.">
<meta name="theme-color" content="#07080C">
<link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--night:#07080C;--blue:#1E44C8;--blue-d:#0B1F5E;--green:#0F6B44;--green-d:#07341F;--purple:#4A2A8F;--purple-d:#251147;--mint:#D8FFE6;--gold:#E2B450;--mu:#9FB3A8;--ui:'Tajawal',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--night);color:#EDEFF6;font-family:var(--ui);-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(7,8,12,.92);border-bottom:1px solid rgba(216,255,230,.08);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;min-width:0}
.brand img{width:32px;height:32px}
.brand b{display:block;font-size:15px}.brand small{display:block;font-size:11px;color:var(--mu)}
.sp{flex:1}
.ib{height:38px;padding:0 12px;border-radius:11px;display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(216,255,230,.16);background:rgba(15,18,30,.7);font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px}
.hero{display:flex;gap:18px;align-items:center;margin:6px 0 18px}
.cubes{display:grid;grid-template-columns:repeat(3,16px);gap:4px;flex:0 0 auto}
.cubes i{display:block;width:16px;height:16px;border-radius:4px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--gold);font-weight:700}
h1{font-family:'Reem Kufi',var(--ui);font-size:30px;line-height:1.25;margin:2px 0 4px}
.lead{color:#B9C7C0;font-size:15px;line-height:1.7}
.grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:rgba(11,31,94,.18);border:1px solid rgba(30,68,200,.35);border-radius:16px;padding:14px}
.step{border-top:1px solid rgba(216,255,230,.08);padding:14px 2px}
.step:first-child{border-top:0;padding-top:4px}
.step h2{font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.step h2 .n{width:24px;height:24px;border-radius:7px;background:var(--purple);display:inline-grid;place-items:center;font-size:13px;color:var(--mint)}
label.f{display:block;font-size:13px;color:#B9C7C0;margin:8px 0 4px}
input[type=text],input[type=date],input[type=time],textarea{width:100%;height:40px;border-radius:10px;border:1px solid rgba(216,255,230,.18);background:rgba(7,8,12,.6);padding:0 10px;font-size:15px}
textarea{height:64px;padding:8px 10px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid rgba(216,255,230,.35);background:transparent;border-radius:999px;padding:6px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--mint);color:var(--green-d);border-color:var(--mint);font-weight:700}
.chip .x{opacity:.6;font-size:12px}
.add{display:flex;gap:6px;margin-top:8px}
.add input{flex:1}
.btn{height:40px;border-radius:10px;border:1px solid rgba(226,180,80,.6);background:transparent;color:var(--gold);padding:0 14px;font-weight:700;font-size:14px;white-space:nowrap}
.btn.g{background:linear-gradient(135deg,var(--green),var(--green-d));border-color:transparent;color:#fff}
.btn.full{width:100%;height:48px;font-size:16px}
.err{color:#F09595;font-size:12px;min-height:16px;margin-top:4px}
.list .it{display:grid;grid-template-columns:110px 1fr 34px;gap:6px;margin-bottom:6px}
.list.tasks .it{grid-template-columns:1fr 1fr 34px}
.del{height:40px;border-radius:10px;border:1px solid rgba(240,149,149,.4);background:transparent;color:#F09595}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid rgba(216,255,230,.25);background:transparent;border-radius:10px;padding:7px 12px;font-size:14px;display:inline-flex;align-items:center;gap:7px}
.seg button.on{border-color:var(--gold);color:var(--gold);font-weight:700}
.seg .dot{width:14px;height:14px;border-radius:4px;display:inline-block}
.prev{position:sticky;top:70px}
@media (max-width:900px){.prev{position:static}}
.pv-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.pv-h b{font-size:15px}
.pv-h small{color:var(--mu);font-size:12px}
.pages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pages figure{background:#000;border-radius:10px;overflow:hidden;border:1px solid rgba(216,255,230,.1)}
.pages canvas{display:block;width:100%;height:auto}
.pages figcaption{font-size:12px;color:var(--mu);padding:5px 8px;background:rgba(7,8,12,.9)}
.pages figure.big{grid-column:1/-1}
.buy{margin-top:14px;background:linear-gradient(120deg,rgba(74,42,143,.35),rgba(15,107,68,.25));border:1px solid rgba(226,180,80,.4);border-radius:14px;padding:14px}
.buy p{font-size:13px;color:#C9D6CF;line-height:1.7;margin-top:8px}
.note{font-size:12px;color:var(--mu);line-height:1.7;margin-top:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
@media (max-width:700px){.gal{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gal figure{position:relative;border-radius:10px;overflow:hidden;border:1px solid rgba(216,255,230,.12);background:#000}
.gal figure.big{grid-column:1/-1}
.gal canvas{display:block;width:100%;height:auto}
.gal figcaption{position:absolute;bottom:6px;inset-inline-start:6px;font-size:11px;background:rgba(7,8,12,.8);padding:2px 8px;border-radius:999px;color:var(--mint)}
.gal .smp{position:absolute;top:6px;inset-inline-end:6px;font-size:11px;font-weight:700;background:var(--gold);color:#412402;padding:2px 8px;border-radius:999px}
.box{border-radius:18px;border:1px solid rgba(226,180,80,.45);background:linear-gradient(120deg,rgba(74,42,143,.3),rgba(11,31,94,.26) 55%,rgba(15,107,68,.2));padding:16px;margin-bottom:18px}
.box.cv{border-color:rgba(30,68,200,.5);background:rgba(11,31,94,.2)}
.box h2.t{font-family:'Reem Kufi',var(--ui);font-size:21px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;color:#412402;background:var(--gold);border-radius:999px;padding:2px 9px}
.box p.d{font-size:14px;color:#C2CEC8;line-height:1.7;margin-top:4px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
@media (max-width:700px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{border-radius:14px;border:1px solid rgba(216,255,230,.14);background:rgba(7,8,12,.55);padding:12px;display:flex;flex-direction:column;gap:6px}
.opt b{font-size:15px}.opt span{font-size:13px;color:#B9C7C0;line-height:1.6}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;flex-wrap:wrap}
.price{font-weight:900;font-size:15px;color:var(--gold)}
.soon{color:#F0C88A;font-size:12px;min-height:16px;margin-top:6px}
</style>
</head>
<body>
<header class="top">
 <a class="brand" href="/"><img src="/assets/logo/eilan-icon.svg" alt=""><span><b data-t="إيلان دول|EILAN DOLL"></b><small data-t="ورشة إيلان|Eilan Workshop"></small></span></a>
 <span class="sp"></span>
 <button class="ib" id="langBtn" type="button">EN</button>
 <a class="ib" href="/templates" data-t="القوالب|Templates"></a>
 <a class="ib" href="/" data-t="الرئيسية|Home"></a>
</header>

<main class="wrap">
 <section class="hero">
  <div class="cubes" aria-hidden="true"><i style="background:#0F6B44"></i><i style="background:#1E44C8"></i><i style="background:#E2B450;transform:translateY(-7px)"></i><i style="background:#4A2A8F"></i><i style="background:#07341F"></i><i style="background:#0B1F5E"></i></div>
  <div>
   <div class="eyebrow">EILAN WORKSHOP · GHABGA KIT</div>
   <h1 data-t="باقة الغبقة الرمضانية — باسمك أنت|The Ramadan Ghabga Kit — made with your names"></h1>
   <p class="lead" data-t="اكتب اسم الغبقة واختر سفرتكم، وإيلان تبني لك الباقة كاملة على طول: غلاف، دعوة، سفرة الغبقة، بطاقات المهام وبطاقة شكر.|Name your ghabga and pick your menu, and Eilan builds the full kit instantly: cover, invitation, menu, task cards and a thank-you card."></p>
  </div>
 </section>

 <section class="box" aria-labelledby="eT">
  <h2 class="t" id="eT"><span data-t="١ · باقة تخصّصها إيلان|1 · Made by Eilan for you"></span><span class="badge" data-t="الأسهل|Easiest"></span></h2>
  <p class="d" data-t="٥ صفحات بتصميم مكعبات إيلان: غلاف، دعوة، سفرة الغبقة، بطاقات المهام وبطاقة شكر. تكتب بياناتك تحت، وتشوف الباقة تتغيّر قدامك وأنت تكتب، وبعدها تحمّلها PDF.|5 pages in Eilan’s cube style: cover, invitation, menu, task cards and a thank-you card. Type your details below, watch the kit change as you type, then download a PDF."></p>
  <div class="gal" id="galE"></div>
  <div class="row"><span class="price" data-t="السعر قريبًا|Price coming soon"></span><a class="btn g" href="#make" data-t="صمّم باقتك تحت|Design yours below"></a></div>
 </section>

 <section class="box cv" aria-labelledby="cT">
  <h2 class="t" id="cT" data-t="٢ · قوالب كانفا تعدّلها بنفسك|2 · Canva templates you edit yourself"></h2>
  <p class="d" data-t="٥ صفحات بتصميم كانفا، تفتحها في حسابك في كانفا (يكفي الحساب المجاني) وتكتب فيها سفرتكم ومهامكم وكل اللي تبيه.|5 pages in a Canva design. Open them in your Canva account (a free one works) and add your own menu, tasks and anything you like."></p>
  <div class="gal" id="galC"></div>
  <div class="opts">
   <div class="opt"><b data-t="القالب الفاضي|Blank template"></b><span data-t="نفس التصميم بدون كلام، تكتب كل شي بنفسك.|Same design, no text — write everything yourself."></span><span class="price" data-t="السعر قريبًا|Price coming soon"></span></div>
   <div class="opt"><b data-t="القالب الجاهز (المثال)|Ready template (the sample)"></b><span data-t="ملف «عائلة الريّان» نفسه، وتغيّر الاسم والسفرة على كيفك.|The “Al-Rayyan” file itself — change names and dishes as you like."></span><span class="price" data-t="السعر قريبًا|Price coming soon"></span></div>
   <div class="opt"><b data-t="القالبين مع بعض|Both templates"></b><span data-t="الفاضي والجاهز في طلب واحد.|Blank and ready in one order."></span><span class="price" data-t="السعر قريبًا|Price coming soon"></span></div>
  </div>
  <div class="row"><span></span><button class="btn" type="button" id="soonBtn" data-t="يفتح البيع قريبًا|Sales open soon"></button></div>
  <p class="soon" id="soonMsg" role="status"></p>
 </section>

 <h2 id="make" style="font-family:'Reem Kufi',var(--ui);font-size:22px;margin:6px 0 2px" data-t="صمّم باقة إيلان|Design your Eilan kit"></h2>
 <p class="lead" style="margin-bottom:12px" data-t="أي شي تكتبه أو تختاره يتغيّر في المعاينة على طول. والخانة اللي تتركها فاضية تطلع بكلام المثال.|Whatever you type or pick updates the preview instantly. Empty fields use the sample text."></p>

 <div class="grid">
  <form class="panel" id="form" autocomplete="off" onsubmit="return false">
   <div class="step">
    <h2><span class="n">1</span><span data-t="الأساسيات|The basics"></span></h2>
    <label class="f" for="name" data-t="اسم الغبقة|Ghabga name"></label>
    <input type="text" id="name" maxlength="40">
    <div class="row2">
     <div><label class="f" for="day" data-t="اليوم|Day"></label><input type="text" id="day" maxlength="30"></div>
     <div><label class="f" for="time" data-t="الوقت|Time"></label><input type="time" id="time"></div>
    </div>
    <label class="f" for="place" data-t="المكان|Place"></label>
    <input type="text" id="place" maxlength="50">
    <label class="f" for="note" data-t="ملاحظة في الدعوة (اختياري)|Note on the invitation (optional)"></label>
    <textarea id="note" maxlength="120"></textarea>
   </div>

   <div class="step">
    <h2><span class="n">2</span><span data-t="شكل الباقة|Kit style"></span></h2>
    <div class="seg" id="theme"></div>
   </div>

   <div class="step">
    <h2><span class="n">3</span><span data-t="سفرة الغبقة|The menu"></span></h2>
    <div class="chips" id="menu"></div>
    <div class="add"><input type="text" id="menuIn" maxlength="22" data-ph="أضف طبق من عندك|Add your own dish" aria-label="menu"><button class="btn" type="button" id="menuAdd" data-t="أضف|Add"></button></div>
    <div class="err" id="menuErr"></div>
   </div>

   <div class="step">
    <h2><span class="n">4</span><span data-t="بطاقات المهام|Task cards"></span></h2>
    <div class="list tasks" id="tasks"></div>
    <button class="btn" type="button" id="taskAdd" data-t="+ مهمة|+ Task"></button>
   </div>

   <div class="step">
    <h2><span class="n">5</span><span data-t="بطاقة الشكر|Thank-you card"></span></h2>
    <label class="f" for="thanks" data-t="رسالة الشكر|Thank-you message"></label>
    <input type="text" id="thanks" maxlength="44">
    <label class="f" for="host" data-t="مع تحيات (اسم المستضيف)|With love from (host name)"></label>
    <input type="text" id="host" maxlength="30">
   </div>

   <div class="step">
    <h2><span class="n">6</span><span data-t="الصفحات اللي تبيها|Pages to include"></span></h2>
    <div class="chips" id="pagesSel"></div>
   </div>
  </form>

  <aside class="prev">
   <div class="pv-h"><b data-t="معاينة باقتك|Your kit preview"></b><small id="pvCount"></small></div>
   <div class="pages" id="pages"></div>
   <div class="buy">
    <button class="btn g full" type="button" id="dl" data-t="حمّل نسخة المعاينة PDF|Download the preview PDF"></button>
    <p data-t="هذي نسخة معاينة عليها كلمة «معاينة». النسخة النظيفة الجاهزة للطباعة تفتح بعد الشراء، والبيع يفتح قريبًا.|This preview carries a “preview” mark. The clean print-ready version unlocks after purchase — sales open soon."></p>
   </div>
   <p class="note" data-t="الباقة تُبنى في جهازك وما تنرسل بياناتك لأي مكان. للاستخدام الشخصي فقط، وإعادة بيعها غير مسموحة.|The kit is built on your device; your details are not sent anywhere. Personal use only — reselling is not allowed."></p>
  </aside>
 </div>
</main>

<script>
(function(){
'use strict';
var W=1754,H=1240;
var UNLOCKED=false;
var qs=new URLSearchParams(location.search);
var EN=qs.get('lang')==='en';
function T(s){var p=String(s).split('|');return EN&&p[1]!==undefined?p[1]:p[0]}
function A(a){return EN?a[1]:a[0]}

var THEMES=[
 {id:'blue',n:['ليل أزرق','Blue night'],sky1:'#0B1F5E',sky2:'#07080C',acc:'#1E44C8',card:'#0B1F5E'},
 {id:'purple',n:['ليل بنفسجي','Purple night'],sky1:'#251147',sky2:'#07080C',acc:'#4A2A8F',card:'#251147'},
 {id:'green',n:['ليل أخضر','Green night'],sky1:'#07341F',sky2:'#07080C',acc:'#0F6B44',card:'#07341F'}
];
var MENU=[['قهوة عربية','Arabic coffee',1],['تمر','Dates',1],['لقيمات','Luqaimat',1],['سمبوسة','Samosa',1],['كنافة','Kunafa',1],['شاي بالنعناع','Mint tea',1],['بلاليط','Balaleet',0],['هريس','Harees',0],['مضروبة','Madhrooba',0],['مكبوس','Machboos',0],['قطايف','Qatayef',0],['فيمتو','Vimto',0]];
var PAGES=[['cover','الغلاف','Cover'],['invite','الدعوة','Invitation'],['menu','سفرة الغبقة','Menu'],['tasks','بطاقات المهام','Task cards'],['thanks','بطاقة الشكر','Thank-you card']];

var st={theme:'blue',name:'',day:'',time:'21:30',place:'',note:'',thanks:'',host:'',
 menu:MENU.map(function(b){return{t:[b[0],b[1]],on:!!b[2]}}),
 tasks:[[['مهمة القهوة','Coffee'],''],[['مهمة الحلا','Desserts'],''],[['مهمة الزينة','Decorations'],''],[['مهمة الصور','Photos'],'']].map(function(x){return{role:x[0],who:x[1]}}),
 pages:{cover:1,invite:1,menu:1,tasks:1,thanks:1}};
var SAMPLE0=JSON.parse(JSON.stringify(st));
function txt(v){return typeof v==='string'?v:A(v)}

/* ---------- UI ---------- */
var $=function(id){return document.getElementById(id)};
function applyLang(){
 document.documentElement.lang=EN?'en':'ar';document.documentElement.dir=EN?'ltr':'rtl';
 document.querySelectorAll('[data-t]').forEach(function(e){e.textContent=T(e.getAttribute('data-t'))});
 document.querySelectorAll('[data-ph]').forEach(function(e){e.placeholder=T(e.getAttribute('data-ph'))});
 $('langBtn').textContent=EN?'عربي':'EN';
 $('name').placeholder=EN?'The Al-Rayyan ghabga':'غبقة عائلة الريّان';
 $('day').placeholder=EN?'A Thursday night in Ramadan':'ليلة الجمعة في رمضان';
 $('place').placeholder=EN?'The Al-Rayyan majlis':'ديوانية عائلة الريّان';
 $('thanks').placeholder=EN?'Ramadan Kareem to you all':'رمضان كريم وكل عام وأنتم بخير';
 $('host').placeholder=EN?'The Al-Rayyan family':'عائلة الريّان';
}
function chip(label,on,onclick,removable,onremove){
 var b=document.createElement('button');b.type='button';b.className='chip'+(on?' on':'');b.setAttribute('aria-pressed',on?'true':'false');
 b.textContent=label;b.onclick=onclick;
 if(removable){var x=document.createElement('span');x.className='x';x.textContent='✕';x.setAttribute('aria-label',T('شيل|Remove'));x.onclick=function(e){e.stopPropagation();onremove()};b.appendChild(x)}
 return b}
function drawTheme(){var c=$('theme');c.innerHTML='';THEMES.forEach(function(t){var b=document.createElement('button');b.type='button';b.className=st.theme===t.id?'on':'';b.innerHTML='<span class="dot" style="background:'+t.acc+'"></span>';b.appendChild(document.createTextNode(A(t.n)));b.onclick=function(){st.theme=t.id;drawTheme();queue()};c.appendChild(b)})}
function drawChips(id,arr){var c=$(id);c.innerHTML='';arr.forEach(function(it,i){c.appendChild(chip(txt(it.t),it.on,function(){if(!it.on&&arr.filter(function(x){return x.on}).length>=10){$('menuErr').textContent=T('وصلت الحد الأعلى (10)، شيل طبق أول|You reached the limit (10). Remove a dish first');return}$('menuErr').textContent='';it.on=!it.on;drawChips(id,arr);queue()},!!it.custom,function(){arr.splice(i,1);drawChips(id,arr);queue()}))})}
