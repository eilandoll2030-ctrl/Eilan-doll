<style>
/* ===== رسمات إيلان — ready-made visual packs (.dw-*) ===== */
.dw-pack{padding:18px;margin-bottom:18px}
.dw-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.dw-head ei-c.ei{width:58px;height:58px}
.dw-head h2{font-size:22px;margin:0;line-height:1.3}.dw-head h2 bdi{font-size:13px;color:var(--mu);font-weight:600;margin-inline-start:6px}
.dw-head p{margin:2px 0 0;color:var(--mu);font-size:13.5px}
.dw-head .sp{flex:1}
.dw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.dw-t{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--bd);background:#0d0e0a;aspect-ratio:16/10;display:block;padding:0;text-align:inherit;cursor:pointer}
.dw-t svg{width:100%;height:100%;display:block;stroke:none!important}
.dw-t .cap{position:absolute;inset-inline:0;bottom:0;padding:18px 10px 8px;background:linear-gradient(transparent,rgba(10,10,8,.92));font-size:12.5px;font-weight:800;color:#EFE9DA;display:flex;align-items:center;gap:6px}
.dw-t .tag{position:absolute;top:8px;inset-inline-start:8px;font-size:11px;font-weight:900;padding:3px 8px;border-radius:999px;background:var(--grad);color:#14150F}
.dw-t.lock{display:grid;place-items:center;cursor:default;background:linear-gradient(160deg,#20231a,#121310)}
.dw-t.lock ei-c.ei{width:52px;height:52px;opacity:.55;filter:saturate(.6)}
.dw-t.lock .lk{position:absolute;top:8px;inset-inline-end:8px;font-size:14px;opacity:.8}.dw-t.lock .lk ei-c.ei{width:20px;height:20px;opacity:.8}
.dw-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.dw-hero h1{font-size:30px;margin:4px 0 6px}.dw-hero p{color:var(--mu);max-width:680px}
.dw-all{display:flex;gap:12px;align-items:center;padding:16px 18px;margin-bottom:18px;border-color:var(--bd2);flex-wrap:wrap}
.dw-all b{font-size:17px}.dw-all .sp{flex:1}
@media (max-width:560px){.dw-grid{grid-template-columns:1fr 1fr;gap:8px}.dw-hero h1{font-size:24px}.dw-t .cap{font-size:11px;padding:14px 7px 6px}}
</style>
<script>
/* ================= 🖼️ رسمات إيلان — ready-made visual packs =================

const DW=[{"id":"study","pid":"d-study","name":"ملخصات إيلان الدراسية","en":"Eilan Study Visuals","icon":"learning","desc":"دروس من المنهج مرسومة وجاهزة للمذاكرة والمراجعة: علوم، رياضيات، لغة عربية، وتاريخ.","titles":[["cycle","دورة الماء في الطبيعة"],["layers","طبقات الأرض من الداخل"],["diagram","القلب: كيف يضخ الدم؟"],["tree","أقسام الكلمة في اللغة العربية"],["timeline","محطات من تاريخ المملكة"],["exploded","الخلية النباتية"],["notes","الكسور بسهولة"],["info","المجموعة الشمسية"],["sketch","قوانين نيوتن للحركة"],["cycle","دورة حياة الفراشة"],["iceberg","ليش ننسى اللي ذاكرناه؟"],["roadmap","خطة مذاكرة الاختبارات"]],"samples":[["cycle",{"title":"دورة الماء في الطبيعة","stages":"التبخّر | الشمس تسخّن الماء فيصعد بخار\nالتكاثف | البخار يبرد ويصير سحب\nالهطول | ينزل مطر أو ثلج أو برد\nالتجمّع | في البحار والأنهار والمياه الجوفية","center":"الماء ما يخلص… يتجدد"}],["tree",{"title":"أقسام الكلمة في اللغة العربية","roots":"الحروف الهجائية\nالسماع والقراءة\nفهم المعنى","trunk":"الكلمة: لفظ يدل على معنى","branches":"الاسم | محمد، مكة، كتاب\nالفعل | كتبَ، يكتبُ، اكتبْ\nالحرف | في، من، على","fruit":"جملة مفيدة"}]]},{"id":"biz","pid":"d-biz","name":"لوحات إيلان للمشاريع","en":"Eilan Business Boards","icon":"store","desc":"لوحات جاهزة ومشروحة لأصحاب المشاريع: فكرة المشروع، الإطلاق، القرار، العميل، البراند، والتسويق.","titles":[["canvas","لوحة مشروع: متجر هدايا رقمية"],["roadmap","إطلاق متجرك الرقمي في ٩٠ يوم"],["matrix","وين أبيع منتجاتي الرقمية؟"],["iceberg","نجاح المشروع الصغير"],["cycle","دورة حياة العميل"],["layers","طبقات هوية البراند"],["diagram","كيف يشتغل المتجر الإلكتروني"],["blueprint","مطبخ تحضير الطلبات"],["timeline","خطة محتوى شهر كامل"],["exploded","تفكيك منتج رقمي ناجح"],["tree","شجرة قنوات التسويق"],["sketch","كيف تكتب إعلان يبيع"]],"samples":[["canvas",{"title":"لوحة مشروع: متجر هدايا رقمية","b1":"الهدايا التقليدية مكررة\nما في وقت للتسوّق","b2":"موظفين مشغولين\nطلاب جامعة","b3":"بطاقات وهدايا رقمية مخصصة\nتوصل فوراً","b4":"تصميم باسم الشخص خلال دقائق","b5":"انستقرام وتيك توك\nواتساب","b6":"بيع مباشر\nباقات المناسبات","b7":"أدوات تصميم\nإعلانات","b8":"طلبات أسبوعية\nعملاء رجعوا","b9":"قوالب حصرية\nسرعة التسليم","risk":"هل الناس تدفع على هدية رقمية؟"}]]},{"id":"habits","pid":"d-habits","name":"عادات إيلان وتطوير الذات","en":"Eilan Habits & Growth","icon":"rocket","desc":"رسمات تحفّزك وتنظّمك: العادات، الأهداف، الثقة، الوقت، والتوازن — تنفع بوستر أو خلفية.","titles":[["cycle","دورة العادة"],["roadmap","هدفك في ٣٠ يوم"],["layers","هرم الاحتياجات"],["notes","روتين صباح هادي"],["iceberg","الثقة بالنفس"],["tree","شجرة إدارة الوقت"],["info","النوم والمذاكرة"],["timeline","يوم منتج"],["diagram","عجلة التوازن"],["sketch","مهارات التواصل"],["matrix","أي عادة أبدأ فيها؟"]],"samples":[["cycle",{"title":"دورة العادة","stages":"الإشارة | شي يذكّرك تبدأ\nالرغبة | شعور يدفعك\nالفعل | العادة نفسها *\nالمكافأة | إحساس حلو يثبّتها","center":"عادة ثابتة"}]]},{"id":"world","pid":"d-world","name":"عالم إيلان المرسوم","en":"Eilan Drawn World","icon":"home","desc":"معلومات عامة ممتعة مرسومة للعائلة والسوشال: التقنية، الفضاء، الطبيعة، الأكل، والكشتات.","titles":[["timeline","قصة الإنترنت"],["exploded","برجر بيتي مثالي"],["diagram","ليش الطيارة تطير؟"],["cycle","أطوار القمر"],["layers","طبقات الغلاف الجوي"],["info","الجمل: سفينة الصحراء"],["iceberg","وش وراء كوب القهوة؟"],["tree","شجرة الألوان"],["roadmap","كشتة مثالية مع الشلّة"],["notes","حقائق عن النحل"],["blueprint","تجهيز حفلة عيد ميلاد"],["sketch","قهوة مختصة في البيت"]],"samples":[["timeline",{"title":"قصة الإنترنت","events":"1969 | أربانت ARPANET | أول شبكة تربط أجهزة *\n1971 | أول بريد إلكتروني | رسائل بين الأجهزة\n1991 | الشبكة العنكبوتية | مواقع للجميع *\n1998 | تأسيس قوقل | البحث صار سهل\n2004 | فيسبوك | بداية الشبكات الاجتماعية\n2007 | آيفون | الإنترنت في جيبك\n2022 | ChatGPT | الذكاء الاصطناعي للجميع","next":"وش الشي الجاي؟"}],["exploded",{"title":"برجر بيتي مثالي","parts":"خبز علوي | يمسك كل شي\nصوص | النكهة الأساسية\nخس وطماطم | انتعاش\nجبن | يذوب ويربط\nلحم مشوي | قلب البرجر *\nخبز سفلي | قاعدة ما تتشرّب"}]]}];
const DW_BUNDLE={id:'d-all',name:'مكتبة رسمات إيلان الكاملة',en:'Eilan Visuals Library',price:89};
DW.forEach(p=>{if(!S.products.some(x=>x.id===p.pid)&&!(S.custom&&S.custom['no_'+p.pid]))S.products.push({id:p.pid,name:p.name+' — '+p.titles.length+' رسمة',en:p.en,cat:'products',price:30,icon:'🖼️',c:['#2F7A52','#14150F'],kind:'digital',badge:'جديد',rating:5,sales:0,
  note:'📄 ملف PDF بالعرض: '+p.titles.length+' رسمة جاهزة بتصميم إيلان، للآيباد والكمبيوتر وينطبع A4 — مع فهرس بروابط.',desc:p.desc+' المحتوى: '+p.titles.map(t=>t[1]).join('، ')+'.',tags:['رسمات','بصري','ملخصات','بوستر','PDF','visual',p.name]})});
if(!S.products.some(x=>x.id===DW_BUNDLE.id))S.products.push({id:DW_BUNDLE.id,name:DW_BUNDLE.name,en:DW_BUNDLE.en,cat:'products',price:DW_BUNDLE.price,icon:'🎁',c:['#4B2A7B','#14150F'],kind:'digital',badge:'باقة',rating:5,sales:0,
  note:'🎁 الأربع مجموعات: '+DW.reduce((a,p)=>a+p.titles.length,0)+' رسمة — بدل '+DW.length*30+' ر.س.',desc:'كل رسمات إيلان في باقة وحدة: '+DW.map(p=>p.name).join('، ')+'.',tags:['رسمات','باقة','بصري','visual']});
function dwPng(svg,W,H,name){const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=W*2;c.height=H*2;const x=c.getContext('2d');x.scale(2,2);x.drawImage(img,0,0,W,H);
 c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name+'.png';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);toast('🖼️ '+gzL('انحفظت الصورة','Image saved'))},'image/png')};img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
ACT.dwview=async d=>{const p=DW.find(x=>x.id===d.p),s=p&&p.samples[+d.i];if(!s)return;
 openModal(`<div class="mh"><h3>🎁 ${gzL('عينة مجانية','Free sample')} · ${esc(s[1].title||'')}</h3><button class="icon-btn" data-act="closemodal">${I.x}</button></div>
 <div class="dw-big" style="border-radius:14px;overflow:hidden">${vlSvg(s[0],s[1],'paper').replace('style="','style="width:100%;height:auto;display:block;')}</div>
 <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px" class="no-ei"><button class="btn g" data-act="dwdl" data-p="${p.id}" data-i="${d.i}">${GZI.dl}${gzL('حمّل الصورة مجاناً','Download free')}</button><button class="btn p" data-go="eilan://product/${p.pid}" data-act="closemodal">${GZI.bag}${gzL('المجموعة كاملة','Full pack')} — 30 ${gzL('ر.س','SAR')}</button></div>`,true)};
ACT.dwdl=async d=>{const p=DW.find(x=>x.id===d.p),s=p.samples[+d.i];await vlLoadFont();const [W,H]=vlSize(s[0]);dwPng(vlSvg(s[0],s[1],'paper',true),W,H,'Eilan-'+p.en.replace(/\s+/g,'-')+'-'+(+d.i+1))};
P.drawn={icon:'🖼️',title:()=>gzL('رسمات إيلان','Eilan Visuals'),html:()=>{const total=DW.reduce((a,p)=>a+p.titles.length,0),b=S.products.find(x=>x.id==='d-all')||{};return `
 <div class="dw-hero"><div><div class="eyebrow">EILAN VISUALS</div><h1>${gzL('رسمات','')} <span class="grad-t">${gzL('إيلان','Eilan Visuals')}</span></h1>
  <p>${gzL(`${total} رسمة جاهزة بتصميم إيلان: ملخصات دراسية، لوحات مشاريع، عادات وتطوير ذات، ومعلومات عامة ممتعة. كل مجموعة ملف PDF للآيباد والطباعة — وعندك عينات مجانية تحمّلها الحين.`,`${total} ready-made visuals: study summaries, business boards, habits & growth, and fun facts. Each pack is a PDF for iPad & print — free samples below.`)}</p></div>
  <button class="btn" data-go="eilan://visual">🎨 ${gzL('ارسم موضوعك بنفسك','Draw your own topic')}</button></div>
 <div class="dw-all card no-ei"><b>🎁 ${gzL('المكتبة الكاملة','The full library')}</b><span class="mu">${gzL(`الأربع مجموعات · ${total} رسمة · بدل ${DW.length*30} ر.س`,`All 4 packs · ${total} visuals`)}</span><span class="sp"></span><button class="btn g" data-go="eilan://product/d-all">${GZI.bag}${+b.price||89} ${gzL('ر.س','SAR')}</button></div>
 ${DW.map(p=>{const sm=p.samples.map(s=>s[1].title);return `<section class="dw-pack card"><div class="dw-head">${gzCube(p.icon)}<div><h2>${esc(p.name)} <bdi dir="ltr">${esc(p.en)}</bdi></h2><p>${esc(p.desc)}</p></div><span class="sp"></span>
  <div class="no-ei" style="display:flex;gap:8px;align-items:center"><span class="gzc-tag pr">${p.titles.length} ${gzL('رسمة','visuals')}</span><button class="btn g" data-go="eilan://product/${p.pid}">${GZI.bag}30 ${gzL('ر.س','SAR')}</button></div></div>
  <div class="dw-grid">${p.samples.map((s,i)=>`<button class="dw-t" data-act="dwview" data-p="${p.id}" data-i="${i}">${vlSvg(s[0],s[1],'paper')}<span class="tag">${gzL('مجانية','Free')}</span><span class="cap">${esc(s[1].title)}</span></button>`).join('')}
   ${p.titles.filter(t=>!sm.includes(t[1])).map(t=>`<div class="dw-t lock">${gzCube((VL_T[t[0]]||{}).ic||'spark')}<span class="lk">🔒</span><span class="cap">${esc(t[1])} · <span style="opacity:.7">${esc((VL_T[t[0]]||{}).n||'')}</span></span></div>`).join('')}</div></section>`}).join('')}`}};
/* links into the gallery */
{const _v=P.visual.html;P.visual.html=r=>_v(r).replace('<div class="vl-quota no-ei" id="vlQuota">',`<div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end"><button class="btn sm" data-go="eilan://drawn">🖼️ ${gzL('رسمات جاهزة','Ready-made visuals')}</button><div class="vl-quota no-ei" id="vlQuota">`).replace('</div></div>\n <div class="vl-wrap">','</div></div></div>\n <div class="vl-wrap">')}
{const _l=P.learn.html;P.learn.html=r=>_l(r).replace(`<button class="btn g" data-go="eilan://visual">`,`<button class="btn" data-go="eilan://drawn">🖼️ ${gzL('رسمات جاهزة','Ready-made')}</button><button class="btn g" data-go="eilan://visual">`)}
{const _pp=P.product.html;P.product.html=r=>{let h=_pp(r);const p=DW.find(x=>x.pid===r.id);if(!p&&r.id!=='d-all')return h;
 const v=`<div class="card no-ei" style="padding:14px;margin:14px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center"><b style="flex:1;min-width:200px">📄 ${gzL('الملف يوصلك بعد الشراء — PDF بالعرض للآيباد والطباعة.','Delivered as a landscape PDF after purchase.')}</b><button class="btn g" data-go="eilan://drawn">🎁 ${gzL('شوف العينات المجانية','See free samples')}</button></div>`;
 const i=h.indexOf('<div class="acts">');return i>-1?h.slice(0,i)+v+h.slice(i):h+v}}
</script>
